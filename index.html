function render(){document.getElementById("app").innerHTML=home()}function catalog(x="Todos"){filter=x;search="";closeMenu();document.getElementById("app").innerHTML=renderCatalog();window.scrollTo(0,0)}
function productDetail(id){let p=products.find(x=>x.id===id);document.getElementById("app").innerHTML=`<div class="detail"><button class="btn" onclick="catalog(filter)">← VOLVER</button><div class="detail-grid" style="margin-top:25px"><div><div class="gallery-main">${p.img?`<img src="${p.img}" alt="${p.nombre}">`:`<div class="placeholder">${p.nombre}<br>${p.ml} ml</div>`}</div><div class="thumbs"><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div></div></div><div><div class="eyebrow">${p.categoria} · ${p.genero}</div><h1>${p.nombre}</h1><div class="price" style="font-size:28px">${money(p.precio)}</div><p class="muted">${p.ml} ml · ● Disponible</p><p style="line-height:1.7">${p.descripcion}</p><button class="btn gold" onclick="addCart(${p.id})">AGREGAR AL CARRITO</button><button class="btn" style="margin-left:8px" onclick="toggleFav(${p.id});productDetail(${p.id})">${fav.includes(p.id)?"♥ EN FAVORITOS":"♡ FAVORITOS"}</button><div class="notes"><div class="note"><b>Salida</b>${p.salida}</div><div class="note"><b>Corazón</b>${p.corazon}</div><div class="note"><b>Fondo</b>${p.fondo}</div></div><div class="info-list"><div><b>Familia olfativa</b>${p.familia}</div><div><b>Tamaño</b>${p.ml} ml</div><div><b>Duración</b>Consultar</div><div><b>Proyección</b>Consultar</div><div><b>Uso</b>Diario / salidas / ocasiones especiales</div><div><b>¿Dónde usarlo?</b>Espacios cerrados, salidas y eventos</div></div></div></div></div>`;window.scrollTo(0,0)}
function toggleFav(id){fav.includes(id)?fav=fav.filter(x=>x!==id):fav.push(id);save();if(document.getElementById("app").innerHTML.includes("Destacados"))render();else catalog(filter)}
function showFavorites(){closeMenu();let a=products.filter(p=>fav.includes(p.id));document.getElementById("app").innerHTML=`<section><div class="eyebrow">Guardados</div><h2>Favoritos</h2>${a.length?`<div class="grid">${a.map(card).join("")}</div>`:`<div class="empty"><h3>Todavía no tienes perfumes favoritos.</h3><button class="btn" onclick="catalog('Todos')">DESCUBRIR PERFUMES</button></div>`}</section>`}
function addCart(id){let x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id,qty:1});save();openCart()}
function openCart(){document.getElementById("cart").classList.add("open");renderCart()}function closeCart(){document.getElementById("cart").classList.remove("open")}
function renderCart(){let box=document.getElementById("cartItems");if(!cart.length){box.innerHTML='<div class="empty">Tu carrito está vacío.</div>';document.getElementById("cartTotal").innerHTML="";return}let total=0;box.innerHTML=cart.map(x=>{let p=products.find(p=>p.id===x.id),sub=p.precio*x.qty;total+=sub;return `<div class="cart-item"><div class="cart-thumb">${p.nombre}</div><div><b>${p.nombre}</b><div class="muted">${money(p.precio)}</div><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button>${x.qty}<button onclick="changeQty(${p.id},1)">+</button><button onclick="removeCart(${p.id})" style="border:0;background:none">🗑</button></div></div><b>${money(sub)}</b></div>`}).join("");document.getElementById("cartTotal").innerHTML=`<div class="cart-total">Total: ${money(total)}</div>`}
function changeQty(id,n){let x=cart.find(x=>x.id===id);x.qty+=n;if(x.qty<=0)cart=cart.filter(y=>y.id!==id);save();renderCart()}function removeCart(id){cart=cart.filter(x=>x.id!==id);save();renderCart()}
function checkout(){if(!cart.length)return;let total=cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).precio*x.qty,0);document.getElementById("modalBody").innerHTML=`<h2>Finalizar pedido</h2><p class="muted">Completá tus datos y te prepararemos el pedido.</p><div class="form"><input id="cname" placeholder="Nombre y apellido"><input id="ctel" placeholder="Teléfono"><input id="cemail" placeholder="Email"><input id="caddress" placeholder="Dirección"><input id="ccity" placeholder="Ciudad"><input id="cprov" placeholder="Provincia"><input id="cp" placeholder="Código postal"><button class="btn gold" onclick="sendOrder()">ENVIAR PEDIDO POR WHATSAPP · ${money(total)}</button></div>`;document.getElementById("modal").classList.add("open")}
function sendOrder(){let name=document.getElementById("cname").value||"Cliente";let lines=cart.map(x=>{let p=products.find(p=>p.id===x.id);return `• ${p.nombre} (${p.ml} ml) x${x.qty} — ${money(p.precio*x.qty)}`}).join("%0A");let total=cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).precio*x.qty,0);let msg=`Hola, soy ${name}. Quiero hacer este pedido:%0A${lines}%0A%0ATotal: ${money(total)}`;window.open("https://wa.me/5491144293913?text="+msg,"_blank")}
function showContact(){closeMenu();document.getElementById("app").innerHTML=`<section><div class="eyebrow">Estamos para ayudarte</div><h2>Contacto</h2><div class="detail-grid"><div><h3>WhatsApp</h3><p class="muted">Reemplazá el número en el código por el WhatsApp de AromaLParfum.</p><h3>Instagram</h3><p class="muted">@AromaLParfum</p><h3>Horarios</h3><p class="muted">Configurá tus horarios de atención.</p></div><form class="form" onsubmit="event.preventDefault();alert('Mensaje preparado. Conectá este formulario a tu correo o backend para recibirlo.')"><input placeholder="Nombre"><input type="email" placeholder="Email"><textarea placeholder="Mensaje"></textarea><button class="btn gold">ENVIAR MENSAJE</button></form></div></section>`}
function showAbout(){closeMenu();document.getElementById("app").innerHTML=`<section><div class="eyebrow">Nuestra historia</div><h2>Acerca de AromaLParfum</h2><p style="max-width:800px;line-height:2">AromaLParfum nace de nuestra pasión por el mundo de las fragancias y de la idea de acercar perfumes únicos a cada persona.</p><p style="max-width:800px;line-height:2">Creamos este espacio para que puedas descubrir fragancias árabes, argentinas, de diseñador y de nicho, seleccionadas para diferentes estilos, momentos y personalidades.</p><p style="max-width:800px;line-height:2">Para nosotros, un perfume no es simplemente una fragancia: es una forma de expresión, un recuerdo y una parte de nuestra identidad.</p><p style="max-width:800px;line-height:2">En AromaLParfum queremos ayudarte a encontrar esa fragancia que se sienta realmente tuya.</p></section>`}
function showAdmin(){closeMenu();document.getElementById("app").innerHTML=`<section class="admin"><div class="eyebrow">Gestión local</div><h2>Administración</h2><p class="muted">Esta versión permite editar los datos de productos en tu navegador. Para que sea un panel privado real, sincronizado y con subida de imágenes, hace falta un backend/base de datos.</p><table><thead><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Guardar</th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.nombre} · ${p.ml} ml</td><td><input id="pr${p.id}" type="number" value="${p.precio}"></td><td><input id="st${p.id}" type="number" value="${p.stock}"></td><td><button class="btn" onclick="adminSave(${p.id})">GUARDAR</button></td></tr>`).join("")}</tbody></table></section>`}
function adminSave(id){let p=products.find(x=>x.id===id);p.precio=Number(document.getElementById("pr"+id).value);p.stock=Number(document.getElementById("st"+id).value);alert("Producto actualizado en esta sesión.");}
function openMenu(){document.getElementById("menu").classList.add("open")}function closeMenu(){document.getElementById("menu").classList.remove("open")}function toggleSub(){document.getElementById("submenu").classList.toggle("open")}function closeModal(){document.getElementById("modal").classList.remove("open")}function goHome(){closeMenu();render();window.scrollTo(0,0)}
updateCounts();render();
</script>
</body>
</html>
