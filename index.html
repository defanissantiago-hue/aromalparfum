function normalizeStoragePath(
  raw
)
{
  const value =
  String(
    raw ??
    ""
  ).trim();

  if (
    value === ""
  )
  {
    return {
      kind:
      "empty",

      value:
      "",
    };
  }

  if (
    !/^https?:\/\//i.test(
      value
    )
  )
  {
    return {
      kind:
      "storage",

      value:
      value.replace(
        new RegExp(
          "^" +
          CONFIG.storageBucket +
          "/"
        ),
        ""
      ),
    };
  }

  try
  {
    const url =
    new URL(
      value
    );

    const publicMarker =
    "/storage/v1/object/public/" +
    CONFIG.storageBucket +
    "/";

    const signMarker =
    "/storage/v1/object/sign/" +
    CONFIG.storageBucket +
    "/";

    const authenticatedMarker =
    "/storage/v1/object/authenticated/" +
    CONFIG.storageBucket +
    "/";

    if (
      url.pathname.includes(
        publicMarker
      )
    )
    {
      return {
        kind:
        "storage",

        value:
        decodeURIComponent(
          url.pathname.split(
            publicMarker
          )[1]
          ||
          ""
        ),
      };
    }

    if (
      url.pathname.includes(
        signMarker
      )
    )
    {
      return {
        kind:
        "storage",

        value:
        decodeURIComponent(
          url.pathname.split(
            signMarker
          )[1]
          ||
          ""
        ),
      };
    }

    if (
      url.pathname.includes(
        authenticatedMarker
      )
    )
    {
      return {
        kind:
        "storage",

        value:
        decodeURIComponent(
          url.pathname.split(
            authenticatedMarker
          )[1]
          ||
          ""
        ),
      };
    }

    return {
      kind:
      "external",

      value:
      value,
    };
  }
  catch (
    error
  )
  {
    return {
      kind:
      "external",

      value:
      value,
    };
  }
}

async function resolveImageValue(
  raw
)
{
  const normalized =
  normalizeStoragePath(
    raw
  );

  if (
    normalized.kind ===
    "empty"
  )
  {
    return {
      path:
      "",

      url:
      "",
    };
  }

  if (
    normalized.kind ===
    "external"
  )
  {
    return {
      path:
      "",

      url:
      normalized.value,
    };
  }

  const result =
  await supabaseClient
    .storage
    .from(
      CONFIG.storageBucket
    )
    .createSignedUrl(
      normalized.value,
      CONFIG.signedUrlSeconds
    );

  if (
    result.error
  )
  {
    console.warn(
      "No se pudo firmar imagen:",
      normalized.value,
      result.error.message
    );

    return {
      path:
      normalized.value,

      url:
      "",
    };
  }

  return {
    path:
    normalized.value,

    url:
    result.data?.signedUrl
    ||
    "",
  };
}

async function mapWithConcurrency(
  items,
  limit,
  worker
)
{
  const list =
  Array.from(
    items
    ||
    []
  );

  const concurrency =
  Math.max(
    1,
    Math.min(
      Number(
        limit
      )
      ||
      1,
      list.length
      ||
      1
    )
  );

  let cursor =
  0;

  const runners =
  Array.from(
    {
      length:
      concurrency,
    },
    async () =>
    {
      while (
        true
      )
      {
        const index =
        cursor;

        cursor +=
        1;

        if (
          index >=
          list.length
        )
        {
          return;
        }

        await worker(
          list[
            index
          ],
          index
        );
      }
    }
  );

  await Promise.all(
    runners
  );
}

  false;

  state.productGalleryLoaded =
  new Set();

  state.productGalleryLoading =
  new Map();

  const storageItems =
  [];

  for (
    const product of
    state.products
  )
  {
    if (
      !product.imagen_url
    )
    {
      continue;
    }

    const normalized =
    normalizeStoragePath(
      product.imagen_url
    );

    const id =
    Number(
      product.id
    );

    if (
      normalized.kind ===
      "external"
    )
    {
      state.productImages[
        id
      ] =
      [
        normalized.value,
      ];

      state.productImageMeta[
        id
      ] =
      [
        {
          id:
          null,

          product_id:
          id,

          path:
          "",

          raw:
          product.imagen_url,

          url:
          normalized.value,

          orden:
          0,

          legacy:
          true,

          mainOnly:
          true,
        },
      ];

      continue;
    }

    if (
      normalized.kind ===
      "storage"
    )
    {
      storageItems.push(
        {
          product:
          product,

          path:
          normalized.value,
        }
      );
    }
  }

  const chunkSize =
  100;

  for (
    let start = 0;
    start < storageItems.length;
    start += chunkSize
  )
  {
    const chunk =
    storageItems.slice(
      start,
      start +
      chunkSize
    );

    const paths =
    chunk.map(
      item =>
      item.path
    );

    const batch =
    await supabaseClient
      .storage
      .from(
        CONFIG.storageBucket
      )
      .createSignedUrls(
        paths,
        CONFIG.signedUrlSeconds
      );

    if (
      batch.error
    )
    {
      console.warn(
        "Firma múltiple de imágenes:",
        batch.error.message
      );

      await mapWithConcurrency(
        chunk,
        12,
        async item =>
        {
          const resolved =
          await resolveImageValue(
            item.path
          );

          if (
            !resolved.url
          )
          {
            return;
          }

          const id =
          Number(
            item.product.id
          );

          state.productImages[
            id
          ] =
          [
            resolved.url,
          ];

          state.productImageMeta[
            id
          ] =
          [
            {
              id:
              null,

              product_id:
              id,

              path:
              item.path,

              raw:
              item.product.imagen_url,

              url:
              resolved.url,

              orden:
              0,

              legacy:
              true,

              mainOnly:
              true,
            },
          ];
        }
      );

      continue;
    }

    const signed =
    batch.data
    ||
    [];

    for (
      let index = 0;
      index < chunk.length;
      index += 1
    )
    {
      const item =
      chunk[
        index
      ];

      const signedItem =
      signed[
        index
      ]
      ||
      {};

      const url =
      signedItem.signedUrl
      ||
      signedItem.signedURL
      ||
      "";

      if (
        !url
      )
      {
        continue;
      }

      const id =
      Number(
        item.product.id
      );

      state.productImages[
        id
      ] =
      [
        url,
      ];

      state.productImageMeta[
        id
      ] =
      [
        {
          id:
          null,

          product_id:
          id,

          path:
          item.path,

          raw:
          item.product.imagen_url,

          url:
          url,

          orden:
          0,

          legacy:
          true,

          mainOnly:
          true,
        },
      ];
    }
  }
}

async function ensureProductGallery(
  productId
)
{
  const id =
  Number(
    productId
  );

  if (
    !id ||
    state.productGalleryLoaded.has(
      id
    )
  )
  {
    return;
  }

  if (
    state.productGalleryLoading.has(
      id
    )
  )
  {
    return state.productGalleryLoading.get(
      id
    );
  }

  const promise =
  (
    async () =>
    {
      const result =
      await supabaseClient
        .from(
          CONFIG.productImagesTable
        )
        .select(
          "*"
        )
        .eq(
          "product_id",
          id
        )
        .order(
          "orden",
          {
            ascending:
            true,
          }
        )
        .order(
          "id",
          {
            ascending:
            true,
          }
        );

      if (
        result.error
      )
      {
        console.warn(
          "product_images detalle:",
          result.error.message
        );

        state.productGalleryLoaded.add(
          id
        );

        return;
      }

      const rows =
      result.data
      ||
      [];

      if (
        rows.length === 0
      )
      {
        state.productGalleryLoaded.add(
          id
        );

        return;
      }

      const resolvedRows =
      [];

      await mapWithConcurrency(
        rows,
        8,
        async row =>
        {
          const resolved =
          await resolveImageValue(
            row.image_url
          );

          resolvedRows.push(
            {
              row:
              row,

              resolved:
              resolved,
            }
          );
        }
      );

      resolvedRows.sort(
        (
          a,
          b
        ) =>
        {
          const orderDiff =
          asNumber(
            a.row.orden,
            0
          )
          -
          asNumber(
            b.row.orden,
            0
          );

          if (
            orderDiff !== 0
          )
          {
            return orderDiff;
          }

          return (
            asNumber(
              a.row.id,
              0
            )
            -
            asNumber(
              b.row.id,
              0
            )
          );
        }
      );

      const urls =
      [];

      const meta =
      [];

      for (
        const item of
        resolvedRows
      )
      {
        const row =
        item.row;

        const resolved =
        item.resolved;

        if (
          resolved.url &&
          !urls.includes(
            resolved.url
          )
        )
        {
          urls.push(
            resolved.url
          );
        }

        meta.push(
          {
            id:
            row.id,

            product_id:
            id,

            path:
            resolved.path
            ||
            normalizeStoragePath(
              row.image_url
            ).value,

            raw:
            row.image_url,

            url:
            resolved.url,

            orden:
            asNumber(
              row.orden,
              0
            ),
          }
        );
      }

      if (
        urls.length
      )
      {
        state.productImages[
          id
        ] =
        urls;
      }

      state.productImageMeta[
        id
      ] =
      meta;

      state.productGalleryLoaded.add(
        id
      );
    }
  )();

  state.productGalleryLoading.set(
    id,
    promise
  );

  try
  {
    await promise;
  }
  finally
  {
    state.productGalleryLoading.delete(
      id
    );
  }

  if (
    state.route ===
    "product" &&
    Number(
      state.routePayload?.id
    ) ===
    id
  )
  {
    renderCurrentRoute();
  }
}

async function loadProductImages()
{
  state.productImages =
  {};

  state.productImageMeta =
  {};

  const result =
  await supabaseClient
    .from(
      CONFIG.productImagesTable
    )
    .select(
      "*"
    )
    .order(
      "orden",
      {
        ascending:
        true,
      }
    )
    .order(
      "id",
      {
        ascending:
        true,
      }
    );

  if (
    result.error
  )
  {
    console.warn(
      "product_images:",
      result.error.message
    );

    await loadLegacyProductImages();

    return;
  }

  const rows =
  result.data
  ||
  [];

  const resolvedRows =
  new Array(
    rows.length
  );

  await mapWithConcurrency(
    rows,
    12,
    async (
      row,
      index
    ) =>
    {
      resolvedRows[
        index
      ] =
      {
        row:
        row,

        resolved:
        await resolveImageValue(
          row.image_url
        ),
      };
    }
  );

  for (
    const item of
    resolvedRows
  )
  {
    if (
      !item
    )
    {
      continue;
    }

    const row =
    item.row;

    const resolved =
    item.resolved;

    const productId =
    asNumber(
      row.product_id,
      0
    );

    if (
      !state.productImages[
        productId
      ]
    )
    {
      state.productImages[
        productId
      ] =
      [];
    }

    if (
      !state.productImageMeta[
        productId
      ]
    )
    {
      state.productImageMeta[
        productId
      ] =
      [];
    }

    if (
      resolved.url
    )
    {
      state.productImages[
        productId
      ].push(
        resolved.url
      );
    }

    state.productImageMeta[
      productId
    ].push(
      {
        id:
        row.id,

        product_id:
        productId,

        path:
        resolved.path
        ||
        normalizeStoragePath(
          row.image_url
        ).value,

        raw:
        row.image_url,

        url:
        resolved.url,

        orden:
        asNumber(
          row.orden,
          0
        ),
      }
    );
  }

  await loadLegacyProductImages();

  state.allProductImagesLoaded =
  true;
}

      return (

function getSiteCoverUrl(

)
{
  return (

function getSiteCoverPath(

function normalizeCoverPosition(
  value
)
{
  const safe =
  String(
    value || "center"
  )
  .toLowerCase();

  if (
    safe === "left" ||
    safe === "right"
  )
  {
    return safe;
  }

  return "center";
}

function getSiteCoverPosition(
  slot
)
{
  const positions =
  getSiteSettingObject(
    "cover_positions"
  );

  return normalizeCoverPosition(
    positions?.[slot]
  );
}

function coverPositionCss(
  value
)
{
  const position =
  normalizeCoverPosition(
    value
  );

  if (position === "left")
  {
    return "left center";
  }

  if (position === "right")
  {
    return "right center";
  }

  return "center center";
}

async function loadSiteCoverUrls()
{
  state.siteCoverMeta = {};
  state.collectionCoverMeta = {};

  const covers =
  getSiteSettingObject(
    "cover_images"
  );

  const collectionCovers =
  getSiteSettingObject(
    "collection_covers"
  );

  for (
    const [slot, raw] of
    Object.entries(
      covers || {}
    )
  )
  {
    if (!raw)
    {
      continue;
    }

    state.siteCoverMeta[slot] =
    await resolveImageValue(
      raw
    );
  }

  for (
    const [slug, raw] of
    Object.entries(
      collectionCovers || {}
    )
  )
  {
    if (!raw)
    {
      continue;
    }

    state.collectionCoverMeta[slug] =
    await resolveImageValue(
      raw
    );
  }
}

function renderCurrentRoute()
{
  const app =
  document.getElementById(
    "app"
  );

  if (
    !app
  )
  {
    return;
  }

  if (
    state.loading
  )
  {
    setAppLoading();

    return;
  }

  switch (
    state.route
  )
  {
    case "catalog":
    {
      app.innerHTML =
      renderCatalogPage();

      break;
    }

    case "best":
    {
      app.innerHTML =
      renderBestSellersPage();

      break;
    }

    case "collections":
    {
      app.innerHTML =
      renderCollectionsPage();

      break;
    }

    case "collection":
    {
      app.innerHTML =
      renderCollectionDetailPage(
        state.routePayload.slug
      );

      break;
    }

    case "decants":
    {
      app.innerHTML =
      renderDecantBuilderPage();

      break;
    }

function getFeaturedProducts()
{
  const explicit =
  state.products
  .filter(
    product =>
    product.destacado === true &&
    product.stock > 0
  );

  if (
    explicit.length
  )
  {
    return explicit;
  }

  return state.products
  .filter(
    product =>
    product.stock > 0
  )
  .slice(
    0,
    10
  );
}

function getNewProducts()
{
  return state.products
  .filter(
    product =>
    isNewProduct(
      product
    )
  )
  .sort(
    (
      a,
      b
    ) =>
    {
      const dateA =
      new Date(
        a.created_at
        ||
        0
      )
      .getTime();

      const dateB =
      new Date(
        b.created_at
        ||
        0
      )
      .getTime();

      return dateB - dateA;
    }
  );
}

function getBestSellerProducts()
{
  return [
    ...state.products,
  ]
  .sort(
    (
      a,
      b
    ) =>
    {
      const popularityDiff =
      getPopularity(
        b.id
      )
      -
      getPopularity(
        a.id
      );

      if (
        popularityDiff !== 0
      )
      {
        return popularityDiff;
      }

      return (
        Number(
          b.destacado
        )
        -
        Number(
          a.destacado
        )
      );
    }
  );
}

function getHeroCollections()
{
  const collections =
  state.collections
  .filter(
    collection =>
    collection.activo !== false
  );

  return collections.length
  ?

  :
  CONFIG.collectionFallbacks;

function getProductsForCollection(
  collection
)
{
  if (
    !collection
  )
  {
    return [];
  }

  const station =
  normalizeText(
    collection.estacion
  );

  const occasion =
  normalizeText(
    collection.ocasion
  );

  return state.products.filter(
    product =>
    {
      if (
        collection.tipo === "seasonal" &&
        station
      )
      {
        return arrayFromDb(
          product.estaciones
        )
        .some(
          value =>
          normalizeText(
            value
          ) ===
          station
        );
      }

      if (
        collection.tipo === "occasion" &&
        occasion
      )
      {
        return arrayFromDb(
          product.ocasiones
        )
        .some(
          value =>
          normalizeText(
            value
          ) ===
          occasion
        );
      }

      return false;
    }
  );
}

function getHeroProductForCollection(
  collection
)
{
  const matches =
  getProductsForCollection(
    collection
  );

  const imageMatch =
  matches.find(
    product =>
    Boolean(
      getProductMainImage(
        product
      )
    )
  );

  return (
    imageMatch
    ||
    matches[0]
    ||
    getFeaturedProducts().find(
      product =>
      Boolean(
        getProductMainImage(
          product
        )
      )
    )
    ||
    getFeaturedProducts()[0]
    ||
    state.products[0]
    ||
    null
  );
}

function renderProductCard(
  product,
  options = {}
)
{
  const image =
  getProductMainImage(
    product
  );

  const badges =
  [];

  if (
    isNewProduct(
      product
    )
  )
  {
    badges.push(
      {
        type:
        "new",

        text:
        t(
          "product.new"
        ),
      }
    );
  }

  if (
    product.destacado
  )
  {
    badges.push(
      {
        type:
        "featured",

        text:
        t(
          "product.featured"
        ),
      }
    );
  }

  if (
    options.badge === "best" ||
    getPopularity(
      product.id
    ) > 0 &&
    getBestSellerProducts()
    .slice(
      0,
      5
    )
    .some(
      item =>
      item.id === product.id
    )
  )
  {
    badges.push(
      {
        type:
        "best",

        text:
        t(
          "product.best"
        ),
      }
    );
  }

  const notes =
  [
    localizedField(
      product,
      "salida"
    ),

    localizedField(
      product,
      "corazon"
    ),
  ]
  .filter(
    Boolean
  )
  .join(
    " · "
  );

  return `

function getCatalogProducts()
{
  const filter =
  state.catalogFilter;

  const searchTerm =
  normalizeText(
    state.catalogSearch
  );

  let list =
  state.products.filter(
    product =>
    {
      if (
        filter === "Nuevo"
      )
      {
        if (
          !isNewProduct(
            product
          )
        )
        {
          return false;
        }
      }
      else if (
        filter === "Destacado"
      )
      {
        if (
          !product.destacado
        )
        {
          return false;
        }
      }
      else if (
        filter !== "Todos"
      )
      {
        const matches =
        [
          product.categoria,
          product.genero,
          product.tipo_producto_slug,
          product.tipo_producto,
        ]
        .some(
          value =>
          normalizeText(
            value
          ) ===
          normalizeText(
            filter
          )
        );

        if (
          !matches
        )
        {
          return false;
        }
      }

      if (
        searchTerm
      )
      {
        const haystack =
        normalizeText(
          [
            product.nombre,
            product.marca,
            product.categoria,
            product.genero,
            product.familia,
            product.salida,
            product.corazon,
            product.fondo,
          ]
          .join(
            " "
          )
        );

        if (
          !haystack.includes(
            searchTerm
          )
        )
        {
          return false;
        }
      }

      return true;
    }
  );

  switch (
    state.catalogSort
  )
  {
    case "low":
    {
      list.sort(
        (
          a,
          b
        ) =>
        a.precio -
        b.precio
      );

      break;
    }

    case "high":
    {
      list.sort(
        (
          a,
          b
        ) =>
        b.precio -
        a.precio
      );

      break;
    }

    case "name":
    {
      list.sort(
        (
          a,
          b
        ) =>
        a.nombre.localeCompare(
          b.nombre,
          currentLanguage()
        )
      );

      break;
    }

    case "stock":
    {
      list.sort(
        (
          a,
          b
        ) =>
        b.stock -
        a.stock
      );

      break;
    }

    default:
    {
      list.sort(
        (
          a,
          b
        ) =>
        {
          const featuredDiff =
          Number(
            b.destacado
          )
          -
          Number(
            a.destacado
          );

          if (
            featuredDiff !== 0
          )
          {
            return featuredDiff;
          }

          return (
            getPopularity(
              b.id
            )
            -
            getPopularity(
              a.id
            )
          );
        }
      );
    }
  }

  return list;
}

function renderCatalogPage()
{
  const list =
  getCatalogProducts();

  const pageSize =
  Math.max(
    1,
    asNumber(
      state.catalogPageSize,
      24
    )
  );

  const totalPages =
  Math.max(
    1,
    Math.ceil(
      list.length /
      pageSize
    )
  );

  state.catalogPage =
  Math.min(
    totalPages,
    Math.max(
      1,
      asNumber(
        state.catalogPage,
        1
      )
    )
  );

  const pageStart =
  (
    state.catalogPage -
    1
  )
  *
  pageSize;

  const pageItems =
  list.slice(
    pageStart,
    pageStart +
    pageSize
  );

  const chips =
  [
    "Todos",
    "Nuevo",
    "Destacado",
    "Hombre",
    "Mujer",
    "Unisex",
    "Árabe",
    "Argentina",
    "Nicho",
    "Diseñador",
  ];

  const visiblePages =
  [];

  if (
    totalPages <=
    7
  )
  {
    for (
      let page = 1;
      page <= totalPages;
      page += 1
    )
    {
      visiblePages.push(
        page
      );
    }
  }
  else
  {
    const candidates =
    new Set(
      [
        1,
        totalPages,
        state.catalogPage - 2,
        state.catalogPage - 1,
        state.catalogPage,
        state.catalogPage + 1,
        state.catalogPage + 2,
      ]
      .filter(
        page =>
        page >= 1 &&
        page <= totalPages
      )
    );

    visiblePages.push(
      ...Array.from(
        candidates
      )
      .sort(
        (
          a,
          b
        ) =>
        a - b
      )
    );
  }

  const pageButtons =
  [];

  let previousPage =
  null;

  for (
    const page of
    visiblePages
  )
  {
    if (
      previousPage !== null &&
      page -
      previousPage >
      1
    )
    {
      pageButtons.push(
        `
          <span
            class="catalog-page-info"
            style="width:auto;margin:0 2px">
            …
          </span>
        `
      );
    }

    pageButtons.push(
      `
        <button
          class="catalog-page-btn ${page === state.catalogPage ? "active" : ""}"
          type="button"
          data-action="catalog-page"
          data-page="${page}">
          ${page}
        </button>
      `
    );

    previousPage =
    page;
  }

  return `
    <section class="section">
      <div class="container">
        <div class="section-title-row">
          <div>
            <p class="eyebrow">
              ${escapeHtml(t("catalog.eyebrow"))}
            </p>

            <h1 class="section-title">
              ${escapeHtml(t("catalog.title"))}
            </h1>

            <p class="section-subtitle">
              ${formatInteger(list.length)}
              ${state.language === "en" ? "products" : "productos"}
              ${list.length
                ?
                ` · ${state.language === "en" ? "Page" : "Página"} ${state.catalogPage} ${state.language === "en" ? "of" : "de"} ${totalPages}`
                :
                ""
              }
            </p>
          </div>
        </div>

        <div class="chips">
          ${chips
            .map(
              chip =>
              `
                <button
                  class="chip ${state.catalogFilter === chip ? "active" : ""}"
                  type="button"
                  data-action="catalog-filter"
                  data-filter="${escapeAttribute(chip)}">
                  ${escapeHtml(
                    chip === "Todos"
                    ?
                    t("common.all")
                    :
                    chip === "Nuevo"
                    ?
                    t("product.new")
                    :
                    chip === "Destacado"
                    ?
                    t("product.featured")
                    :
                    chip
                  )}
                </button>
              `
            )
            .join("")
          }
        </div>

        <div class="catalog-toolbar">
          <input
            id="catalogSearch"
            class="search-input"
            type="search"
            value="${escapeAttribute(state.catalogSearch)}"
            placeholder="${escapeAttribute(t("catalog.search"))}">

          <select
            id="catalogSort"
            class="select-input">
            <option value="default" ${state.catalogSort === "default" ? "selected" : ""}>
              ${escapeHtml(t("catalog.sort.default"))}
            </option>

            <option value="low" ${state.catalogSort === "low" ? "selected" : ""}>
              ${escapeHtml(t("catalog.sort.low"))}
            </option>

            <option value="high" ${state.catalogSort === "high" ? "selected" : ""}>
              ${escapeHtml(t("catalog.sort.high"))}
            </option>

            <option value="name" ${state.catalogSort === "name" ? "selected" : ""}>
              ${escapeHtml(t("catalog.sort.name"))}
            </option>

            <option value="stock" ${state.catalogSort === "stock" ? "selected" : ""}>
              ${escapeHtml(t("catalog.sort.stock"))}
            </option>
          </select>

          <button
            class="btn outline"
            type="button"
            data-action="clear-catalog">
            ${escapeHtml(t("common.none"))}
          </button>
        </div>

        ${list.length
          ?
          `
            <div class="catalog-grid">
              ${pageItems
                .map(
                  product =>
                  renderProductCard(
                    product
                  )
                )
                .join("")
              }
            </div>

            ${totalPages > 1
              ?
              `
                <nav
                  class="catalog-pagination"
                  aria-label="${escapeAttribute(state.language === "en" ? "Catalog pages" : "Páginas del catálogo")}">

                  <button
                    class="catalog-page-btn"
                    type="button"
                    data-action="catalog-page"
                    data-page="${Math.max(1, state.catalogPage - 1)}"
                    ${state.catalogPage <= 1 ? "disabled" : ""}>
                    ←
                  </button>

                  ${pageButtons.join("")}

                  <button
                    class="catalog-page-btn"
                    type="button"
                    data-action="catalog-page"
                    data-page="${Math.min(totalPages, state.catalogPage + 1)}"
                    ${state.catalogPage >= totalPages ? "disabled" : ""}>
                    →
                  </button>

                  <div class="catalog-page-info">
                    ${state.language === "en"
                      ? `Showing ${pageStart + 1}–${Math.min(pageStart + pageSize, list.length)} of ${list.length}`
                      : `Mostrando ${pageStart + 1}–${Math.min(pageStart + pageSize, list.length)} de ${list.length}`
                    }
                  </div>
                </nav>
              `
              :
              ""
            }
          `
          :
          `
            <div class="empty-state">
              <h3>
                ${escapeHtml(t("catalog.empty"))}
              </h3>
            </div>
          `
        }
      </div>
    </section>
  `;
}

    function productCartKey(
      productId
    )
    {
      return (
        "product:" +
        Number(
          productId
        )
      );
    }

    async function incrementPopularity(
      productId
    )
    {
      try
      {
        const result =
        await supabaseClient.rpc(
          "increment_product_popularity",
          {
            p_product_id:
            Number(
              productId
            ),
          }
        );

        if (
          result.error
        )
        {
          console.warn(
            "No se pudo registrar popularidad:",
            result.error.message
          );

          return;
        }

        const current =
        getPopularity(
          productId
        );

        state.popularity.set(
          Number(
            productId
          ),
          current + 1
        );
      }
      catch (
        error
      )
      {
        console.warn(
          "Popularidad:",
          error
        );
      }
    }

    function addProductToCart(
      productId
    )
    {
      const product =
      getProductById(
        productId
      );

      if (
        !product
      )
      {
        return;
      }

      if (
        product.stock <= 0
      )
      {
        toast(
          t(
            "product.out"
          ),
          "error"
        );

        return;
      }

      const key =
      productCartKey(
        product.id
      );

      const existing =
      state.cart.find(
        line =>
        line.key === key
      );

      if (
        existing
      )
      {
        if (
          existing.qty >= product.stock
        )
        {
          toast(
            state.language === "en"
            ?
            "No more stock is available."
            :
            "No hay más stock disponible.",
            "error"
          );

          return;
        }

        existing.qty +=
        1;
      }
      else
      {
        state.cart.push(
          {
            kind:
            "product",

            key:
            key,

            id:
            product.id,

            productId:
            product.id,

            qty:
            1,
          }
        );
      }

      saveLocalState();

      incrementPopularity(
        product.id
      );

      toast(
        state.language === "en"
        ?
        `${product.nombre} added to cart.`
        :
        `${product.nombre} agregado al carrito.`
      );

      openCart();
    }

    function getCartLineUnitPrice(
      line
    )
    {
      if (
        line.kind === "product"
      )
      {
        const product =
        getProductById(
          line.productId
          ??
          line.id
        );

        return product
        ?
        product.precio
        :
        0;
      }

      return asNumber(
        line.unitPrice,
        0
      );
    }

    function getCartLineTitle(
      line
    )
    {
      if (
        line.kind === "product"
      )
      {
        const product =
        getProductById(
          line.productId
          ??
          line.id
        );

        return product
        ?
        product.nombre
        :
        "Producto";
      }

      return String(
        line.title
        ||
        "Combo"
      );
    }

    function getCartLineImage(
      line
    )
    {
      if (
        line.kind === "product"
      )
      {
        const product =
        getProductById(
          line.productId
          ??
          line.id
        );

        return product
        ?
        getProductMainImage(
          product
        )
        :
        "";
      }

      if (
        line.image
      )
      {
        return line.image;
      }

      if (
        Array.isArray(
          line.items
        ) &&
        line.items.length
      )
      {
        const first =
        getProductById(
          line.items[0].productId
        );

        return first
        ?
        getProductMainImage(
          first
        )
        :
        "";
      }

      return "";
    }

    function getCartLineMeta(
      line
    )
    {
      if (
        line.kind === "product"
      )
      {
        const product =
        getProductById(
          line.productId
          ??
          line.id
        );

        if (
          !product
        )
        {
          return "";
        }

        return [
          product.ml
          ?
          `${product.ml} ml`
          :
          "",

          product.categoria,
        ]
        .filter(
          Boolean
        )
        .join(
          " · "
        );
      }

      if (
        line.bundleType === "decant"
      )
      {
        return (
          state.language === "en"
          ?
          `${line.items?.length || 0} decants`
          :
          `${line.items?.length || 0} decants`
        );
      }

      if (
        line.bundleType === "gift"
      )
      {
        return String(
          line.optionName
          ||
          t(
            "gifts.title"
          )
        );
      }

      return "";
    }

    function getCartSubtotal()
    {
      return state.cart.reduce(
        (
          total,
          line
        ) =>
        total +
        (
          getCartLineUnitPrice(
            line
          )
          *
          Math.max(
            1,
            asNumber(
              line.qty,
              1
            )
          )
        ),
        0
      );
    }

    function renderCart()
    {
      const itemsHost =
      document.getElementById(
        "cartItems"
      );

      const summaryHost =
      document.getElementById(
        "cartSummary"
      );

      if (
        !itemsHost ||
        !summaryHost
      )
      {
        return;
      }

      state.cart =
      state.cart.filter(
        line =>
        {
          if (
            line.kind !== "product"
          )
          {
            return true;
          }

          return Boolean(
            getProductById(
              line.productId
              ??
              line.id
            )
          );
        }
      );

      if (
        state.cart.length === 0
      )
      {
        itemsHost.innerHTML =
        `
          <div class="empty-state">
            <h3>
              ${escapeHtml(t("cart.empty"))}
            </h3>

            <button
              class="btn"
              type="button"
              data-route="catalog">
              ${escapeHtml(t("favorites.cta"))}
            </button>
          </div>
        `;

        summaryHost.innerHTML =
        "";

        saveLocalState();

        return;
      }

      itemsHost.innerHTML =
      state.cart
      .map(
        line =>
        renderCartLine(
          line
        )
      )
      .join(
        ""
      );

      summaryHost.innerHTML =
      `
        <div class="cart-summary">
          <div class="cart-total-row grand">
            <span>
              ${escapeHtml(t("cart.total"))}
            </span>

            <strong>
              ${money(getCartSubtotal())}
            </strong>
          </div>

          <button
            class="btn"
            style="width:100%;margin-top:10px"
            type="button"
            data-action="checkout">
            ${escapeHtml(t("cart.checkout"))}
          </button>
        </div>
      `;

      saveLocalState();
    }

    function renderCartLine(
      line
    )
    {
      const image =
      getCartLineImage(
        line
      );

      const title =
      getCartLineTitle(
        line
      );

      const meta =
      getCartLineMeta(
        line
      );

      const unitPrice =
      getCartLineUnitPrice(
        line
      );

      const qty =
      Math.max(
        1,
        asNumber(
          line.qty,
          1
        )
      );

      return `
        <article class="cart-line">
          <div class="cart-line-image">
            ${image
              ?
              `
                <img
                  src="${escapeAttribute(image)}"
                  alt="${escapeAttribute(title)}">
              `
              :
              `
                <span>
                  ✦
                </span>
              `
            }
          </div>

          <div>
            <h4>
              ${escapeHtml(title)}
            </h4>

            <div class="cart-line-meta">
              ${escapeHtml(meta)}
            </div>

            <div class="cart-line-meta">
              ${money(unitPrice)}
            </div>

            <div class="qty-control">
              <button
                type="button"
                data-action="cart-qty"
                data-cart-key="${escapeAttribute(line.key)}"
                data-delta="-1">
                −
              </button>

              <span>
                ${qty}
              </span>

              <button
                type="button"
                data-action="cart-qty"
                data-cart-key="${escapeAttribute(line.key)}"
                data-delta="1">
                +
              </button>
            </div>

            <button
              class="text-link"
              type="button"
              data-action="remove-cart-line"
              data-cart-key="${escapeAttribute(line.key)}">
              ${escapeHtml(t("cart.remove"))}
            </button>
          </div>

          <strong>
            ${money(unitPrice * qty)}
          </strong>
        </article>
      `;
    }

    function changeCartQuantity(
      key,
      delta
    )
    {
      const line =
      state.cart.find(
        item =>
        item.key === key
      );

      if (
        !line
      )
      {
        return;
      }

      const newQty =
      Math.max(
        0,
        asNumber(
          line.qty,
          1
        )
        +
        asNumber(
          delta,
          0
        )
      );

      if (
        newQty <= 0
      )
      {
        removeCartLine(
          key
        );

        return;
      }

      if (
        line.kind === "product"
      )
      {
        const product =
        getProductById(
          line.productId
          ??
          line.id
        );

        if (
          product &&
          newQty > product.stock
        )
        {
          toast(
            state.language === "en"
            ?
            "No more stock is available."
            :
            "No hay más stock disponible.",
            "error"
          );

          return;
        }
      }

      line.qty =
      newQty;

      saveLocalState();

      renderCart();
    }

    function removeCartLine(
      key
    )
    {
      state.cart =
      state.cart.filter(
        line =>
        line.key !== key
      );

      saveLocalState();

      renderCart();
    }

    function getCheckedValue(
      name
    )
    {
      const checked =
      document.querySelector(
        `input[name="${name}"]:checked`
      );

      return checked
      ?
      checked.value
      :
      "";
    }

    function buildCartLineText(
      line
    )
    {
      const qty =
      Math.max(
        1,
        asNumber(
          line.qty,
          1
        )
      );

      const total =
      getCartLineUnitPrice(
        line
      )
      *
      qty;

      let text =
      "• " +
      getCartLineTitle(
        line
      )
      +
      " x" +
      qty
      +
      " — " +
      money(
        total
      );

      if (
        line.kind === "bundle" &&
        Array.isArray(
          line.items
        )
      )
      {
        const details =
        line.items.map(
          item =>
          {
            const product =
            getProductById(
              item.productId
            );

            return (
              "   - " +
              (
                product
                ?
                product.nombre
                :
                "Producto"
              )
              +
              (
                item.ml
                ?
                ` ${item.ml} ml`
                :
                ""
              )
              +
              (
                item.price
                ?
                ` (${money(item.price)})`
                :
                ""
              )
            );
          }
        )
        .join(
          "\n"
        );

        text +=
        "\n" +
        details;
      }

      return text;
    }

    async function validateGameDiscount()
    {
      const code =
      document.getElementById(
        "checkoutDiscountCode"
      )?.value.trim().toUpperCase()
      ||
      "";

      const phone =
      normalizeGamePhone(
        document.getElementById(
          "checkoutPhone"
        )?.value
      );

      if (
        !code ||
        phone.length < 8
      )
      {
        toast(
          state.language === "en"
          ?
          "Enter your WhatsApp number and discount code first."
          :
          "Ingresá primero tu WhatsApp y el código de descuento.",
          "error"
        );

        return;
      }

      const result =
      await supabaseClient.rpc(
        "validate_game_discount",
        {
          p_code:
          code,

          p_phone:
          phone,
        }
      );

      if (
        result.error
      )
      {
        state.checkoutDiscount =
        null;

        toast(
          result.error.message,
          "error"
        );

        return;
      }

      const data =
      result.data
      ||
      {};

      if (
        !data.valid
      )
      {
        state.checkoutDiscount =
        null;

        toast(
          data.message
          ||
          (
            state.language === "en"
            ?
            "Invalid or already used code."
            :
            "Código inválido, ajeno o ya utilizado."
          ),
          "error"
        );

        return;
      }

      state.checkoutDiscount =
      {
        code:
        data.code,

        percent:
        asNumber(
          data.percent,
          10
        ),

        phone:
        phone,

        rewardId:
        data.reward_id,
      };

      const modalBody =
      document.querySelector(
        ".modal-body"
      );

      if (
        modalBody
      )
      {
        modalBody.innerHTML =
        renderCheckout();

        const phoneInput =
        document.getElementById(
          "checkoutPhone"
        );

        if (
          phoneInput
        )
        {
          phoneInput.value =
          phone;
        }

        const codeInput =
        document.getElementById(
          "checkoutDiscountCode"
        );

        if (
          codeInput
        )
        {
          codeInput.value =
          code;
        }
      }

      toast(
        state.language === "en"
        ?
        "10% discount applied."
        :
        "Descuento del 10% aplicado.",
        "success"
      );
    }

function getDefaultDecantTemplate()
{

  };
}

function getDecantEligibleProducts()
{
  const template =
  getDefaultDecantTemplate();

  const mappings =
  state.comboProducts.filter(
    row =>
    Number(
      row.combo_id
    ) ===
    Number(
      template.id
    )
  );

  if (
    mappings.length
  )
  {
    const allowed =
    new Set(
      mappings.map(
        row =>
        Number(
          row.product_id
        )
      )
    );

    return state.products.filter(
      product =>
      allowed.has(
        Number(
          product.id
        )
      )
      &&
      product.stock > 0
    );
  }

  return state.products.filter(
    product =>
    product.stock > 0
    &&
    (
      product.tipo_producto_slug === "perfume"
      ||
      normalizeText(
        product.tipo_producto
      ) ===
      "perfume"
    )
  );
}

function getDecantSizeRowsForProduct(
  productId
)
{
  const template =
  getDefaultDecantTemplate();

  const mapping =
  state.comboProducts.find(
    row =>
    Number(
      row.combo_id
    ) ===
    Number(
      template.id
    )
    &&
    Number(
      row.product_id
    ) ===
    Number(
      productId
    )
  );

  const allowed =
  mapping
  ?
  arrayFromDb(
    mapping.ml_opciones
  )
  .map(
    value =>
    asNumber(
      value,
      0
    )
  )
  .filter(
    value =>
    value > 0 &&
    value <= 30
  )
  :
  state.decantSizes
  .map(
    row =>
    asNumber(
      row.ml,
      0
    )
  )
  .filter(
    value =>
    value > 0 &&
    value <= 30
  );

  return uniqueStrings(
    allowed
  )
  .map(
    value =>
    asNumber(
      value,
      0
    )
  )
  .filter(
    value =>
    value > 0
  )
  .sort(
    (
      a,
      b
    ) =>
    a - b
  );
}

async function calculateDecantPrice(
  productId,
  ml
)
{
  const rpc =
  await supabaseClient.rpc(
    "calculate_decant_price",
    {
      p_product_id:
      Number(
        productId
      ),

      p_ml:
      Number(
        ml
      ),
    }
  );

  if (
    !rpc.error &&
    rpc.data !== null &&
    rpc.data !== undefined
  )
  {
    return asNumber(
      rpc.data,
      0
    );
  }

  const product =
  getProductById(
    productId
  );

  if (
    !product ||
    product.ml <= 0
  )
  {
    throw new Error(
      "No se pudo calcular el precio del decant."
    );
  }

  const sizeRow =
  state.decantSizes.find(
    row =>
    Number(
      row.ml
    ) ===
    Number(
      ml
    )
  )
  ||
  {
    factor:
    1,

    costo_envase:
    0,
  };

  const proportional =
  (
    product.precio /
    product.ml
  )
  *
  Number(
    ml
  )
  *
  asNumber(
    sizeRow.factor,
    1
  )
  +
  asNumber(
    sizeRow.costo_envase,
    0
  );

  return Math.ceil(
    proportional /
    100
  )
  *
  100;
}

async function addDecantToDraft(
  productId
)
{
  const template =
  getDefaultDecantTemplate();

  const max =
  Math.max(
    1,
    asNumber(
      template.max_productos,
      5
    )
  );

  if (
    state.decantDraft.length >= max
  )
  {
    toast(
      t(
        "decants.limit"
      ),
      "error"
    );

    return;
  }

  const select =
  document.getElementById(
    "decantSize-" +
    productId
  );

  const ml =
  asNumber(
    select?.value,
    0
  );

  if (
    ml <= 0 ||
    ml > 30
  )
  {
    return;
  }

  try
  {
    const price =
    await calculateDecantPrice(
      productId,
      ml
    );

    state.decantDraft.push(
      {
        productId:
        Number(
          productId
        ),

        ml:
        ml,

        price:
        price,
      }
    );

    updateDecantSummaryOnly();
  }
  catch (
    error
  )
  {
    toast(
      error.message,
      "error"
    );
  }
}

      ...item,
    })
  );

  const total =
  items.reduce(
    (
      sum,
      item
    ) =>
    sum +
    asNumber(
      item.price,
      0
    ),
    0
  );

  const first =
  items[0]
  ?
  getProductById(
    items[0].productId
  )
  :
  null;

  state.cart.push(
    {
      kind:
      "bundle",

      bundleType:
      "decant",

      key:
      makeId(
        "decant"
      ),

      title:
      t(
        "decants.title"
      ),

      qty:

      total,

      items,

      image:
      first

    state.language === "en"

function addGiftProductToDraft(

  getCurrentGiftOption();

  Math.max(

      4
    )
  );

  if (
    state.giftDraft.length >= max
  )
  {
    toast(
      t(

      "error"
    );

    return;
  }

  const product =
  getProductById(

  state.giftDraft.push(

      price:

function addGiftBundleToCart()
{
  if (
    state.giftDraft.length === 0
  )
  {
    return;
  }

  const option =
  getCurrentGiftOption();

  const items =
  state.giftDraft.map(
    item =>
    ({
      ...item,
    })
  );

  const total =
  items.reduce(
    (
      sum,
      item
    ) =>
    sum +
    asNumber(
      item.price,
      0
    ),
    0
  )
  +
  asNumber(
    option.precio_adicional,
    0
  );

  const first =
  items[0]
  ?
  getProductById(
    items[0].productId
  )
  :
  null;

  state.cart.push(
    {
      kind:
      "bundle",

      bundleType:
      "gift",

      key:
      makeId(
        "gift"
      ),

      title:
      t(
        "gifts.title"
      ),

      optionSlug:
      option.slug,

      optionName:
      state.language === "en"
      ?
      option.nombre_en
      :
      option.nombre_es,

      qty:
      1,

      unitPrice:
      total,

      items:
      items,

      image:
      first
      ?
      getProductMainImage(
        first
      )
      :
      "",
    }
  );

  state.giftDraft =
  [];

  saveLocalState();

  toast(
    state.language === "en"
    ?
    "Gift added to cart."
    :
    "Regalo agregado al carrito."
  );

  renderCurrentRoute();

  openCart();
}

function normalizeGamePhone(
  value
)
{
  return String(
    value
    ||
    ""
  )
  .replace(
    /\D/g,
    ""
  );
}

function getGamePlayer()
{
  const player =
  state.gamePlayer
  ||
  null;

  if (
    !player
  )
  {
    return null;
  }

  const name =
  String(
    player.name
    ||
    ""
  ).trim();

  const phone =
  normalizeGamePhone(
    player.phone
  );

  if (
    name.length < 2 ||
    phone.length < 8
  )
  {
    return null;
  }

  return {
    name,
    phone,
  };
}

{

async function submitDailyGameScore(
  completed,
  elapsed
)
{
  const player =
  getGamePlayer();

  if (
    !completed ||
    !player
  )
  {
    return null;
  }

  try
  {
    const result =
    await supabaseClient.rpc(
      "submit_daily_game_score",
      {
        p_player_name:
        player.name,

        p_player_phone:
        player.phone,

        p_game_type:
        state.game.type,

        p_product_id:
        Number(
          state.game.productId
        )
        ||
        null,

        p_duration_seconds:
        Math.max(
          1,
          Number(
            elapsed
          )
          ||
          1
        ),

        p_attempts:
        Math.max(
          1,
          Number(
            state.game.moves
          )
          ||
          1
        ),
      }
    );

    if (
      result.error
    )
    {
      console.warn(
        "submit_daily_game_score:",
        result.error.message
      );

      return null;
    }

    await loadDailyLeaderboard();

    return result.data
    ||
    null;
  }
  catch (
    error
  )
  {
    console.warn(
      "submit_daily_game_score:",
      error
    );

    return null;
  }
}

function chooseRandom(
  array
)
{
  if (
    !array ||
    array.length === 0
  )
  {
    return null;
  }

  const index =
  Math.floor(
    Math.random() *
    array.length
  );

  return array[
    index
  ];
}

async function startGame(
  type
)
{
  clearGameTimer();

  if (
    !getGamePlayer()
  )
  {
    toast(
      state.language === "en"
      ?
      "Save your player name and WhatsApp before playing."
      :
      "Guardá tu nombre y WhatsApp antes de jugar.",
      "error"
    );

    setRoute(
      "games"
    );

    return;
  }

  let product =
  null;

  if (
    isAiEnabled(
      "games_ai_enabled"
    )
  )
  {
    try
    {
      const ai =
      await callAromaAI(
        "game",
        {
          gameType:
          type,

          products:
          getAiCatalogPayload(),
        }
      );

      const result =
      typeof ai === "string"
      ?
      safeJsonParse(
        ai,
        null
      )
      :
      ai;

      if (
        result &&
        result.product_id
      )
      {
        product =
        getProductById(
          result.product_id
        );
      }
    }
    catch (
      error
    )
    {
      console.warn(
        "AI game fallback:",
        error
      );
    }
  }

  if (
    !product
  )
  {
    product =
    chooseRandom(
      getGameEligibleProducts()
    );
  }

  if (
    !product
  )
  {
    toast(
      state.language === "en"
      ?
      "Upload product images before playing."
      :
      "Necesitás perfumes con imágenes para jugar.",
      "error"
    );

    return;
  }

  state.game =
  {
    type:
    type,

    productId:
    product.id,

    startedAt:
    Date.now(),

    timerId:
    null,

    remaining:
    Math.max(
      10,
      asNumber(
        getGameConfig(
          type
        ).tiempo_limite,
        type === "hidden"
        ?
        90
        :
        180
      )
    ),

    moves:
    0,

    selectedPuzzleIndex:
    null,

    puzzleOrder:
    [],

    differences:
    [],

    differencesFound:
    new Set(),

    hiddenTargetIndex:
    null,
  };

  prepareGameState();

  setRoute(
    "game",
    {
      type:
      type,
    }
  );
}

function prepareGameState()
{
  if (
    state.game.type === "puzzle"
  )
  {
    preparePuzzle();
  }

  if (
    state.game.type === "differences"
  )
  {
    prepareDifferences();
  }

  if (
    state.game.type === "hidden"
  )
  {
    prepareHiddenGame();
  }
}

function preparePuzzle()
{
  const order =
  Array.from(
    {
      length:
      20,
    },
    (
      _,
      index
    ) =>
    index
  );

  shuffleArray(
    order
  );

  if (
    order.every(
      (
        value,
        index
      ) =>
      value === index
    )
  )
  {
    [
      order[0],
      order[1],
    ]
    =
    [
      order[1],
      order[0],
    ];
  }

  state.game.puzzleOrder =
  order;

  state.game.selectedPuzzleIndex =
  null;

  state.game.moves =
  0;
}

function prepareDifferences()
{
  /*
    Banco de posiciones discretas.
    Cada partida mezcla el banco y toma solo cinco puntos.
    Los cambios son deliberadamente pequeños: el objetivo es que
    se perciban al observar, no que aparezcan como manchas obvias.
  */
  const positionPool =
  [
    { x: 10.5, y: 12.5 },
    { x: 25.0, y: 19.0 },
    { x: 43.0, y: 13.5 },
    { x: 67.0, y: 18.0 },
    { x: 83.0, y: 27.0 },
    { x: 15.0, y: 42.0 },
    { x: 34.0, y: 39.0 },
    { x: 55.5, y: 42.5 },
    { x: 76.0, y: 48.0 },
    { x: 89.0, y: 52.0 },
    { x: 19.0, y: 69.0 },
    { x: 38.0, y: 65.0 },
    { x: 58.5, y: 68.0 },
    { x: 73.5, y: 74.0 },
    { x: 86.0, y: 78.0 },
  ];

  shuffleArray(
    positionPool
  );

  const chosen =
  positionPool.slice(
    0,
    5
  );

  state.game.differences =
  chosen.map(
    (
      position,
      index
    ) =>
    {
      const size =
      4.0 +
      Math.random() * 2.2;

      const opacity =
      0.14 +
      Math.random() * 0.12;

      const rotation =
      Math.round(
        -18 +
        Math.random() * 36
      );

      const hitSize =
      Math.max(
        9.5,
        size + 4.2
      );

      return {
        id:
        index,

        x:
        position.x,

        y:
        position.y,

        type:
        1 +
        Math.floor(
          Math.random() * 8
        ),

        size:
        Number(
          size.toFixed(2)
        ),

        opacity:
        Number(
          opacity.toFixed(2)
        ),

        rotation:
        rotation,

        hitSize:
        Number(
          hitSize.toFixed(2)
        ),
      };
    }
  );

  state.game.differencesFound =
  new Set();

  state.game.moves =
  0;
}

function prepareHiddenGame()
{
  const candidates =
  getGameEligibleProducts();

  const target =
  getProductById(
    state.game.productId
  );

  const decoys =
  candidates
  .filter(
    product =>
    product.id !== target?.id
  );

  shuffleArray(
    decoys
  );

  const tiles =
  decoys
  .slice(
    0,
    23
  );

  const targetIndex =
  Math.floor(
    Math.random() *
    (
      tiles.length +
      1
    )
  );

  tiles.splice(
    targetIndex,
    0,
    target
  );

  state.game.hiddenProducts =
  tiles;

  state.game.hiddenTargetIndex =
  targetIndex;
}

function shuffleArray(
  array
)
{
  for (
    let index =
    array.length - 1;

    index > 0;

    index--
  )
  {
    const random =
    Math.floor(
      Math.random() *
      (
        index +
        1
      )
    );

    [
      array[index],
      array[random],
    ]
    =
    [
      array[random],
      array[index],
    ];
  }

  return array;
}

function renderPuzzlePiece(
  image,
  sourceIndex,
  boardIndex
)
{
  const columns =
  5;

  const rows =
  4;

  const sourceColumn =
  sourceIndex %
  columns;

  const sourceRow =
  Math.floor(
    sourceIndex /
    columns
  );

  const x =
  columns === 1
  ?
  0
  :
  (
    sourceColumn /
    (
      columns -
      1
    )
  )
  *
  100;

  const y =
  rows === 1
  ?
  0
  :
  (
    sourceRow /
    (
      rows -
      1
    )
  )
  *
  100;

  return `
    <button
      class="puzzle-piece ${state.game.selectedPuzzleIndex === boardIndex ? "selected" : ""}"
      type="button"
      data-action="puzzle-piece"
      data-index="${boardIndex}"
      style="
        background-image:url('${escapeAttribute(image)}');
        background-size:${columns * 100}% ${rows * 100}%;
        background-position:${x}% ${y}%;
      "
      aria-label="Pieza ${boardIndex + 1}">
    </button>
  `;
}

function puzzlePieceClick(

)
{
  const numericIndex =
  Number(
    index

  if (
    state.game.selectedPuzzleIndex === null

  {
    state.game.selectedPuzzleIndex =
    numericIndex;

    renderCurrentRoute();

    return;
  }

  if (
    state.game.selectedPuzzleIndex === numericIndex
  )
  {
    state.game.selectedPuzzleIndex =
    null;

    renderCurrentRoute();

    return;
  }

  const first =
  state.game.selectedPuzzleIndex;

  [
    state.game.puzzleOrder[first],
    state.game.puzzleOrder[numericIndex],
  ]
  =
  [
    state.game.puzzleOrder[numericIndex],
    state.game.puzzleOrder[first],
  ];

  state.game.moves +=
  1;

  state.game.selectedPuzzleIndex =
  null;

  if (
    isPuzzleSolved()
  )
  {
    completeGame(
      true
    );

    return;
  }

  renderCurrentRoute();
}

function isPuzzleSolved()

}

function findDifference(
  id
)
{
  const numericId =
  Number(
    id
  );

  if (
    state.game.differencesFound.has(
      numericId
    )
  )
  {
    return;
  }

  state.game.differencesFound.add(
    numericId
  );

  state.game.moves +=
  1;

  if (
    state.game.differencesFound.size >=
    state.game.differences.length
  )
  {
    completeGame(
      true
    );

    return;
  }

  renderCurrentRoute();
}

function formatGameTime(
  seconds
)
{
  const safe =
  Math.max(
    0,
    Math.floor(
      asNumber(
        seconds,
        0
      )
    )
  );

  const minutes =
  Math.floor(
    safe /
    60
  );

  const remainder =
  safe %
  60;

  return (
    String(
      minutes
    )
    .padStart(
      2,
      "0"
    )
    +
    ":" +
    String(
      remainder
    )
    .padStart(
      2,
      "0"
    )
  );
}

async function completeGame(
  completed
)
{
  clearGameTimer();

  const elapsed =
  Math.max(
    0,
    Math.round(
      (
        Date.now() -
        (
          state.game.startedAt
          ||
          Date.now()
        )
      )
      /
      1000
    )
  );

  try
  {
    await supabaseClient.rpc(
      "register_game_result",
      {
        p_game_type:
        state.game.type,

        p_product_id:
        Number(
          state.game.productId
        ),

        p_completed:
        Boolean(
          completed
        ),

        p_duration_seconds:
        elapsed,

        p_attempts:
        Math.max(
          1,
          state.game.moves
        ),
      }
    );
  }
  catch (
    error
  )
  {
    console.warn(
      "game_activity:",
      error
    );
  }

  const scoreResult =
  await submitDailyGameScore(
    Boolean(
      completed
    ),
    elapsed
  );

  const points =
  scoreResult &&
  typeof scoreResult === "object"
  ?
  asNumber(
    scoreResult.points,
    0
  )
  :
  0;

  const solvedToday =
  scoreResult &&
  typeof scoreResult === "object"
  ?
  asNumber(
    scoreResult.solved_today,
    0
  )
  :
  0;

  openModal(
    completed
    ?
    t(
      "games.win"
    )
    :
    t(
      "games.lose"
    ),
    `
      <div class="empty-state">
        <h3>
          ${escapeHtml(
            completed
            ?
            t("games.win")
            :
            t("games.lose")
          )}
        </h3>

        <p>
          ${escapeHtml(t("games.time"))}:
          ${formatGameTime(elapsed)}
        </p>

        ${completed && points
          ?
          `
            <div class="game-score-earned">
              <strong>+${formatInteger(points)}</strong>
              <span>
                ${state.language === "en" ? "points earned" : "puntos ganados"}
              </span>
            </div>

            <p class="u-mt-14">
              ${state.language === "en"
                ? `Solved today: ${formatInteger(solvedToday)}`
                : `Resueltos hoy: ${formatInteger(solvedToday)}`
              }
            </p>
          `
          :
          ""
        }

        <div class="u-flex-center-gap u-mt-14">
          <button
            class="btn"
            type="button"
            data-action="restart-game">
            ${escapeHtml(t("games.restart"))}
          </button>

          <button
            class="btn secondary"
            type="button"
            data-route="games">
            ${state.language === "en" ? "See ranking" : "Ver ranking"}
          </button>
        </div>
      </div>
    `
  );
}

  value
)
{
  return String(
    value ||
    ""
  )
  .trim()
  .toLowerCase();
}

function isAdminEmail(
  email
)
{
  return CONFIG.adminEmails.includes(
    normalizeEmail(

async function getCurrentSession()
{
  const result =
  await supabaseClient.auth.getSession();

  if (
    result.error
  )
  {
    console.warn(
      "getSession:",
      result.error.message
    );

    return null;
  }

  return result.data?.session
  ||
  null;
}

async function renderAdminRoute()
{
  const app =
  document.getElementById(
    "app"
  );

  if (
    !app
  )
  {
    return;
  }

  app.innerHTML =
  `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>
        ${escapeHtml(t("common.loading"))}
      </p>
    </div>
  `;

  const session =
  await getCurrentSession();

  if (
    !session
  )
  {
    state.admin.currentUser =
    null;

    app.innerHTML =
    renderAdminLogin();

    return;
  }

  if (
    !isAdminEmail(
      session.user?.email
    )
  )
  {
    await supabaseClient.auth.signOut();

    state.admin.currentUser =
    null;

    app.innerHTML =
    `
      <section class="section">
        <div class="container">
          <div class="empty-state">
            <h3>
              ${state.language === "en" ? "Access denied" : "Sin permisos"}
            </h3>

            <p>
              ${state.language === "en"
                ? "This account is not authorized to manage AromaLParfum."
                : "Esta cuenta no está autorizada para administrar AromaLParfum."
              }
            </p>
          </div>
        </div>
      </section>
    `;

    return;
  }

  state.admin.currentUser =
  session.user;

  if (
    !state.allProductImagesLoaded
  )
  {
    await loadProductImages();
  }

  app.innerHTML =
  renderAdminDashboard();
}

async function adminLogin()
{
  const email =
  document.getElementById(
    "adminLoginEmail"
  )?.value.trim()
  ||
  "";

  const password =
  document.getElementById(
    "adminLoginPassword"
  )?.value
  ||
  "";

  if (
    !email ||
    !password
  )
  {
    toast(
      state.language === "en"
      ?
      "Enter email and password."
      :
      "Completá email y contraseña.",
      "error"
    );

    return;
  }

  const result =
  await supabaseClient.auth.signInWithPassword(
    {
      email:
      email,

      password:
      password,
    }
  );

  if (
    result.error
  )
  {
    toast(
      result.error.message,
      "error"
    );

    return;
  }

  if (
    !isAdminEmail(
      result.data?.user?.email
    )
  )
  {
    await supabaseClient.auth.signOut();

    toast(
      state.language === "en"
      ?
      "This account is not an administrator."
      :
      "Esta cuenta no es administradora.",
      "error"
    );

    return;
  }

  state.admin.currentUser =
  result.data.user;

  renderCurrentRoute();
}

async function adminRecoverPassword()
{
  const email =
  document.getElementById(
    "adminLoginEmail"
  )?.value.trim()
  ||
  "";

  if (
    !email
  )
  {
    toast(
      state.language === "en"
      ?
      "Enter your email first."
      :
      "Primero escribí tu email.",
      "error"
    );

    return;
  }

  const result =
  await supabaseClient.auth.resetPasswordForEmail(
    email,
    {
      redirectTo:
      window.location.origin +
      window.location.pathname,
    }
  );

  if (
    result.error
  )
  {
    toast(
      result.error.message,
      "error"
    );

    return;
  }

  toast(
    state.language === "en"
    ?
    "Check your email."
    :
    "Revisá tu correo."
  );
}

  ];

  if (
    product.categoria &&

  )
  {
    categories.push(
      product.categoria
    );
  }

  return `

      ${categories
        .map(
          category =>
          `
            <option
              value="${escapeAttribute(category)}"

function filterProductPayload(
  payload
)
{
  const alwaysSafe =
  new Set(
    [
      "nombre",
      "precio",
      "ml",
      "categoria",
      "genero",
      "stock",
      "imagen_url",
      "descripcion",
      "salida",
      "corazon",
      "fondo",
      "familia",
    ]
  );

  const clean =
  {};

  for (
    const [
      key,
      value,
    ]
    of
    Object.entries(
      payload
    )
  )
  {
    if (
      state.productColumns.has(
        key
      )
      ||
      alwaysSafe.has(
        key
      )
    )
    {
      clean[
        key
      ] =
      value;
    }
  }

  return clean;
}

async function createProductFromAdmin()
{
  const nombre =
  getInputValue(
    "np-name"
  );

  const precio =
  getInputNumber(
    "np-price",
    NaN
  );

  const ml =
  getInputNumber(
    "np-ml",
    NaN
  );

  const stock =
  getInputNumber(
    "np-stock",
    0
  );

  if (
    !nombre
  )
  {
    adminMessage(
      state.language === "en"
      ?
      "Product name is required."
      :
      "El nombre del producto es obligatorio.",
      "error"
    );

    return;
  }

  if (
    !Number.isFinite(
      precio
    ) ||
    precio < 0
  )
  {
    adminMessage(
      state.language === "en"
      ?
      "Enter a valid price."
      :
      "Ingresá un precio válido.",
      "error"
    );

    return;
  }

  if (
    !Number.isFinite(
      ml
    ) ||
    ml < 0
  )
  {
    adminMessage(
      state.language === "en"
      ?
      "Enter a valid size."
      :
      "Ingresá un tamaño válido.",
      "error"
    );

    return;
  }

  const payload =
  filterProductPayload(
    {
      nombre:
      nombre,

      marca:
      getInputValue(
        "np-brand"
      ),

      precio:
      precio,

      ml:
      ml,

      stock:
      Math.max(
        0,

      categoria:
      getInputValue(
        "np-category"
      )
      ||
      "Otros",

      genero:
      getInputValue(
        "np-gender"
      )
      ||

      familia:
      getInputValue(
        "np-family"
      ),

      descripcion:
      getInputValue(
        "np-description"
      ),

      salida:
      getInputValue(
        "np-top"
      ),

      corazon:
      getInputValue(
        "np-heart"
      ),

      fondo:
      getInputValue(
        "np-base"
      ),

      duracion:
      getInputValue(
        "np-duration"
      )
      ||
      "Consultar",

      proyeccion:
      getInputValue(
        "np-projection"
      )
      ||
      "Consultar",

      recomendacion_uso:
      getInputValue(
        "np-use"
      )
      ||
      "Consultar",

      estaciones:
      arrayFromDb(
        getInputValue(
          "np-seasons"
        )
      ),

      ocasiones:
      arrayFromDb(
        getInputValue(
          "np-occasions"
        )
      ),

      tipo_producto_slug:
      getInputValue(
        "np-type"
      )
      ||
      "perfume",

      tipo_producto:
      getInputValue(
        "np-type"
      )
      ||
      "Perfume",

      destacado:
      getInputChecked(
        "np-featured"
      ),

      nuevo:
      getInputChecked(
        "np-new"
      ),

      created_by_ai:
      getInputChecked(
        "np-created-ai"
      ),

      descripcion_en:
      getInputValue(
        "np-description-en"
      ),

      salida_en:
      getInputValue(
        "np-top-en"
      ),

      corazon_en:
      getInputValue(
        "np-heart-en"
      ),

      fondo_en:
      getInputValue(
        "np-base-en"
      ),

      familia_en:
      getInputValue(
        "np-family-en"
      ),

      imagen_url:
      null,
    }
  );

  adminMessage(
    state.language === "en"
    ?
    "Creating product..."
    :
    "Creando producto...",
    "ok"
  );

  const result =
  await supabaseClient
    .from(
      "products"
    )
    .insert(
      payload
    )
    .select(
      "*"
    )
    .single();

  if (
    result.error
  )

    adminMessage(

        "Could not create product: "
        :
        "No se pudo crear el perfume: "

      +
      result.error.message,
      "error"
    );

    return;

  const product =
  normalizeProduct(
    result.data
  );

  const files =
  Array.from(
    document.getElementById(

    []

  if (
    files.length

      await uploadProductImages(

  state.admin.tab =

  renderCurrentRoute();

async function saveAdminProduct(
  productId
)
{
  const payload =
  readAdminProductPayload(
    productId
  );

  if (
    !payload.nombre
  )
  {
    adminMessage(
      state.language === "en"
      ?
      "Name is required."
      :
      "El nombre es obligatorio.",
      "error"
    );

    return;
  }

  const result =
  await supabaseClient
    .from(
      "products"
    )
    .update(
      payload
    )
    .eq(
      "id",
      Number(
        productId
      )
    )
    .select(
      "*"
    )
    .single();

  if (
    result.error
  )
  {
    adminMessage(
      result.error.message,
      "error"
    );

    return;
  }

  const index =
  state.products.findIndex(
    product =>
    product.id ===
    Number(
      productId

  );

  if (
    index >= 0
  )
  {
    state.products[
      index

    normalizeProduct(
      result.data
    );
  }

  refreshAdminTab();

  adminMessage(
    t(
      "admin.updated"
    ),
    "ok"
  );
}

async function deleteAdminProduct(
  productId
)
{
  const product =
  getProductById(
    productId
  );

  if (
    !product
  )
  {
    return;
  }

  const confirmed =
  window.confirm(
    state.language === "en"
    ?
    `Delete "${product.nombre}"?`
    :
    `¿Eliminar "${product.nombre}"?`
  );

  if (
    !confirmed
  )
  {
    return;
  }

  const imageRows =
  state.productImageMeta[
    product.id
  ]
  ||
  [];

  const storagePaths =
  imageRows
  .map(
    row =>
    row.path
  )
  .filter(
    path =>
    path &&
    !/^https?:\/\//i.test(
      path
    )
  );

  if (
    storagePaths.length
  )
  {
    const storageResult =
    await supabaseClient
      .storage
      .from(
        CONFIG.storageBucket
      )
      .remove(
        storagePaths
      );

    if (
      storageResult.error
    )
    {
      console.warn(
        "No se pudieron borrar todas las fotos:",
        storageResult.error.message
      );
    }
  }

  const result =
  await supabaseClient
    .from(
      "products"
    )
    .delete()
    .eq(
      "id",
      product.id
    );

  if (
    result.error
  )
  {
    adminMessage(
      result.error.message,
      "error"
    );

    return;
  }

  state.cart =
  state.cart.filter(
    line =>
    !(
      line.kind === "product"
      &&
      Number(
        line.productId
        ??
        line.id
      ) ===
      product.id
    )
  );

  state.favorites =
  state.favorites.filter(
    id =>
    id !==
    product.id
  );

  saveLocalState();

  await loadProducts();

  await loadProductImages();

  refreshAdminTab();

  adminMessage(
    t(
      "admin.deleted"
    ),
    "ok"
  );
}

function sanitizeFileExtension(
  file
)
{
  const raw =
  String(
    file?.name
    ||
    "image.jpg"
  );

  const extension =
  raw.includes(
    "."
  )
  ?
  raw.split(
    "."
  )
  .pop()
  :
  "jpg";

  return String(
    extension
    ||
    "jpg"
  )
  .toLowerCase()
  .replace(
    /[^a-z0-9]/g,
    ""
  )
  ||
  "jpg";
}

async function uploadSingleProductImage(
  productId,
  file,
  order
)
{
  if (
    !file ||
    !String(
      file.type
      ||
      ""
    )
    .startsWith(
      "image/"
    )
  )
  {
    throw new Error(
      state.language === "en"
      ?
      "The selected file is not an image."
      :
      "El archivo seleccionado no es una imagen."
    );
  }

  if (
    file.size >
    CONFIG.maxImageBytes
  )
  {
    throw new Error(
      state.language === "en"
      ?
      "Maximum image size is 8 MB."
      :
      "Cada imagen puede pesar como máximo 8 MB."
    );
  }

  const extension =
  sanitizeFileExtension(
    file
  );

  const path =
  "productos/" +
  Number(
    productId
  )
  +
  "/" +
  makeId(
    "img"
  )
  +
  "." +
  extension;

  const storage =
  await supabaseClient
    .storage
    .from(
      CONFIG.storageBucket
    )
    .upload(
      path,
      file,
      {
        upsert:
        false,

        contentType:
        file.type,
      }
    );

  if (
    storage.error
  )
  {
    throw storage.error;
  }

  const relation =
  await supabaseClient
    .from(
      CONFIG.productImagesTable
    )
    .insert(
      {
        product_id:
        Number(
          productId
        ),

        image_url:
        path,

        orden:
        Number(
          order
        ),
      }
    )
    .select(
      "*"
    )
    .single();

  if (
    relation.error
  )
  {
    await supabaseClient
      .storage
      .from(
        CONFIG.storageBucket
      )
      .remove(
        [
          path,
        ]
      );

    throw relation.error;
  }

  return relation.data;
}

async function uploadProductImages(
  productId,
  files,
  options = {}
)
{
  const list =
  Array.from(
    files
    ||
    []
  );

  if (
    list.length === 0
  )
  {
    return;
  }

  const current =
  state.productImageMeta[
    Number(
      productId
    )
  ]
  ||
  [];

  let order =
  current.length;

  for (
    const file of
    list
  )
  {
    await uploadSingleProductImage(
      productId,
      file,
      order
    );

    order +=
    1;
  }

  await loadProductImages();

  if (
    !options.quiet
  )
  {
    refreshAdminTab();

    adminMessage(
      state.language === "en"
      ?
      "Photos uploaded successfully."
      :
      "Fotos subidas correctamente.",
      "ok"
    );
  }
}

async function deleteAdminPhoto(
  imageId,
  productId,
  storagePath
)
{
  const confirmed =
  window.confirm(
    state.language === "en"
    ?
    "Delete this photo?"
    :
    "¿Eliminar esta foto?"
  );

  if (
    !confirmed
  )
  {
    return;
  }

  const relation =
  await supabaseClient
    .from(
      CONFIG.productImagesTable
    )
    .delete()
    .eq(
      "id",
      Number(
        imageId
      )
    );

  if (
    relation.error
  )
  {
    adminMessage(
      relation.error.message,
      "error"
    );

    return;
  }

  if (
    storagePath &&
    !/^https?:\/\//i.test(
      storagePath
    )
  )
  {
    const storage =
    await supabaseClient
      .storage
      .from(
        CONFIG.storageBucket
      )
      .remove(
        [
          storagePath,
        ]
      );

    if (
      storage.error
    )
    {
      console.warn(
        "Storage remove:",
        storage.error.message
      );
    }
  }

  await loadProductImages();

  refreshAdminTab();

  adminMessage(
    state.language === "en"
    ?
    "Photo deleted."
    :
    "Foto eliminada.",
    "ok"
  );
}

async function upsertSiteSetting(
  key,
  value
)
{
  const result =
  await supabaseClient
    .from(
      "site_settings"
    )
    .upsert(
      {
        key:
        key,

        value:
        value,

        updated_at:
        new Date().toISOString(),
      },
      {
        onConflict:
        "key",
      }
    )
    .select(
      "*"
    )
    .single();

  if (
    result.error
  )
  {
    throw result.error;
  }

  state.siteSettings[
    key
  ] =
  result.data.value
  ||
  value;

  return result.data;
}
