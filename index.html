function sanitizeCoverSlot(
  value
)
{
  return String(
    value || "cover"
  )
  .toLowerCase()
  .replace(
    /[^a-z0-9_-]/g,
    "-"
  )
  .slice(
    0,
    80
  )
  ||
  "cover";
}

async function uploadSiteCoverFile(
  slot,
  file,
  settingKey = "cover_images"
)
{
  if (
    !file ||
    !String(file.type || "").startsWith("image/")
  )
  {
    throw new Error(
      "Seleccioná un archivo de imagen válido."
    );
  }

  if (
    file.size > CONFIG.maxImageBytes
  )
  {
    throw new Error(
      "La imagen puede pesar como máximo 8 MB."
    );
  }

  const safeSlot =
  sanitizeCoverSlot(
    slot
  );

  const extension =
  sanitizeFileExtension(
    file
  );

  const path =
  "portadas/" +
  safeSlot +
  "/" +
  makeId("cover") +
  "." +
  extension;

  const upload =
  await supabaseClient
    .storage
    .from(
      CONFIG.storageBucket
    )
    .upload(
      path,
      file,
      {
        upsert: false,
        contentType: file.type,
      }
    );

  if (upload.error)
  {
    throw upload.error;
  }

  const settings =
  {
    ...getSiteSettingObject(
      settingKey
    ),
  };

  const previous =
  settings[slot]
  ||
  "";

  settings[slot] =
  path;

  try
  {
    await upsertSiteSetting(
      settingKey,
      settings
    );
  }
  catch (error)
  {
    await supabaseClient
      .storage
      .from(
        CONFIG.storageBucket
      )
      .remove([path]);

    throw error;
  }

  const previousNormalized =
  normalizeStoragePath(
    previous
  );

  if (
    previousNormalized.kind === "storage" &&
    previousNormalized.value &&
    previousNormalized.value !== path
  )
  {
    const removeOld =
    await supabaseClient
      .storage
      .from(
        CONFIG.storageBucket
      )
      .remove([
        previousNormalized.value,
      ]);

    if (removeOld.error)
    {
      console.warn(
        "No se pudo eliminar la portada anterior:",
        removeOld.error.message
      );
    }
  }

  await loadSiteCoverUrls();
}

async function saveSiteCoverUrl(
  slot
)
{
  try
  {
    const value =
    getInputValue(
      `cover-url-${slot}`
    );

    if (
      value &&
      !/^https?:\/\//i.test(value)
    )
    {
      throw new Error(
        "La URL debe comenzar con http:// o https://"
      );
    }

    const settings =
    {
      ...getSiteSettingObject(
        "cover_images"
      ),
    };

    const previous =
    settings[slot]
    ||
    "";

    if (value)
    {
      settings[slot] = value;
    }
    else
    {
      delete settings[slot];
    }

    await upsertSiteSetting(
      "cover_images",
      settings
    );

    const previousNormalized =
    normalizeStoragePath(
      previous
    );

    if (
      previousNormalized.kind === "storage" &&
      previousNormalized.value
    )
    {
      await supabaseClient
        .storage
        .from(
          CONFIG.storageBucket
        )
        .remove([
          previousNormalized.value,
        ]);
    }

    await loadSiteCoverUrls();

    refreshAdminTab();

    adminMessage(
      "Portada actualizada.",
      "ok"
    );
  }
  catch (error)
  {
    adminMessage(
      error.message,
      "error"
    );
  }
}

async function deleteSiteCover(
  slot,
  settingKey = "cover_images"
)
{
  try
  {
    const settings =
    {
      ...getSiteSettingObject(
        settingKey
      ),
    };

    const previous =
    settings[slot]
    ||
    "";

    delete settings[slot];

    await upsertSiteSetting(
      settingKey,
      settings
    );

    const previousNormalized =
    normalizeStoragePath(
      previous
    );

    if (
      previousNormalized.kind === "storage" &&
      previousNormalized.value
    )
    {
      const removed =
      await supabaseClient
        .storage
        .from(
          CONFIG.storageBucket
        )
        .remove([
          previousNormalized.value,
        ]);

      if (removed.error)
      {
        console.warn(
          "Storage remove:",
          removed.error.message
        );
      }
    }

    await loadSiteCoverUrls();

    refreshAdminTab();

    adminMessage(
      "Portada eliminada. Se volverá a usar la imagen automática.",
      "ok"
    );
  }
  catch (error)
  {
    adminMessage(
      error.message,
      "error"
    );
  }
}

async function saveAdminCollection(
  collectionId
)
{
  const collection =
  state.collections.find(
    item =>
    Number(
      item.id
    ) ===
    Number(
      collectionId
    )
  );

  if (
    !collection
  )
  {
    return;
  }

  const key =
  collection.id
  ||
  collection.slug;

  const payload =
  {
    nombre_es:
    getInputValue(
      `collection-es-${key}`
    ),

    nombre_en:
    getInputValue(
      `collection-en-${key}`
    ),

    descripcion_es:
    getInputValue(
      `collection-desc-es-${key}`
    ),

    descripcion_en:
    getInputValue(
      `collection-desc-en-${key}`
    ),

    updated_at:
    new Date().toISOString(),
  };

  const result =
  await supabaseClient
    .from(
      "thematic_collections"
    )
    .update(
      payload
    )
    .eq(
      "id",
      Number(
        collectionId
      )
    )
    .select(
      "*"
    )
    .single();

  if (
    result.error
  )
  {
    adminMessage(
      result.error.message,
      "error"
    );

    return;
  }

  await loadCollections();

  refreshAdminTab();

  adminMessage(
    state.language === "en"
    ?
    "Collection saved."
    :
    "Colección guardada.",
    "ok"
  );
}

async function saveAdminGame(
  gameId
)
{
  const config =
  state.gameConfigs.find(
    item =>
    Number(
      item.id
    ) ===
    Number(
      gameId
    )
  );

  if (
    !config
  )
  {
    return;
  }

  const payload =
  {
    tiempo_limite:
    Math.max(
      10,
      getInputNumber(
        `game-time-${gameId}`,
        config.tiempo_limite
      )
    ),

    updated_at:
    new Date().toISOString(),
  };

  if (
    config.tipo === "puzzle"
  )
  {
    payload.piezas =
    20;
  }

  if (
    config.tipo === "differences"
  )
  {
    payload.diferencias =
    5;
  }

  const result =
  await supabaseClient
    .from(
      "aroma_games"
    )
    .update(
      payload
    )
    .eq(
      "id",
      Number(
        gameId
      )
    );

  if (
    result.error
  )
  {
    adminMessage(
      result.error.message,
      "error"
    );

    return;
  }

  await loadGameConfigs();

  refreshAdminTab();

  adminMessage(
    state.language === "en"
    ?
    "Game settings saved."
    :
    "Configuración del juego guardada.",
    "ok"
  );
}

        },
        30
      );
    }

    function submitGlobalSearch()
    {
      const value =
      document.getElementById(
        "globalSearchInput"
      )?.value.trim()
      ||
      "";

      state.catalogSearch =
      value;

      state.catalogFilter =
      "Todos";

      state.catalogPage =
      1;

      setRoute(
        "catalog"
      );
    }

    function handleRouteElement(
      element
    )
    {
      const route =
      element.dataset.route;

      if (
        !route
      )
      {
        return false;
      }

      if (
        route === "catalog"
      )
      {
        state.catalogFilter =
        element.dataset.filter
        ||
        "Todos";

        state.catalogPage =
        1;
      }

      if (
        route === "product"
      )
      {
        state.selectedGalleryUrl =
        "";

        setRoute(
          "product",
          {
            id:
            Number(
              element.dataset.productId
            ),
          }
        );

        return true;
      }

      if (
        route === "collection"
      )
      {
        setRoute(
          "collection",
          {
            slug:
            element.dataset.collectionSlug
            ||
            "",
          }
        );

        return true;
      }

      setRoute(
        route
      );

      return true;
    }

    async function handleAction(
      element
    )
    {
      const action =
      element.dataset.action;

      if (
        !action
      )
      {
        return;
      }

      switch (
        action
      )
      {
        case "home":
        {
          setRoute(
            "home"
          );

          break;
        }

        case "open-menu":
        {
          openMenu();

          break;
        }

        case "close-menu":
        {
          closeMenu();

          break;
        }

        case "open-cart":
        {
          openCart();

          break;
        }

        case "close-cart":
        {
          closeCart();

          break;
        }

        case "close-modal":
        {
          closeModal();

          break;
        }

        case "open-search":
        {
          openSearchModal();

          break;
        }

        case "global-search-submit":
        {
          submitGlobalSearch();

          break;
        }

        case "select-hero-collection":
        {
          state.heroCollectionIndex =
          clamp(
            asNumber(
              element.dataset.index,
              0
            ),
            0,
            Math.max(
              0,
              getHeroCollections().length - 1
            )
          );

          renderCurrentRoute();

          break;
        }

        case "toggle-favorite":
        {
          toggleFavorite(
            element.dataset.productId
          );

          break;
        }

        case "add-product":
        {
          addProductToCart(
            element.dataset.productId
          );

          break;
        }

        case "cart-qty":
        {
          changeCartQuantity(
            element.dataset.cartKey,
            asNumber(
              element.dataset.delta,
              0
            )
          );

          break;
        }

        case "remove-cart-line":
        {
          removeCartLine(
            element.dataset.cartKey
          );

          break;
        }

        case "checkout":
        {
          openCheckout();

          break;
        }

        case "validate-game-discount":
        {
          await validateGameDiscount();

          break;
        }

        case "send-whatsapp-order":
        {
          sendWhatsAppOrder();

          break;
        }

        case "shipping-choice":
        {
          toggleShippingFields();

          break;
        }

        case "catalog-filter":
        {
          state.catalogFilter =
          element.dataset.filter
          ||
          "Todos";

          state.catalogPage =
          1;

          renderCurrentRoute();

          break;
        }

        case "catalog-page":
        {
          state.catalogPage =
          Math.max(
            1,
            asNumber(
              element.dataset.page,
              1
            )
          );

          renderCurrentRoute();

          window.scrollTo(
            {
              top:
              0,

              behavior:
              "smooth",
            }
          );

          break;
        }

        case "clear-catalog":
        {
          state.catalogFilter =
          "Todos";

          state.catalogSearch =
          "";

          state.catalogSort =
          "default";

          state.catalogPage =
          1;

          renderCurrentRoute();

          break;
        }

        case "select-gallery-image":
        {
          state.selectedGalleryUrl =
          element.dataset.imageUrl
          ||
          "";

          renderCurrentRoute();

          break;
        }

        case "add-decant":
        {
          await addDecantToDraft(
            element.dataset.productId
          );

          break;
        }

        case "remove-decant":
        {
          const index =
          asNumber(
            element.dataset.index,
            -1
          );

          if (
            index >= 0
          )
          {
            state.decantDraft.splice(
              index,
              1
            );

            updateDecantSummaryOnly();
          }

          break;
        }

        case "add-decant-bundle-to-cart":
        {
          addDecantBundleToCart();

          break;
        }

        case "add-gift-product":
        {
          addGiftProductToDraft(
            element.dataset.productId
          );

          break;
        }

        case "remove-gift-product":
        {
          const index =
          asNumber(
            element.dataset.index,
            -1
          );

          if (
            index >= 0
          )
          {
            state.giftDraft.splice(
              index,
              1
            );

            updateGiftSummaryOnly();
          }

          break;
        }

        case "add-gift-bundle-to-cart":
        {
          addGiftBundleToCart();

          break;
        }

        case "save-game-player":
        {
          saveGamePlayerFromForm();

          break;
        }

        case "clear-game-player":
        {
          clearGamePlayer();

          break;
        }

        case "start-game":
        {
          await startGame(
            element.dataset.gameType
          );

          break;
        }

        case "restart-game":
        {
          closeModal();

          restartGame();

          break;
        }

        case "puzzle-piece":
        {
          puzzlePieceClick(
            element.dataset.index
          );

          break;
        }

        case "difference-zone":
        {
          findDifference(
            element.dataset.differenceId
          );

          break;
        }

        case "hidden-tile":
        {
          hiddenTileClick(
            element.dataset.index
          );

          break;
        }

        case "advisor-send":
        {
          await sendAdvisorMessage();

          break;
        }

        case "advisor-prompt":
        {
          const input =
          document.getElementById(
            "advisorInput"
          );

          if (
            input
          )
          {
            input.value =
            element.dataset.prompt
            ||
            "";

            input.focus();
          }

          break;
        }

        case "open-whatsapp":
        {
          openWhatsAppGeneral();

          break;
        }

        case "send-contact-whatsapp":
        {
          sendContactWhatsApp();

          break;
        }

        case "reload-data":
        {
          await loadAllData();

          break;
        }

        case "admin-login":
        {
          await adminLogin();

          break;
        }

        case "admin-recover":
        {
          await adminRecoverPassword();

          break;
        }

        case "admin-logout":
        {
          await adminLogout();

          break;
        }

        case "admin-reload":
        {
          await loadAllData();

          state.route =
          "admin";

          renderCurrentRoute();

          break;
        }

        case "admin-tab":
        {
          state.admin.tab =
          element.dataset.tab
          ||
          "products";

          if (
            state.admin.tab === "games"
          )
          {
            await loadGameRewardsAdmin();
          }

          refreshAdminTab();

          break;
        }

        case "admin-award-yesterday":
        {
          await awardYesterdayGameWinner();

          break;
        }

        case "admin-send-game-reward":
        {
          sendGameRewardWhatsApp(
            element.dataset.rewardId
          );

          break;
        }

        case "admin-mark-game-reward-sent":
        {
          await updateGameRewardStatus(
            element.dataset.rewardId,
            "sent"
          );

          break;
        }

        case "admin-mark-game-reward-used":
        {
          await updateGameRewardStatus(
            element.dataset.rewardId,
            "used"
          );

          break;
        }

        case "admin-create-product":
        {
          await createProductFromAdmin();

          break;
        }

        case "admin-save-product":
        {
          await saveAdminProduct(
            element.dataset.productId
          );

          break;
        }

        case "admin-delete-product":
        {
          await deleteAdminProduct(
            element.dataset.productId
          );

          break;
        }

        case "admin-delete-photo":
        {
          await deleteAdminPhoto(
            element.dataset.imageId,
            element.dataset.productId,
            element.dataset.storagePath
          );

          break;
        }

        case "admin-ai-new":
        {
          await fillNewProductWithAI();

          break;
        }

        case "admin-ai-existing":
        {
          await fillExistingProductWithAI(
            element.dataset.productId
          );

          break;
        }

        case "admin-open-image-search":
        {
          openImageSearch(
            element.dataset.imageQuery
          );

          break;
        }

        case "admin-save-contact-settings":
        {
          await saveContactSettings();

          break;
        }

        case "admin-save-shipping-settings":
        {
          await saveShippingSettings();

          break;
        }

        case "admin-save-video-settings":
        {
          await saveVideoSettings();

          break;
        }

        case "admin-save-ai-settings":
        {
          await saveAiSettings();

          break;
        }

        case "admin-save-cover-url":
        {
          await saveSiteCoverUrl(
            element.dataset.coverSlot
          );

          break;
        }

        case "admin-save-cover-position":
        {
          await saveSiteCoverPosition(
            element.dataset.coverSlot
          );

          break;
        }

        case "admin-delete-cover":
        {
          await deleteSiteCover(
            element.dataset.coverSlot,
            "cover_images"
          );

          break;
        }

        case "admin-delete-collection-cover":
        {
          await deleteSiteCover(
            element.dataset.collectionSlug,
            "collection_covers"
          );

          break;
        }

        case "admin-save-collection":
        {
          await saveAdminCollection(
            element.dataset.collectionId
          );

          break;
        }

        case "admin-save-game":
        {
          await saveAdminGame(
            element.dataset.gameId
          );

          break;
        }

        default:
        {
          console.debug(
            "Acción no manejada:",
            action
          );
        }
      }
    }

    document.addEventListener(
      "click",
      async (
        event
      ) =>
      {
        const routeElement =
        event.target.closest(
          "[data-route]"
        );

        if (
          routeElement
        )
        {
          event.preventDefault();

          if (
            handleRouteElement(
              routeElement
            )
          )
          {
            return;
          }
        }

        const actionElement =
        event.target.closest(
          "[data-action]"
        );

        if (
          actionElement
        )
        {
          event.preventDefault();

          await handleAction(
            actionElement
          );
        }
      }
    );

    document.addEventListener(
      "change",
      async (
        event
      ) =>
      {
        const target =
        event.target;

        if (
          target.id === "languageSelect"
        )
        {
          state.language =
          target.value === "en"
          ?
          "en"
          :
          "es";

          saveLocalState();

          clearGameTimer();

          renderCurrentRoute();

          return;
        }

        if (
          target.id === "catalogSort"
        )
        {
          state.catalogSort =
          target.value
          ||
          "default";

          state.catalogPage =
          1;

          renderCurrentRoute();

          return;
        }

        if (
          target.id === "giftOption"
        )
        {
          state.selectedGiftOption =
          target.value;

          state.giftDraft =
          [];

          renderCurrentRoute();

          return;
        }

        if (
          target.matches(
            'input[name="checkoutShipping"]'
          )
        )
        {
          toggleShippingFields();

          return;
        }

        if (
          target.matches(
            "[data-admin-cover-upload]"
          )
        )
        {
          const slot =
          target.dataset.adminCoverUpload;

          const file =
          target.files?.[0];

          if (file)
          {
            try
            {
              adminMessage(
                "Subiendo portada...",
                "ok"
              );

              await uploadSiteCoverFile(
                slot,
                file,
                "cover_images"
              );

              refreshAdminTab();

              adminMessage(
                "Portada actualizada correctamente.",
                "ok"
              );
            }
            catch (error)
            {
              adminMessage(
                error.message,
                "error"
              );
            }
          }

          return;
        }

        if (
          target.matches(
            "[data-admin-collection-cover-upload]"
          )
        )
        {
          const slug =
          target.dataset.adminCollectionCoverUpload;

          const file =
          target.files?.[0];

          if (file)
          {
            try
            {
              adminMessage(
                "Subiendo portada de colección...",
                "ok"
              );

              await uploadSiteCoverFile(
                slug,
                file,
                "collection_covers"
              );

              refreshAdminTab();

              adminMessage(
                "Portada de colección actualizada.",
                "ok"
              );
            }
            catch (error)
            {
              adminMessage(
                error.message,
                "error"
              );
            }
          }

          return;
        }

        if (
          target.matches(
            "[data-admin-upload]"
          )
        )
        {
          const productId =
          Number(
            target.dataset.adminUpload
          );

          const files =
          Array.from(
            target.files
            ||
            []
          );

          if (
            files.length
          )
          {
            try
            {
              adminMessage(
                state.language === "en"
                ?
                "Uploading photos..."
                :
                "Subiendo fotos...",
                "ok"
              );

              await uploadProductImages(
                productId,
                files
              );
            }
            catch (
              error
            )
            {
              adminMessage(
                error.message,
                "error"
              );
            }
          }

          return;
        }
      }
    );

    document.addEventListener(
      "input",
      (
        event
      ) =>
      {
        const target =
        event.target;

        if (
          target.id === "catalogSearch"
        )
        {
          state.catalogSearch =
          target.value;

          state.catalogPage =
          1;

          const selectionStart =
          target.selectionStart;

          const selectionEnd =
          target.selectionEnd;

          const app =
          document.getElementById(
            "app"
          );

          if (
            app
          )
          {
            app.innerHTML =
            renderCatalogPage();
          }

          const fresh =
          document.getElementById(
            "catalogSearch"
          );

          if (
            fresh
          )
          {
            fresh.focus();

            try
            {
              fresh.setSelectionRange(
                selectionStart,
                selectionEnd
              );
            }
            catch (
              error
            )
            {
              void error;
            }
          }
        }
      }
    );

    document.addEventListener(
      "keydown",
      async (
        event
      ) =>
      {
        if (
          event.key === "Escape"
        )
        {
          closeMenu();

          closeCart();

          closeModal();

          return;
        }

        if (
          event.key === "Enter" &&
          event.target?.id === "globalSearchInput"
        )
        {
          event.preventDefault();

          submitGlobalSearch();

          return;
        }

        if (
          event.key === "Enter" &&
          event.target?.id === "advisorInput"
        )
        {
          event.preventDefault();

          await sendAdvisorMessage();
        }
      }
    );

    function validateCartAgainstStock()
    {
      let changed =
      false;

      const next =
      [];

      for (
        const line of
        state.cart
      )
      {
        if (
          line.kind !== "product"
        )
        {
          next.push(
            line
          );

          continue;
        }

        const product =
        getProductById(
          line.productId
          ??
          line.id
        );

        if (
          !product
        )
        {
          changed =
          true;

          continue;
        }

        const maxQty =
        Math.max(
          0,
          product.stock
        );

        if (
          maxQty <= 0
        )
        {
          changed =
          true;

          continue;
        }

        if (
          line.qty > maxQty
        )
        {
          line.qty =
          maxQty;

          changed =
          true;
        }

        next.push(
          line
        );
      }

      state.cart =
      next;

      if (
        changed
      )
      {
        saveLocalState();
      }
    }

    function exposeCompatibilityApi()
    {
      window.goHome =
      () =>
      setRoute(
        "home"
      );

      window.catalog =
      category =>
      {
        state.catalogFilter =
        category
        ||
        "Todos";

        setRoute(
          "catalog"
        );
      };

      window.showFavorites =
      () =>
      setRoute(
        "favorites"
      );

      window.openCart =
      openCart;

      window.closeCart =
      closeCart;

      window.openMenu =
      openMenu;

      window.closeMenu =
      closeMenu;

      window.closeModal =
      closeModal;

      window.checkout =
      openCheckout;

      window.addCart =
      addProductToCart;

      window.productDetail =
      id =>
      setRoute(
        "product",
        {
          id:
          id,
        }
      );

      window.showContact =
      () =>
      setRoute(
        "contact"
      );

      window.showAbout =
      () =>
      setRoute(
        "about"
      );

      window.showAdmin =
      () =>
      setRoute(
        "admin"
      );

      window.toggleFav =
      toggleFavorite;

      window.adminLogin =
      adminLogin;

      window.signOut =
      adminLogout;

      window.crearProducto =
      createProductFromAdmin;

      window.adminSave =
      saveAdminProduct;

      window.deleteProduct =
      deleteAdminProduct;

      window.uploadProductImages =
      uploadProductImages;
    }

    async function initialize()
    {
      applyLanguageToChrome();

      renderMobileMenu();

      renderFooter();

      updateHeaderCounts();

      exposeCompatibilityApi();

      await loadAllData();

      validateCartAgainstStock();

      updateHeaderCounts();

      window.setInterval(
        () =>
        {
          validateCartAgainstStock();
        },
        45000
      );

      supabaseClient.auth.onAuthStateChange(
        (
          event,
          session
        ) =>
        {
          state.admin.currentUser =
          session?.user
          ||
          null;

          if (
            state.route === "admin" &&
            (
              event === "SIGNED_IN" ||
              event === "SIGNED_OUT" ||
              event === "TOKEN_REFRESHED"
            )
          )
          {
            renderCurrentRoute();
          }
        }
      );
    }

    initialize();
  </script>
</body>
</html>
