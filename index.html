
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AromaLParfum — perfumes, decants, regalos y experiencias de perfumería.">
  <meta name="theme-color" content="#15120f">
  <title>AromaLParfum | Perfumería</title>
  <meta name="application-name" content="AromaLParfum">
  <meta name="color-scheme" content="light">

  <style>
    :root {
      --bg: #f4efe8;
      --bg-soft: #faf7f2;
      --paper: #fffdfa;
      --card: #fffaf4;
      --ink: #17130f;
      --ink-soft: #3d352d;
      --muted: #766d64;
      --muted-2: #9a9086;
      --line: #dfd5ca;
      --line-strong: #cfc2b4;
      --accent: #9b7449;
      --accent-2: #c8a77a;
      --accent-soft: #eadcc9;
      --dark: #12100e;
      --dark-2: #1d1916;
      --success: #2f6f4f;
      --warning: #a86f24;
      --danger: #a1353e;
      --shadow-soft: 0 14px 40px rgba(42, 31, 20, 0.08);
      --shadow-card: 0 10px 24px rgba(35, 27, 20, 0.06);
      --radius-xs: 2px;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 22px;
      --radius-pill: 999px;
      --max: 1420px;
      --header-height: 78px;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Inter, Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      min-width: 320px;
    }

    body.no-scroll {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    img,
    video {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    [hidden],
    .hidden {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .topbar {
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 7px 16px;
      background: var(--dark);
      color: #fff;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
    }

    .topbar-separator {
      opacity: .55;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 80;
      background: rgba(250, 247, 242, .96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(207, 194, 180, .7);
    }

    .header-inner {
      max-width: var(--max);
      height: var(--header-height);
      margin: 0 auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: minmax(170px, 1fr) auto minmax(170px, 1fr);
      align-items: center;
      gap: 18px;
    }

    .brand {
      justify-self: start;
      font-family: var(--serif);
      font-size: 30px;
      letter-spacing: 8px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }

    .brand small {
      display: block;
      margin-top: 7px;
      font-family: var(--sans);
      font-size: 8px;
      letter-spacing: 5px;
      text-align: center;
      color: var(--muted);
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-size: 10px;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .desktop-nav button {
      padding: 10px 0;
      border: 0;
      background: transparent;
      color: var(--ink);
    }

    .desktop-nav button:hover {
      color: var(--accent);
    }

    .header-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      position: relative;
      width: 42px;
      height: 42px;
      display: inline-grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: var(--ink);
      border-radius: 50%;
    }

    .icon-btn:hover {
      background: rgba(155, 116, 73, .08);
    }

    .icon-btn svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
    }

    .count {
      position: absolute;
      right: 1px;
      top: 0;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      background: var(--dark);
      color: #fff;
      border-radius: 50%;
      font-size: 9px;
      font-weight: 700;
    }

    .lang-switch {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      min-height: 35px;
      padding: 0 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      letter-spacing: .6px;
    }

    .mobile-menu-btn {
      display: none;
    }

    .page-shell {
      min-height: 50vh;
    }

    .container {
      width: min(var(--max), calc(100% - 48px));
      margin: 0 auto;
    }

    .section {
      padding: 56px 0;
    }

    .section.compact {
      padding: 34px 0;
    }

    .section-title-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2.6px;
      text-transform: uppercase;
    }

    .section-title {
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(32px, 4vw, 52px);
      line-height: 1.02;
    }

    .section-subtitle {
      max-width: 680px;
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 7px 0;
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .text-link:hover {
      color: var(--accent);
    }

    .btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid var(--dark);
      border-radius: var(--radius-xs);
      padding: 0 18px;
      background: var(--dark);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      transition: transform .18s ease, opacity .18s ease, background .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn.light {
      border-color: var(--paper);
      background: var(--paper);
      color: var(--ink);
    }

    .btn.outline {
      background: transparent;
      color: var(--ink);
    }

    .btn.gold {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .btn.danger {
      border-color: var(--danger);
      background: var(--danger);
      color: #fff;
    }

    .btn.success {
      border-color: var(--success);
      background: var(--success);
      color: #fff;
    }

    .btn.soft {
      border-color: var(--line);
      background: var(--paper);
      color: var(--ink);
    }

    .btn.small {
      min-height: 34px;
      padding: 0 11px;
      font-size: 9px;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .luxury-hero {
      position: relative;
      min-height: 620px;
      overflow: hidden;
      background:
        radial-gradient(circle at 76% 24%, rgba(255,255,255,.68), transparent 25%),
        radial-gradient(circle at 20% 18%, rgba(255,255,255,.7), transparent 23%),
        linear-gradient(110deg, #eee2d4 0%, #dbc5ab 46%, #c8ad8d 100%);
    }

    .luxury-hero-grid {
      min-height: 620px;
      display: grid;
      grid-template-columns: 1.08fr 1.22fr .48fr;
      align-items: center;
      gap: 30px;
      padding: 64px 0 82px;
    }

    .hero-copy {
      position: relative;
      z-index: 3;
      max-width: 570px;
    }

    .hero-copy h1 {
      margin: 14px 0 20px;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(54px, 6vw, 88px);
      line-height: .94;
      letter-spacing: -2px;
    }

    .hero-copy p {
      max-width: 500px;
      margin: 0 0 30px;
      color: #43382e;
      font-size: 14px;
      line-height: 1.8;
    }

    .hero-visual {
      position: relative;
      min-height: 500px;
      display: grid;
      place-items: center;
    }

    .hero-product-stage {
      position: relative;
      width: min(470px, 88%);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
    }

    .hero-product-stage::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 7%;
      height: 22%;
      background: linear-gradient(180deg, #f0e6dc, #cab294);
      border-radius: 50% / 20%;
      box-shadow: 0 20px 42px rgba(83, 61, 41, .22);
      transform: perspective(700px) rotateX(63deg);
    }

    .hero-product-stage::after {
      content: "";
      position: absolute;
      width: 78%;
      height: 78%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.38), transparent 68%);
      filter: blur(5px);
    }

    .hero-product-stage img {
      position: relative;
      z-index: 3;
      width: 72%;
      height: 78%;
      object-fit: contain;
      filter: drop-shadow(0 25px 24px rgba(48, 35, 24, .22));
    }

    .hero-product-fallback {
      position: relative;
      z-index: 3;
      width: 58%;
      aspect-ratio: .72;
      display: grid;
      place-items: center;
      padding: 24px;
      border: 1px solid rgba(38, 30, 24, .22);
      background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.18));
      box-shadow: 0 20px 55px rgba(69, 49, 32, .18);
      font-family: var(--serif);
      font-size: 24px;
      text-align: center;
    }

    .hero-benefits {
      display: grid;
      gap: 28px;
      align-content: center;
    }

    .hero-benefit {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 12px;
      align-items: center;
      font-size: 9px;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .hero-benefit-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(56, 42, 31, .22);
      border-radius: 50%;
      font-size: 17px;
    }

    .hero-collection-tabs {
      position: absolute;
      left: 50%;
      bottom: 20px;
      z-index: 4;
      transform: translateX(-50%);
      width: min(var(--max), calc(100% - 48px));
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px;
      background: rgba(255,250,244,.86);
      border: 1px solid rgba(255,255,255,.6);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-soft);
    }

    .hero-collection-tab {
      min-width: 145px;
      min-height: 42px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      padding: 0 12px;
      font-size: 9px;
      letter-spacing: .8px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .hero-collection-tab.active {
      border-color: var(--dark);
      background: var(--dark);
      color: #fff;
    }

    /* =========================================================
       HERO CON PORTADA PERSONALIZADA A PANTALLA COMPLETA
       La imagen subida desde Administración pasa a ser el fondo
       real del hero. Si no hay portada, se conserva el escenario
       automático con el perfume del catálogo.
    ========================================================= */

    .luxury-hero.hero-cover-active {
      min-height: clamp(560px, 42vw, 760px);
      background-image: var(--hero-cover-image);
      background-size: cover;
      background-repeat: no-repeat;
      background-position: var(--hero-cover-position, center center);
      background-color: #e8d6c1;
    }

    .luxury-hero.hero-cover-active::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg,
          rgba(247, 241, 232, .97) 0%,
          rgba(247, 241, 232, .92) 18%,
          rgba(247, 241, 232, .78) 34%,
          rgba(247, 241, 232, .42) 49%,
          rgba(247, 241, 232, .12) 63%,
          rgba(247, 241, 232, 0) 78%);
    }

    .luxury-hero.hero-cover-active::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg,
          rgba(17, 14, 12, .02),
          transparent 35%,
          transparent 72%,
          rgba(17, 14, 12, .08));
    }

    .hero-cover-active .container {
      position: relative;
      z-index: 2;
    }

    .hero-cover-active .luxury-hero-grid {
      min-height: clamp(560px, 42vw, 760px);
      grid-template-columns: minmax(0, 610px) 1fr;
      align-items: center;
      gap: 0;
      padding: 72px 0 104px;
    }

    .hero-cover-active .hero-copy {
      max-width: 610px;
      padding-right: clamp(12px, 3vw, 48px);
      text-shadow: 0 1px 0 rgba(255, 255, 255, .28);
    }

    .hero-cover-active .hero-copy h1 {
      max-width: 8.5ch;
    }

    .hero-cover-active .hero-copy p {
      max-width: 520px;
      color: #3d342c;
    }

    .hero-cover-active .hero-visual,
    .hero-cover-active .hero-benefits {
      display: none;
    }

    .hero-cover-active .hero-collection-tabs {
      z-index: 5;
      background: rgba(255, 252, 247, .90);
      border-color: rgba(255, 255, 255, .78);
      box-shadow: 0 16px 36px rgba(45, 33, 24, .10);
    }

    @media (max-width: 900px) {
      .luxury-hero.hero-cover-active {
        min-height: 650px;
        background-position: var(--hero-cover-position-mobile, var(--hero-cover-position, 68% center));
      }

      .luxury-hero.hero-cover-active::before {
        background:
          linear-gradient(90deg,
            rgba(247, 241, 232, .96) 0%,
            rgba(247, 241, 232, .86) 58%,
            rgba(247, 241, 232, .34) 78%,
            rgba(247, 241, 232, .08) 100%),
          linear-gradient(180deg,
            rgba(247, 241, 232, .15),
            transparent 52%,
            rgba(247, 241, 232, .42));
      }

      .hero-cover-active .luxury-hero-grid {
        min-height: 650px;
        grid-template-columns: 1fr;
        align-items: end;
        padding: 64px 0 112px;
      }

      .hero-cover-active .hero-copy {
        max-width: min(570px, 92%);
        padding: 22px 0;
      }
    }

    @media (max-width: 620px) {
      .luxury-hero.hero-cover-active {
        min-height: 610px;
      }

      .luxury-hero.hero-cover-active::before {
        background:
          linear-gradient(180deg,
            rgba(247, 241, 232, .88) 0%,
            rgba(247, 241, 232, .74) 38%,
            rgba(247, 241, 232, .44) 63%,
            rgba(247, 241, 232, .70) 100%);
      }

      .hero-cover-active .luxury-hero-grid {
        min-height: 610px;
        align-items: end;
        padding: 52px 0 105px;
      }

      .hero-cover-active .hero-copy {
        max-width: 100%;
        padding: 18px 0 8px;
      }

      .hero-cover-active .hero-copy h1 {
        max-width: 9ch;
        font-size: clamp(44px, 13vw, 58px);
      }

      .hero-cover-active .hero-copy p {
        max-width: 38ch;
      }
    }

    .category-rail-wrap {
      margin-top: -1px;
      background: var(--bg-soft);
      border-bottom: 1px solid var(--line);
    }

    .category-rail {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-left: 1px solid var(--line);
      background: var(--bg-soft);
    }

    .category-tile {
      min-height: 130px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 11px;
      padding: 16px 12px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      text-align: center;
      color: var(--ink);
    }

    .category-tile:hover {
      background: #efe7dd;
    }

    .category-icon {
      font-size: 27px;
      line-height: 1;
    }

    .category-tile strong {
      font-size: 9px;
      letter-spacing: .8px;
      text-transform: uppercase;
      line-height: 1.45;
    }

    .seasonal-video {
      overflow: hidden;
      background: var(--dark);
      color: #fff;
    }

    .seasonal-video-grid {
      min-height: 420px;
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      align-items: stretch;
    }

    .seasonal-video-copy {
      padding: 62px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .seasonal-video-copy h2 {
      margin: 12px 0 18px;
      font-family: var(--serif);
      font-size: clamp(38px, 5vw, 64px);
      font-weight: 400;
      line-height: 1;
    }

    .seasonal-video-copy p {
      color: #cfc7bf;
      line-height: 1.8;
    }

    .seasonal-video-media {
      min-height: 380px;
      background: #241e19;
    }

    .seasonal-video-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-row-scroller {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(210px, 1fr);
      grid-template-rows: 1fr;
      gap: 12px;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scroll-snap-type: inline mandatory;
      padding-bottom: 6px;
    }

    .product-card {
      min-width: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      scroll-snap-align: start;
    }

    .product-media {
      position: relative;
      aspect-ratio: .92 / 1;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 32%, #fff 0%, #f7f0e7 36%, #e8dbcb 100%);
    }

    .product-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 14px;
      transition: transform .28s ease;
    }

    .product-card:hover .product-media img {
      transform: scale(1.03);
    }

    .product-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 20px;
    }

    .product-badges {
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 2;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border-radius: var(--radius-pill);
      background: rgba(18,16,14,.9);
      color: #fff;
      font-size: 8px;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .badge.new {
      background: #8d6843;
    }

    .badge.featured {
      background: #1b1916;
    }

    .badge.best {
      background: #704d2f;
    }

    .fav-mini {
      position: absolute;
      top: 9px;
      right: 9px;
      z-index: 2;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(23,19,15,.12);
      border-radius: 50%;
      background: rgba(255,253,250,.92);
      color: var(--ink);
      font-size: 18px;
    }

    .fav-mini.active {
      color: var(--danger);
    }

    .product-body {
      padding: 14px 14px 16px;
      border-top: 1px solid var(--line);
    }

    .product-kicker {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .product-title {
      margin: 0;
      min-height: 38px;
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.15;
    }

    .product-notes {
      min-height: 31px;
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .product-bottom {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .product-price {
      font-size: 11px;
      font-weight: 700;
    }

    .add-circle {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--dark);
      color: #fff;
      font-size: 18px;
      line-height: 1;
    }

    .add-circle:disabled {
      opacity: .35;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .catalog-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
    }

    .catalog-pagination {
      margin-top: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .catalog-page-btn {
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xs);
      background: var(--paper);
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .catalog-page-btn:hover {
      border-color: var(--accent);
    }

    .catalog-page-btn.active {
      background: var(--dark);
      border-color: var(--dark);
      color: #fff;
    }

    .catalog-page-btn:disabled {
      opacity: .35;
      cursor: default;
    }

    .catalog-page-info {
      width: 100%;
      text-align: center;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
    }

    .search-input,
    .select-input,
    .text-input,
    .number-input,
    .textarea-input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: var(--radius-xs);
      padding: 10px 12px;
      outline: none;
    }

    .textarea-input {
      min-height: 105px;
      resize: vertical;
    }

    .search-input:focus,
    .select-input:focus,
    .text-input:focus,
    .number-input:focus,
    .textarea-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(155,116,73,.1);
    }

    .chips {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 1px 0 7px;
      margin-bottom: 18px;
    }

    .chip {
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      background: var(--paper);
      color: var(--ink);
      white-space: nowrap;
      font-size: 9px;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .chip.active {
      border-color: var(--dark);
      background: var(--dark);
      color: #fff;
    }

    .promo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .promo-card {
      position: relative;
      min-height: 430px;
      overflow: hidden;
      padding: 42px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border: 1px solid var(--line);
    }

    .promo-card.dark {
      background:
        radial-gradient(circle at 80% 30%, rgba(173,135,91,.25), transparent 27%),
        linear-gradient(135deg, #14110f 0%, #2c211a 100%);
      color: #fff;
    }

    .promo-card.light {
      background:
        radial-gradient(circle at 72% 28%, rgba(255,255,255,.78), transparent 30%),
        linear-gradient(135deg, #d9c2a8 0%, #efe2d4 100%);
      color: var(--ink);
    }

    .promo-card h3 {
      max-width: 430px;
      margin: 10px 0 14px;
      font-family: var(--serif);
      font-size: clamp(36px, 4vw, 58px);
      font-weight: 400;
      line-height: .98;
    }

    .promo-card p {
      max-width: 460px;
      margin: 0 0 22px;
      color: inherit;
      opacity: .82;
      font-size: 13px;
      line-height: 1.7;
    }

    .promo-visual {
      position: absolute;
      right: -4%;
      top: 8%;
      width: 50%;
      height: 60%;
      display: grid;
      place-items: center;
      opacity: .9;
      pointer-events: none;
    }

    .promo-visual img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 20px 22px rgba(0,0,0,.24));
    }

    .service-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--bg-soft);
    }

    .service-item {
      min-height: 96px;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      align-items: center;
      padding: 18px 22px;
      border-right: 1px solid var(--line);
    }

    .service-item:last-child {
      border-right: 0;
    }

    .service-icon {
      font-size: 22px;
      text-align: center;
    }

    .service-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 9px;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .service-item span {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .footer {
      padding: 54px 0 30px;
      background: var(--dark);
      color: #fff;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.7fr repeat(3, .8fr) 1.1fr;
      gap: 36px;
    }

    .footer h4 {
      margin: 0 0 15px;
      font-size: 9px;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    .footer-brand {
      margin-bottom: 15px;
      font-family: var(--serif);
      font-size: 26px;
      letter-spacing: 6px;
    }

    .footer-copy {
      color: #c1b9b1;
      line-height: 1.7;
      font-size: 12px;
    }

    .footer-link {
      display: block;
      border: 0;
      background: transparent;
      color: #c8c0b8;
      padding: 5px 0;
      font-size: 11px;
      text-align: left;
    }

    .footer-link:hover {
      color: #fff;
    }

    .social-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .social-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid #4a433d;
      background: transparent;
      color: #fff;
      border-radius: 50%;
      font-size: 12px;
    }

    .social-btn:hover {
      border-color: #fff;
    }

    .footer-bottom {
      margin-top: 36px;
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      border-top: 1px solid #2e2925;
      color: #817970;
      font-size: 10px;
    }

    .drawer {
      position: fixed;
      inset: 0;
      z-index: 120;
      pointer-events: none;
    }

    .drawer.open {
      pointer-events: auto;
    }

    .drawer-shade {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.48);
      opacity: 0;
      transition: opacity .2s ease;
    }

    .drawer.open .drawer-shade {
      opacity: 1;
    }

    .drawer-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: min(450px, 94vw);
      overflow-y: auto;
      background: var(--paper);
      box-shadow: var(--shadow-soft);
      transition: transform .22s ease;
    }

    .drawer.menu .drawer-panel {
      left: 0;
      transform: translateX(-100%);
    }

    .drawer.cart .drawer-panel {
      right: 0;
      transform: translateX(100%);
    }

    .drawer.menu.open .drawer-panel,
    .drawer.cart.open .drawer-panel {
      transform: translateX(0);
    }

    .drawer-head {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .drawer-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 400;
    }

    .close-btn {
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      font-size: 28px;
      line-height: 1;
    }

    .drawer-body {
      padding: 22px;
    }

    .menu-links {
      display: grid;
      gap: 2px;
    }

    .menu-link {
      min-height: 48px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      text-align: left;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .cart-line {
      display: grid;
      grid-template-columns: 68px minmax(0,1fr) auto;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .cart-line-image {
      width: 68px;
      height: 82px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #eee6dc;
    }

    .cart-line-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .cart-line h4 {
      margin: 0 0 5px;
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 400;
    }

    .cart-line-meta {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .qty-control {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .qty-control button {
      width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
    }

    .qty-control span {
      min-width: 30px;
      text-align: center;
      font-size: 10px;
    }

    .cart-summary {
      position: sticky;
      bottom: 0;
      margin-top: 18px;
      padding: 18px 0 0;
      background: linear-gradient(180deg, rgba(255,253,250,0), var(--paper) 18%);
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 0;
      font-size: 13px;
    }

    .cart-total-row.grand {
      margin-top: 5px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 19px;
      font-weight: 700;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 140;
      display: none;
    }

    .modal.open {
      display: block;
    }

    .modal-shade {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.58);
    }

    .modal-panel {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(900px, 94vw);
      max-height: 92vh;
      transform: translate(-50%, -50%);
      overflow-y: auto;
      background: var(--paper);
      box-shadow: var(--shadow-soft);
    }

    .modal-head {
      position: sticky;
      top: 0;
      z-index: 2;
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 22px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    .modal-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 400;
    }

    .modal-body {
      padding: 24px;
    }

    .detail-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 46px;
      align-items: start;
    }

    .detail-main-image {
      aspect-ratio: .92 / 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 28%, #fff, #f0e5d8 60%, #e4d3c0);
    }

    .detail-main-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 22px;
    }

    .detail-thumbs {
      margin-top: 9px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .detail-thumb {
      width: 70px;
      height: 82px;
      flex: 0 0 auto;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--paper);
      padding: 0;
    }

    .detail-thumb.active {
      border-color: var(--dark);
    }

    .detail-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .detail-copy h1 {
      margin: 10px 0 10px;
      font-family: var(--serif);
      font-size: clamp(42px, 5vw, 70px);
      line-height: .95;
      font-weight: 400;
    }

    .detail-price {
      margin: 15px 0;
      font-size: 20px;
      font-weight: 700;
    }

    .detail-description {
      color: var(--ink-soft);
      line-height: 1.85;
      font-size: 13px;
    }

    .note-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 22px;
    }

    .note-card {
      min-height: 105px;
      padding: 15px;
      border: 1px solid var(--line);
      background: var(--bg-soft);
    }

    .note-card strong {
      display: block;
      margin-bottom: 9px;
      color: var(--accent);
      font-size: 8px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .note-card span {
      font-size: 11px;
      line-height: 1.5;
    }

    .detail-info {
      margin-top: 20px;
      border-top: 1px solid var(--line);
    }

    .detail-info-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 16px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
    }

    .detail-info-row strong {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .builder-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(320px, .6fr);
      gap: 24px;
      align-items: start;
    }

    .builder-panel {
      padding: 22px;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .builder-panel.sticky {
      position: sticky;
      top: calc(var(--header-height) + 18px);
    }

    .builder-list {
      display: grid;
      gap: 9px;
    }

    .builder-product {
      display: grid;
      grid-template-columns: 64px minmax(0,1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      background: var(--bg-soft);
    }

    .builder-product-image {
      width: 64px;
      height: 74px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #eee5db;
    }

    .builder-product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .builder-product h4 {
      margin: 0 0 5px;
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 400;
    }

    .builder-summary-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
    }

    .builder-total {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 19px;
      font-weight: 700;
    }

    .game-hub-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .game-card {
      min-height: 340px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 72% 20%, rgba(255,255,255,.8), transparent 24%),
        linear-gradient(145deg, #eadfce, #c7b092);
    }

    .game-card:nth-child(2) {
      background:
        radial-gradient(circle at 72% 20%, rgba(255,255,255,.8), transparent 24%),
        linear-gradient(145deg, #d9c7b8, #967e6a);
    }

    .game-card:nth-child(3) {
      background:
        radial-gradient(circle at 72% 20%, rgba(255,255,255,.7), transparent 24%),
        linear-gradient(145deg, #cec3b8, #7d7066);
    }

    .game-card h3 {
      margin: 10px 0 10px;
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 400;
    }

    .game-card p {
      margin: 0 0 20px;
      color: #3e342c;
      font-size: 12px;
      line-height: 1.7;
    }

    .game-topbar {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .game-status {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 11px;
    }

    .puzzle-board {
      display: grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 2px;
      max-width: 700px;
      margin: 0 auto;
      background: var(--dark);
      border: 4px solid var(--dark);
      aspect-ratio: 5 / 4;
    }

    .puzzle-piece {
      position: relative;
      border: 0;
      background-repeat: no-repeat;
      background-color: #ddd2c5;
      overflow: hidden;
    }

    .puzzle-piece.selected {
      outline: 4px solid var(--accent);
      outline-offset: -4px;
    }

    .differences-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .difference-image {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background: #eadfce;
      border: 1px solid var(--line);
    }

    .difference-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .difference-zone {
      position: absolute;
      width: 14%;
      height: 14%;
      border: 0;
      border-radius: 50%;
      background: transparent;
    }

    .difference-zone.found {
      border: 3px solid var(--success);
      background: rgba(47,111,79,.12);
    }

    .difference-mark {
      position: absolute;
      width: 12%;
      height: 12%;
      border-radius: 50%;
      pointer-events: none;
      opacity: .72;
    }

    .difference-mark.type-1 {
      background: rgba(44,34,26,.78);
      filter: blur(2px);
    }

    .difference-mark.type-2 {
      border: 6px solid rgba(255,255,255,.84);
    }

    .difference-mark.type-3 {
      background: rgba(196,155,106,.75);
      transform: rotate(24deg);
      border-radius: 20% 70% 30% 60%;
    }

    .difference-mark.type-4 {
      background: rgba(73,54,41,.26);
      box-shadow: 0 0 0 4px rgba(255,255,255,.7);
    }

    .difference-mark.type-5 {
      background: linear-gradient(45deg, rgba(255,255,255,.8) 0 35%, rgba(82,57,38,.55) 35% 65%, rgba(255,255,255,.8) 65%);
    }

    .hidden-game-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0,1fr));
      gap: 8px;
    }

    .hidden-tile {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #e8ded2;
      padding: 0;
    }

    .hidden-tile img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
      opacity: .88;
    }

    .hidden-tile.decoy::after {
      content: "";
      position: absolute;
      inset: 9%;
      border: 1px dashed rgba(74,60,49,.22);
      border-radius: 50%;
    }

    .advisor-layout {
      display: grid;
      grid-template-columns: minmax(0,1fr) 360px;
      gap: 20px;
      align-items: start;
    }

    .advisor-chat {
      min-height: 480px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .advisor-messages {
      flex: 1;
      display: grid;
      align-content: start;
      gap: 10px;
      padding: 20px;
    }

    .chat-bubble {
      max-width: 84%;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .chat-bubble.user {
      justify-self: end;
      background: var(--dark);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .chat-bubble.ai {
      justify-self: start;
      background: #efe6dc;
      color: var(--ink);
      border-bottom-left-radius: 2px;
    }

    .advisor-input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 14px;
      border-top: 1px solid var(--line);
    }

    .advisor-suggestions {
      padding: 20px;
      border: 1px solid var(--line);
      background: var(--bg-soft);
    }

    .advisor-suggestions button {
      width: 100%;
      margin-top: 8px;
      text-align: left;
    }

    .admin-shell {
      width: min(1600px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 70px;
    }

    .admin-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 24px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .admin-head h1 {
      margin: 5px 0 0;
      font-family: var(--serif);
      font-size: 44px;
      font-weight: 400;
    }

    .admin-tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 7px;
      margin-bottom: 18px;
    }

    .admin-tab {
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      white-space: nowrap;
      font-size: 9px;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .admin-tab.active {
      border-color: var(--dark);
      background: var(--dark);
      color: #fff;
    }

    .admin-stats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 9px;
      margin-bottom: 18px;
    }

    .admin-stat {
      min-height: 98px;
      padding: 15px;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .admin-stat span {
      display: block;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .admin-stat strong {
      display: block;
      margin-top: 8px;
      font-size: 24px;
    }

    .admin-message {
      margin: 12px 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 12px;
    }

    .admin-message.ok {
      border-color: #b7d8c3;
      background: #eff8f2;
      color: #24583e;
    }

    .admin-message.error {
      border-color: #e0b7bb;
      background: #fff0f1;
      color: #852b35;
    }

    .admin-form {
      display: grid;
      gap: 12px;
    }

    .admin-form-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .admin-field {
      display: grid;
      gap: 6px;
    }

    .admin-field label {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .admin-field.span-2 {
      grid-column: span 2;
    }

    .admin-field.span-3 {
      grid-column: span 3;
    }

    .admin-field.span-4 {
      grid-column: span 4;
    }

    .admin-check-row {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .admin-check {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      font-size: 11px;
    }

    .admin-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .admin-table {
      width: 100%;
      min-width: 1480px;
      border-collapse: collapse;
    }

    .admin-table th,
    .admin-table td {
      padding: 9px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
      font-size: 10px;
    }

    .admin-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #eee4d8;
      color: var(--ink);
      font-size: 8px;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .admin-table input,
    .admin-table select,
    .admin-table textarea {
      min-width: 115px;
      width: 100%;
      padding: 8px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 10px;
    }

    .admin-table textarea {
      min-width: 180px;
      min-height: 70px;
      resize: vertical;
    }

    .admin-photo-list {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      max-width: 190px;
      margin-bottom: 7px;
    }

    .admin-photo {
      position: relative;
      width: 55px;
      height: 65px;
      overflow: hidden;
      background: #eee6dc;
      border: 1px solid var(--line);
    }

    .admin-photo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .admin-photo button {
      position: absolute;
      right: 2px;
      top: 2px;
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 50%;
      background: var(--danger);
      color: #fff;
      font-size: 11px;
    }

    .ai-fill-card {
      padding: 18px;
      border: 1px solid var(--accent-2);
      background: #f7efe5;
    }

    .ai-fill-card h3 {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 400;
    }

    .ai-fill-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 12px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .settings-card {
      padding: 18px;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .settings-card h3 {
      margin: 0 0 12px;
      font-family: var(--serif);
      font-size: 23px;
      font-weight: 400;
    }

    .empty-state {
      padding: 55px 20px;
      border: 1px dashed var(--line-strong);
      background: var(--paper);
      color: var(--muted);
      text-align: center;
    }

    .empty-state h3 {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      color: var(--ink);
    }

    .loading-state {
      padding: 70px 20px;
      text-align: center;
      color: var(--muted);
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 12px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast-stack {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 220;
      display: grid;
      gap: 8px;
      width: min(360px, calc(100vw - 36px));
    }

    .toast {
      padding: 13px 15px;
      border: 1px solid var(--line);
      background: var(--paper);
      box-shadow: var(--shadow-card);
      font-size: 11px;
      line-height: 1.5;
      animation: toastIn .2s ease both;
    }

    .toast.success {
      border-color: #b7d8c3;
    }

    .toast.error {
      border-color: #e0b7bb;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1180px) {
      .desktop-nav {
        gap: 15px;
      }

      .desktop-nav button:nth-child(5),
      .desktop-nav button:nth-child(6) {
        display: none;
      }

      .luxury-hero-grid {
        grid-template-columns: 1fr 1fr;
      }

      .hero-benefits {
        display: none;
      }

      .category-rail {
        overflow-x: auto;
        grid-template-columns: repeat(7, minmax(150px, 1fr));
      }

      .catalog-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .admin-stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .admin-form-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .admin-field.span-3,
      .admin-field.span-4 {
        grid-column: span 2;
      }
    }

    @media (max-width: 900px) {
      .header-inner {
        grid-template-columns: auto 1fr auto;
        height: 68px;
        padding: 0 14px;
      }

      .desktop-nav {
        display: none;
      }

      .mobile-menu-btn {
        display: inline-grid;
      }

      .brand {
        justify-self: center;
        font-size: 24px;
        letter-spacing: 5px;
      }

      .brand small {
        font-size: 7px;
      }

      .header-actions .search-trigger {
        display: none;
      }

      .luxury-hero,
      .luxury-hero-grid {
        min-height: auto;
      }

      .luxury-hero-grid {
        grid-template-columns: 1fr;
        padding: 50px 0 94px;
      }

      .hero-copy {
        max-width: 650px;
      }

      .hero-visual {
        min-height: 410px;
      }

      .hero-product-stage {
        width: min(430px, 92%);
      }

      .catalog-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .promo-grid {
        grid-template-columns: 1fr;
      }

      .service-strip {
        grid-template-columns: repeat(2, 1fr);
      }

      .service-item:nth-child(2) {
        border-right: 0;
      }

      .service-item:nth-child(-n+2) {
        border-bottom: 1px solid var(--line);
      }

      .footer-grid {
        grid-template-columns: 1.5fr 1fr 1fr;
      }

      .footer-grid > :nth-child(4),
      .footer-grid > :nth-child(5) {
        margin-top: 12px;
      }

      .detail-layout,
      .builder-layout,
      .advisor-layout,
      .seasonal-video-grid {
        grid-template-columns: 1fr;
      }

      .builder-panel.sticky {
        position: static;
      }

      .game-hub-grid {
        grid-template-columns: 1fr;
      }

      .settings-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      .container {
        width: min(100% - 28px, var(--max));
      }

      .topbar {
        font-size: 8px;
        letter-spacing: 1px;
      }

      .topbar-separator {
        display: none;
      }

      .topbar-secondary {
        display: none;
      }

      .brand {
        font-size: 19px;
        letter-spacing: 4px;
      }

      .header-actions {
        gap: 1px;
      }

      .lang-switch {
        min-height: 32px;
        padding: 0 8px;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
      }

      .section {
        padding: 42px 0;
      }

      .section-title-row {
        align-items: start;
        flex-direction: column;
      }

      .hero-copy h1 {
        font-size: 50px;
      }

      .hero-copy p {
        font-size: 13px;
      }

      .hero-visual {
        min-height: 340px;
      }

      .hero-product-stage {
        width: 90%;
      }

      .hero-collection-tabs {
        width: calc(100% - 28px);
      }

      .category-rail {
        grid-template-columns: repeat(7, minmax(130px, 1fr));
      }

      .category-tile {
        min-height: 112px;
      }

      .product-row-scroller {
        grid-auto-columns: minmax(180px, 72%);
      }

      .catalog-grid {
        gap: 8px;
      }

      .catalog-toolbar {
        grid-template-columns: 1fr;
      }

      .product-title {
        font-size: 15px;
      }

      .product-notes {
        font-size: 9px;
      }

      .promo-card {
        min-height: 390px;
        padding: 28px;
      }

      .promo-visual {
        width: 58%;
        opacity: .65;
      }

      .service-strip {
        grid-template-columns: 1fr;
      }

      .service-item,
      .service-item:nth-child(2) {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .footer-grid {
        grid-template-columns: 1fr 1fr;
      }

      .footer-grid > :first-child {
        grid-column: span 2;
      }

      .footer-bottom {
        flex-direction: column;
      }

      .detail-copy h1 {
        font-size: 44px;
      }

      .note-grid {
        grid-template-columns: 1fr;
      }

      .detail-info-row {
        grid-template-columns: 110px 1fr;
      }

      .differences-board {
        grid-template-columns: 1fr;
      }

      .hidden-game-grid {
        grid-template-columns: repeat(4, minmax(0,1fr));
      }

      .advisor-input-row {
        grid-template-columns: 1fr;
      }

      .admin-stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .admin-form-grid {
        grid-template-columns: 1fr;
      }

      .admin-field.span-2,
      .admin-field.span-3,
      .admin-field.span-4 {
        grid-column: span 1;
      }

      .ai-fill-grid {
        grid-template-columns: 1fr;
      }
    }

    /* =========================================================
       AROMALPARFUM — PROFESSIONAL POLISH PASS
       Mantiene la escala compacta elegida para que el contenido
       entre mejor en pantalla, pero refina jerarquía, contraste,
       tarjetas, estados, juegos, promo builders y responsive.
    ========================================================= */

    :root {
      --bg: #f5f0e9;
      --bg-soft: #fbf8f3;
      --paper: #fffdf9;
      --card: #fffaf4;
      --ink: #16120f;
      --ink-soft: #3b322b;
      --muted: #746a61;
      --muted-2: #9b9188;
      --line: #ddd2c6;
      --line-strong: #c9baaa;
      --accent: #9a7148;
      --accent-2: #c8a778;
      --accent-soft: #eadbc7;
      --dark: #12100e;
      --dark-2: #211b17;
      --success: #2d6b4e;
      --warning: #a16b28;
      --danger: #9f3540;
      --shadow-soft: 0 16px 44px rgba(36, 27, 20, .075);
      --shadow-card: 0 12px 30px rgba(35, 27, 20, .07);
      --shadow-luxury: 0 22px 60px rgba(31, 23, 17, .11);
    }

    html {
      background: var(--dark);
    }

    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      background: rgba(154, 113, 72, .22);
      color: var(--ink);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    button,
    a,
    input,
    select,
    textarea {
      transition:
        border-color .18s ease,
        background-color .18s ease,
        color .18s ease,
        opacity .18s ease,
        transform .18s ease,
        box-shadow .18s ease;
    }

    .site-header {
      box-shadow: 0 1px 0 rgba(30, 23, 18, .03);
    }

    .desktop-nav button {
      position: relative;
    }

    .desktop-nav button::after {
      content: "";
      position: absolute;
      left: 50%;
      right: 50%;
      bottom: 3px;
      height: 1px;
      background: currentColor;
      opacity: .62;
      transition: left .18s ease, right .18s ease;
    }

    .desktop-nav button:hover::after,
    .desktop-nav button:focus-visible::after {
      left: 0;
      right: 0;
    }

    .icon-btn:hover,
    .icon-btn:focus-visible {
      background: rgba(154, 113, 72, .08);
      transform: translateY(-1px);
    }

    .lang-switch:hover {
      border-color: var(--line-strong);
      background: var(--paper);
    }

    .luxury-hero {
      isolation: isolate;
      border-bottom: 1px solid rgba(72, 55, 40, .08);
    }

    .luxury-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255,255,255,.16), transparent 24%, transparent 78%, rgba(255,255,255,.08)),
        radial-gradient(circle at 50% 120%, rgba(90, 61, 36, .13), transparent 38%);
    }

    .hero-copy h1 {
      text-wrap: balance;
    }

    .hero-copy .btn {
      box-shadow: 0 10px 28px rgba(18, 16, 14, .12);
    }

    .hero-product-stage img {
      transform: translateZ(0);
      transition: transform .45s cubic-bezier(.2,.7,.2,1), filter .45s ease;
    }

    @media (hover:hover) and (pointer:fine) {
      .hero-product-stage:hover img {
        transform: translateY(-5px) scale(1.015);
        filter: drop-shadow(0 30px 30px rgba(48, 35, 24, .26));
      }
    }

    .hero-benefit {
      padding: 5px 0;
    }

    .hero-benefit-icon {
      background: rgba(255, 253, 249, .28);
      backdrop-filter: blur(8px);
    }

    .hero-collection-tabs {
      scrollbar-width: thin;
      scrollbar-color: rgba(97, 78, 61, .35) transparent;
    }

    .hero-collection-tabs::-webkit-scrollbar,
    .product-row-scroller::-webkit-scrollbar {
      height: 4px;
    }

    .hero-collection-tabs::-webkit-scrollbar-track,
    .product-row-scroller::-webkit-scrollbar-track {
      background: transparent;
    }

    .hero-collection-tabs::-webkit-scrollbar-thumb,
    .product-row-scroller::-webkit-scrollbar-thumb {
      background: rgba(76, 59, 45, .28);
      border-radius: 20px;
    }

    .category-tile {
      position: relative;
    }

    .category-tile::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid transparent;
      pointer-events: none;
      transition: border-color .18s ease;
    }

    .category-tile:hover::after,
    .category-tile:focus-visible::after {
      border-color: rgba(154, 113, 72, .18);
    }

    .category-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(63, 48, 37, .14);
      border-radius: 50%;
      background: rgba(255,255,255,.36);
      filter: saturate(.72);
    }

    .section-title {
      letter-spacing: -.025em;
      text-wrap: balance;
    }

    .section-subtitle {
      text-wrap: pretty;
    }

    .product-row-scroller {
      grid-auto-columns: minmax(190px, calc((100% - 48px) / 5));
      scrollbar-width: thin;
      scrollbar-color: rgba(74, 59, 47, .28) transparent;
      padding-bottom: 10px;
    }

    .product-card {
      position: relative;
      box-shadow: 0 0 0 rgba(0,0,0,0);
      transition:
        transform .24s cubic-bezier(.2,.7,.2,1),
        box-shadow .24s ease,
        border-color .24s ease;
    }

    @media (hover:hover) and (pointer:fine) {
      .product-card:hover {
        transform: translateY(-4px);
        border-color: var(--line-strong);
        box-shadow: var(--shadow-card);
      }
    }

    .product-media::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
    }

    .product-media img {
      filter: drop-shadow(0 10px 12px rgba(45, 33, 24, .08));
    }

    .product-title {
      text-wrap: balance;
    }

    .badge {
      box-shadow: 0 5px 14px rgba(18,16,14,.12);
      backdrop-filter: blur(8px);
    }

    .fav-mini {
      backdrop-filter: blur(10px);
    }

    .add-circle:hover:not(:disabled),
    .add-circle:focus-visible:not(:disabled) {
      background: var(--accent);
      transform: scale(1.05);
    }

    /* Promo builders — texto e imagen nunca se pisan */
    .promo-card {
      justify-content: stretch;
      box-shadow: 0 0 0 rgba(0,0,0,0);
      transition: transform .24s ease, box-shadow .24s ease;
    }

    @media (hover:hover) and (pointer:fine) {
      .promo-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-luxury);
      }
    }

    .promo-content {
      position: relative;
      z-index: 4;
      width: 54%;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .promo-card h3 {
      max-width: none;
      font-size: clamp(34px, 3.4vw, 52px);
      line-height: 1;
      letter-spacing: -.025em;
      text-wrap: balance;
    }

    .promo-card p:not(.eyebrow) {
      max-width: 390px;
      text-wrap: pretty;
    }

    .promo-visual {
      right: 0;
      top: 0;
      width: 48%;
      height: 100%;
      padding: 22px 18px;
      opacity: .96;
    }

    .promo-visual::before {
      content: "";
      position: absolute;
      width: 72%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      filter: blur(2px);
    }

    .promo-visual img {
      position: relative;
      z-index: 1;
      object-fit: contain;
      max-height: 92%;
    }

    .promo-card.dark .promo-visual {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.025));
    }

    .promo-card.light .promo-visual {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.14));
    }

    /* Advisor teaser */
    .advisor-teaser-pro {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(220px, .55fr) auto;
      gap: 28px;
      align-items: center;
      padding: 34px 36px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 82% 25%, rgba(205, 174, 132, .26), transparent 22%),
        linear-gradient(110deg, var(--paper), #f4eadf);
    }

    .advisor-teaser-copy {
      min-width: 0;
    }

    .advisor-teaser-copy h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(31px, 3vw, 43px);
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: -.02em;
    }

    .advisor-teaser-visual {
      min-height: 92px;
      display: grid;
      place-items: center;
      border-left: 1px solid rgba(111, 84, 60, .14);
      border-right: 1px solid rgba(111, 84, 60, .14);
    }

    .advisor-orbit {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      position: relative;
      border: 1px solid rgba(62, 47, 35, .22);
      border-radius: 50%;
      font-family: var(--serif);
      font-size: 28px;
    }

    .advisor-orbit::before,
    .advisor-orbit::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(62, 47, 35, .12);
      border-radius: 50%;
    }

    .advisor-orbit::before {
      inset: -8px;
    }

    .advisor-orbit::after {
      inset: 12px;
    }

    .advisor-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .advisor-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
    }

    .advisor-status.offline .advisor-status-dot {
      background: var(--muted-2);
    }

    /* Aroma Games — presentación premium */
    .game-hub-grid {
      gap: 16px;
    }

    .game-card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 360px;
      padding: 30px;
      justify-content: flex-end;
      border-color: rgba(71, 55, 42, .15);
      box-shadow: 0 0 0 rgba(0,0,0,0);
      transition: transform .24s ease, box-shadow .24s ease, border-color .24s ease;
    }

    .game-card::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(15,12,10,.08)),
        radial-gradient(circle at 80% 15%, rgba(255,255,255,.36), transparent 23%);
    }

    .game-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 210px;
      height: 210px;
      right: -95px;
      top: -90px;
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 50%;
    }

    @media (hover:hover) and (pointer:fine) {
      .game-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-luxury);
        border-color: rgba(71,55,42,.24);
      }
    }

    .game-card-number {
      position: absolute;
      top: 26px;
      right: 28px;
      font-family: var(--serif);
      font-size: 58px;
      line-height: 1;
      color: rgba(24, 19, 15, .14);
    }

    .game-card-kicker {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      margin-bottom: auto;
      padding: 7px 10px;
      border: 1px solid rgba(45, 35, 27, .16);
      background: rgba(255,255,255,.22);
      font-size: 8px;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }

    .game-card h3 {
      max-width: 360px;
      font-size: clamp(28px, 3vw, 38px);
      letter-spacing: -.02em;
      text-wrap: balance;
    }

    .game-card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 0 0 18px;
    }

    .game-meta-pill {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border: 1px solid rgba(46, 35, 27, .15);
      background: rgba(255,255,255,.20);
      font-size: 8px;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .game-instruction-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: 0 0 18px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .game-instruction-card strong {
      color: var(--ink);
      font-size: 9px;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    /* Encontrá las diferencias — versión difícil y sutil */
    .differences-board {
      gap: 12px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .difference-image {
      border-color: var(--line-strong);
      background: #eee6dc;
      box-shadow: 0 10px 28px rgba(41, 31, 24, .055);
      user-select: none;
    }

    .difference-image img {
      pointer-events: none;
      user-select: none;
    }

    .difference-mark {
      width: var(--diff-size, 5.2%);
      height: var(--diff-size, 5.2%);
      opacity: var(--diff-opacity, .2);
      transform: rotate(var(--diff-rotation, 0deg));
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: normal;
      box-shadow: none;
    }

    .difference-mark.type-1 {
      background: rgba(42, 31, 24, .68);
      filter: blur(4px);
      mix-blend-mode: multiply;
    }

    .difference-mark.type-2 {
      background: rgba(255,255,255,.78);
      filter: blur(5px);
      mix-blend-mode: screen;
    }

    .difference-mark.type-3 {
      background: linear-gradient(110deg, transparent 10%, rgba(177,134,89,.76) 45%, transparent 78%);
      border-radius: 40% 60% 46% 54%;
      filter: blur(1.4px);
      mix-blend-mode: color-burn;
    }

    .difference-mark.type-4 {
      background: rgba(125, 111, 96, .55);
      filter: grayscale(1) blur(2px);
      mix-blend-mode: saturation;
    }

    .difference-mark.type-5 {
      background: radial-gradient(circle at 40% 38%, rgba(255,255,255,.85), rgba(255,255,255,.12) 50%, transparent 70%);
      filter: blur(2.2px);
      mix-blend-mode: soft-light;
    }

    .difference-mark.type-6 {
      background: rgba(85, 117, 99, .48);
      filter: blur(3px) hue-rotate(18deg);
      mix-blend-mode: color;
    }

    .difference-mark.type-7 {
      width: calc(var(--diff-size, 5.2%) * .26);
      border-radius: 999px;
      background: rgba(34, 25, 20, .72);
      filter: blur(.7px);
      mix-blend-mode: multiply;
    }

    .difference-mark.type-8 {
      background: transparent;
      border: 1px solid rgba(255,255,255,.50);
      box-shadow: inset 0 0 7px rgba(255,255,255,.45), 0 0 5px rgba(44,32,24,.12);
      filter: blur(.3px);
    }

    .difference-zone {
      width: var(--hit-size, 10%);
      height: var(--hit-size, 10%);
      background: transparent !important;
      border: 0 !important;
      outline: none;
      cursor: crosshair;
    }

    .difference-zone.found {
      border: 2px solid var(--success) !important;
      background: rgba(255,255,255,.10) !important;
      box-shadow: 0 0 0 3px rgba(45,107,78,.12);
    }

    .difference-zone.found::after {
      content: "✓";
      position: absolute;
      right: -2px;
      top: -2px;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--success);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }

    .game-topbar {
      padding: 11px 13px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .game-status span {
      min-height: 29px;
      display: inline-flex;
      align-items: center;
      padding: 0 9px;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .puzzle-board {
      box-shadow: var(--shadow-card);
    }

    .hidden-tile {
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    @media (hover:hover) and (pointer:fine) {
      .hidden-tile:hover {
        transform: translateY(-2px);
        border-color: var(--line-strong);
        box-shadow: var(--shadow-card);
      }
    }


    /* Aroma Games — jugador, ranking diario y premios */
    .game-player-card,
    .game-ranking-card,
    .game-reward-card {
      border: 1px solid var(--line);
      background: var(--paper);
      padding: 20px;
    }

    .game-ranking-layout {
      display: grid;
      grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr);
      gap: 16px;
      margin: 0 0 22px;
    }

    .game-player-card h3,
    .game-ranking-card h3,
    .game-reward-card h3 {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 400;
    }

    .game-player-card p,
    .game-ranking-card p,
    .game-reward-card p {
      margin: 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.65;
    }

    .game-player-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 9px;
      margin-top: 14px;
      align-items: end;
    }

    .game-player-current {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--bg);
    }

    .game-player-current strong {
      display: block;
      font-size: 12px;
    }

    .game-player-current small {
      color: var(--muted);
      font-size: 9px;
    }

    .game-ranking-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 10px;
    }

    .game-ranking-table th,
    .game-ranking-table td {
      padding: 9px 7px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .game-ranking-table th {
      color: var(--muted);
      font-size: 8px;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .game-ranking-table td:nth-child(1) {
      width: 46px;
      font-family: var(--serif);
      font-size: 16px;
    }

    .game-ranking-table td:nth-child(3),
    .game-ranking-table td:nth-child(4),
    .game-ranking-table th:nth-child(3),
    .game-ranking-table th:nth-child(4) {
      text-align: right;
    }

    .game-ranking-prize {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      background: #f5eee3;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .game-score-earned {
      margin: 12px 0 0;
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--bg);
      text-align: center;
    }

    .game-score-earned strong {
      display: block;
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 400;
    }

    .game-score-earned span {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .game-admin-rewards {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .game-admin-reward {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--bg);
    }

    .game-admin-reward-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }

    .checkout-discount-ok {
      margin-top: 9px;
      padding: 9px 10px;
      border: 1px solid rgba(57, 112, 72, .25);
      background: rgba(57, 112, 72, .07);
      color: var(--success);
      font-size: 10px;
    }

    @media (max-width: 760px) {
      .game-ranking-layout {
        grid-template-columns: 1fr;
      }

      .game-player-form {
        grid-template-columns: 1fr;
      }

      .game-admin-reward {
        grid-template-columns: 1fr;
      }

      .game-admin-reward-actions {
        justify-content: flex-start;
      }
    }

    /* Forms, checkout y admin */
    .text-input,
    .number-input,
    .select-input,
    .textarea-input,
    .search-input,
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="text"],
    input[type="number"],
    select,
    textarea {
      border-color: var(--line);
    }

    .text-input:focus,
    .number-input:focus,
    .select-input:focus,
    .textarea-input:focus,
    .search-input:focus,
    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(154, 113, 72, .08);
    }

    .admin-wrap,
    .admin-table-wrap,
    .checkout-card,
    .builder-panel,
    .builder-summary {
      box-shadow: 0 8px 26px rgba(38, 29, 22, .035);
    }

    .footer {
      border-top: 1px solid #29231f;
    }

    .social-btn {
      position: relative;
      overflow: hidden;
    }

    .social-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .social-btn:hover {
      background: #fff;
      color: var(--dark);
      transform: translateY(-2px);
    }

    /* Responsive polish */
    @media (max-width: 1180px) {
      .product-row-scroller {
        grid-auto-columns: minmax(185px, calc((100% - 36px) / 4));
      }

      .advisor-teaser-pro {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .advisor-teaser-visual {
        display: none;
      }
    }

    @media (max-width: 820px) {
      .promo-content {
        width: 62%;
      }

      .promo-visual {
        width: 44%;
        opacity: .76;
      }

      .product-row-scroller {
        grid-auto-columns: minmax(180px, 48%);
      }

      .differences-board {
        grid-template-columns: 1fr;
      }

      .advisor-teaser-pro {
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 28px;
      }
    }

    @media (max-width: 620px) {
      .promo-card {
        min-height: 390px;
        padding: 28px;
      }

      .promo-content {
        width: 100%;
        max-width: 100%;
        padding-top: 150px;
      }

      .promo-visual {
        top: 14px;
        right: 16px;
        width: 48%;
        height: 48%;
        padding: 4px;
        opacity: .52;
      }

      .promo-card h3 {
        max-width: 100%;
        font-size: 34px;
      }

      .game-card {
        min-height: 320px;
        padding: 25px;
      }

      .game-card-number {
        font-size: 46px;
      }

      .product-row-scroller {
        grid-auto-columns: minmax(165px, 74%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;

function safeJsonParse(
  raw,
  fallback
)
{
  try
  {
    if (
      raw === null ||
      raw === undefined ||
      raw === ""
    )
    {
      return fallback;
    }

    return JSON.parse(
      raw
    );
  }
  catch (
    error
  )
  {
    console.warn(
      "JSON inválido:",
      error
    );

    return fallback;
  }
}

function normalizeStoredCart(
  rawCart
)
{
  if (
    !Array.isArray(
      rawCart
    )
  )
  {
    return [];
  }

  return rawCart
    .map(
      (
        item
      ) =>
      {
        if (
          !item ||
          typeof item !== "object"
        )
        {
          return null;
        }

        if (
          item.kind
        )
        {
          return {
            ...item,
            qty:
            Math.max(
              1,
              Number(
                item.qty
              ) ||
              1
            ),
          };
        }

        if (
          item.id !== undefined
        )
        {
          return {
            kind:
            "product",

            key:
            "product:" +
            item.id,

            id:
            Number(
              item.id
            ),

            productId:
            Number(
              item.id
            ),

            qty:
            Math.max(
              1,
              Number(
                item.qty
              ) ||
              1
            ),
          };
        }

        return null;
      }
    )
    .filter(
      Boolean
    );
}

function isNewProduct(
  product
)
{
  if (
    !product
  )
  {
    return false;
  }

  if (
    !product.nuevo
  )
  {
    return false;
  }

  if (
    product.new_until
  )
  {
    const until =
    new Date(
      product.new_until
    );

    return (
      !Number.isNaN(
        until.getTime()
      )
      &&
      until.getTime() >
      Date.now()
    );
  }

  if (
    product.created_at
  )
  {
    const created =
    new Date(
      product.created_at
    );

    if (
      !Number.isNaN(
        created.getTime()
      )
    )
    {
      const diff =
      Date.now() -
      created.getTime();

      return (
        diff >= 0 &&
        diff <=
        (
          CONFIG.newDays *
          24 *
          60 *
          60 *
          1000
        )
      );
    }
  }

  return Boolean(
    product.nuevo
  );
}

function arrayFromDb(
  value
)
{
  if (
    Array.isArray(
      value
    )
  )
  {
    return value
      .map(
        item =>
        String(
          item
        ).trim()
      )
      .filter(
        Boolean
      );
  }

  if (
    typeof value === "string"
  )
  {
    const trimmed =
    value.trim();

    if (
      trimmed === ""
    )
    {
      return [];
    }

    if (
      trimmed.startsWith(
        "["
      )
    )
    {
      const parsed =
      safeJsonParse(
        trimmed,
        null
      );

      if (
        Array.isArray(
          parsed
        )
      )
      {
        return parsed
          .map(
            item =>
            String(
              item
            ).trim()
          )
          .filter(
            Boolean
          );
      }
    }

    return trimmed
      .split(
        ","
      )
      .map(
        item =>
        item.trim()
      )
      .filter(
        Boolean
      );
  }

  return [];
}
