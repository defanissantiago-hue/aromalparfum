<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AromaLParfum — perfumes, fragancias y decants.">
<title>AromaLParfum | Perfumería</title>
<style>
:root{--bg:#f7f5f1;--card:#fff;--ink:#171717;--muted:#777;--line:#e8e3db;--accent:#b48a45;--dark:#111}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:#111;color:#fff;text-align:center;padding:8px;font-size:12px;letter-spacing:1px}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{max-width:1200px;margin:auto;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-family:Georgia,serif;font-size:26px;letter-spacing:2px}.brand small{display:block;font:9px Arial;letter-spacing:4px;text-align:center;color:var(--accent)}
.nav-actions{display:flex;gap:8px}.icon-btn{border:0;background:transparent;font-size:22px;padding:10px;position:relative}.count{position:absolute;right:2px;top:2px;background:var(--accent);color:#fff;border-radius:50%;font-size:10px;width:18px;height:18px;display:grid;place-items:center}
.hero{min-height:520px;display:grid;place-items:center;text-align:center;padding:70px 20px;background:linear-gradient(110deg,#181818,#3a3329);color:#fff;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 35%,rgba(180,138,69,.35),transparent 35%)}.hero>*{position:relative}.eyebrow{text-transform:uppercase;letter-spacing:4px;color:#d9b878;font-size:12px}.hero h1{font:clamp(48px,9vw,92px) Georgia,serif;margin:14px 0}.hero p{max-width:600px;margin:0 auto 30px;color:#ddd;line-height:1.7}.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:13px 20px;border-radius:2px;text-transform:uppercase;letter-spacing:1px;font-size:12px}.btn.gold{background:var(--accent);border-color:var(--accent)}.btn.light{background:#fff;color:#111;border-color:#fff}
section{max-width:1200px;margin:auto;padding:65px 18px}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}.section-head h2{font:36px Georgia,serif;margin:0}.muted{color:var(--muted);font-size:14px}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cat{padding:28px 20px;background:#181818;color:#fff;border:0;text-align:left;min-height:120px}.cat strong{display:block;font:23px Georgia,serif;margin-bottom:10px}.cat span{color:#bbb;font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0 25px}.search{flex:1;min-width:220px;padding:13px 15px;border:1px solid var(--line);background:#fff}.select{padding:13px;border:1px solid var(--line);background:#fff}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:99px}.chip.active{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.product{background:#fff;border:1px solid var(--line);position:relative;overflow:hidden}.pic{aspect-ratio:1/1;background:linear-gradient(135deg,#eee,#ddd);display:grid;place-items:center;position:relative}.pic img{width:100%;height:100%;object-fit:contain}.placeholder{font:24px Georgia,serif;color:#aaa;text-align:center;padding:20px}.heart{position:absolute;right:10px;top:10px;border:0;background:#fff;width:36px;height:36px;border-radius:50%;font-size:19px;box-shadow:0 3px 15px #0001}.heart.active{color:#b21f32}.info{padding:15px}.brandline{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px}.product h3{font:20px Georgia,serif;margin:7px 0}.meta{font-size:12px;color:#777}.price{font-weight:bold;font-size:18px;margin:12px 0}.stock{font-size:11px;color:#4c7a54}.product .btn{width:100%;margin-top:5px}
.banner{background:#171717;color:#fff;max-width:none}.banner-inner{max-width:1200px;margin:auto;padding:60px 18px;text-align:center}.banner h2{font:40px Georgia,serif;margin:8px}.banner p{color:#bbb}
footer{background:#111;color:#fff;padding:50px 18px}.footer-inner{max-width:1200px;margin:auto;display:grid;grid-template-columns:2fr 1fr 1fr;gap:35px}.footer p,.footer a{color:#aaa;font-size:13px;line-height:1.8}.footer a{display:block;text-decoration:none}
.drawer,.modal{position:fixed;inset:0;z-index:100;display:none}.drawer.open,.modal.open{display:block}.shade{position:absolute;inset:0;background:#0008}.panel{position:absolute;background:#fff;height:100%;width:min(380px,90vw);padding:25px;overflow:auto}.drawer .panel{left:0}.cart .panel{right:0;width:min(460px,94vw)}.close{border:0;background:transparent;font-size:26px;float:right}.menu-links{margin-top:50px}.menu-links button{display:block;width:100%;padding:15px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:15px}.submenu{padding-left:15px;display:none}.submenu.open{display:block}.cart-item{display:grid;grid-template-columns:60px 1fr auto;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.cart-thumb{width:60px;height:60px;background:#eee;display:grid;place-items:center;font-size:9px;text-align:center}.qty{display:flex;align-items:center;gap:7px}.qty button{border:1px solid var(--line);background:#fff;width:28px;height:28px}.cart-total{border-top:1px solid var(--line);margin-top:20px;padding-top:20px;font-size:20px;font-weight:bold}
.detail{max-width:1100px;margin:auto;padding:40px 18px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:45px}.gallery-main{aspect-ratio:1;background:#eee;display:grid;place-items:center}.gallery-main img{width:100%;height:100%;object-fit:contain}.thumbs{display:flex;gap:8px;margin-top:10px}.thumb{width:75px;height:75px;background:#eee;border:1px solid var(--line)}.detail h1{font:48px Georgia,serif;margin:8px 0 15px}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}.note{border:1px solid var(--line);padding:15px;background:#fff}.note b{display:block;font-size:11px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}.info-list{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.info-list div{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.info-list b{display:block;color:#777;font-size:10px;text-transform:uppercase;margin-bottom:4px}
.form{display:grid;gap:12px}.form input,.form textarea,.form select{padding:13px;border:1px solid var(--line);background:#fff}.form textarea{min-height:110px}
.admin{max-width:1200px;margin:auto;padding:35px 18px}.admin table{width:100%;border-collapse:collapse;background:#fff}.admin th,.admin td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.admin input,
.admin textarea{
    width:180px;
    min-width:180px;
    padding:8px;
    border:1px solid var(--line);
    background:#fff;
    color:#171717;
}

.admin textarea{
    min-height:80px;
    resize:vertical;
}

.admin table{
    min-width:1500px;
}

.admin th,
.admin td{
    vertical-align:top;
}.hidden{display:none!important}.empty{text-align:center;padding:60px 20px;color:#777}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:1fr}.footer-inner{grid-template-columns:1fr}.detail h1{font-size:38px}}
@media(max-width:480px){.nav{height:62px}.brand{font-size:21px}.grid{gap:9px}.product h3{font-size:16px}.info{padding:10px}.hero{min-height:450px}.cats{grid-template-columns:1fr 1fr}.notes{grid-template-columns:1fr}.section-head h2{font-size:29px}}
</style>
</head>
<body>
<div class="top">ENVÍOS Y PEDIDOS — CONSULTÁ POR WHATSAPP</div>
<header><nav class="nav">
<button class="icon-btn" onclick="openMenu()" aria-label="Menú">☰</button>
<div class="brand">AromaLParfum<small>PERFUMERÍA</small></div>
<div class="nav-actions"><button class="icon-btn" onclick="showFavorites()">♡<span class="count" id="favCount">0</span></button><button class="icon-btn" onclick="openCart()">🛒<span class="count" id="cartCount">0</span></button></div>
</nav></header>

<main id="app"></main>

<div class="drawer" id="menu"><div class="shade" onclick="closeMenu()"></div><aside class="panel"><button class="close" onclick="closeMenu()">×</button><div class="menu-links">
<button onclick="goHome()">INICIO</button>
<button onclick="toggleSub()">PERFUMES　⌄</button>
<div class="submenu" id="submenu">
<button onclick="catalog('Todos')">Todos los perfumes</button><button onclick="catalog('Hombre')">Perfumes de hombre</button><button onclick="catalog('Mujer')">Perfumes de mujer</button><button onclick="catalog('Árabe')">Perfumería árabe</button><button onclick="catalog('Argentina')">Perfumería argentina</button><button onclick="catalog('Nicho')">Perfumería de nicho</button><button onclick="catalog('Diseñador')">Perfumería de diseñador</button></div>
<button onclick="showFavorites()">FAVORITOS</button><button onclick="showContact()">CONTACTO</button><button onclick="showAbout()">ACERCA DE</button><button onclick="showAdmin()">ADMINISTRACIÓN</button>
</div></aside></div>

<div class="drawer cart" id="cart"><div class="shade" onclick="closeCart()"></div><aside class="panel"><button class="close" onclick="closeCart()">×</button><h2>Tu carrito</h2><div id="cartItems"></div><div id="cartTotal"></div><button class="btn gold" style="width:100%;margin-top:20px" onclick="checkout()">FINALIZAR PEDIDO</button></aside></div>

<div class="modal" id="modal"><div class="shade" onclick="closeModal()"></div><div class="panel" style="left:50%;top:50%;transform:translate(-50%,-50%);height:auto;max-height:90vh;width:min(700px,94vw);border-radius:4px"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
   const SUPABASE_URL = "https://klppiznssciyveufmoff.supabase.co";
const SUPABASE_KEY = "sb_publishable_lMSak0Ze-NYWwq3SCpqEaA_7UrVFU3T";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
   
async function probarSupabase() {
  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .limit(1);

  if (error) {
    console.error("Error de Supabase:", error);
  } else {
    console.log("Supabase conectado correctamente:", data);
  }
}

probarSupabase();
let products = [];

let cart=JSON.parse(localStorage.getItem("alp_cart")||"[]"), fav=JSON.parse(localStorage.getItem("alp_fav")||"[]"), filter="Todos", sort="default", search="";

async function cargarProductos() {
    const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .order("id", { ascending: true });

    if (error) {
        console.error("Error cargando productos:", error);
        alert("No se pudieron cargar los perfumes.");
        return;
    }

   products = data.map(p => ({
    id: p.id,
    nombre: p.nombre,
    precio: Number(p.precio || 0),
    ml: Number(p.ml || 0),
    categoria: p.categoria || "Otros",
    genero: p.genero || "Unisex",
    stock: Number(p.stock || 0),
    img: p.imagen_url || "",
    descripcion: p.descripcion || "Fragancia seleccionada de AromaLParfum.",
    salida: p.salida || "Consultar",
    corazon: p.corazon || "Consultar",
    fondo: p.fondo || "Consultar",
    familia: p.familia || "Fragancia",
    destacado: p.destacado || false,
    nuevo: p.nuevo || false,
    vendido: p.vendido || false
}));

    console.log("Productos cargados:", products);

    render();
}

const money=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n);
function save(){localStorage.setItem("alp_cart",JSON.stringify(cart));localStorage.setItem("alp_fav",JSON.stringify(fav));updateCounts()}
function updateCounts(){document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.qty,0);document.getElementById("favCount").textContent=fav.length}
function card(p){return `<article class="product"><div class="pic">${p.img?`<img src="${p.img}" alt="${p.nombre}">`:`<div class="placeholder">${p.nombre}<br><small>${p.ml} ml</small></div>`}<button class="heart ${fav.includes(p.id)?"active":""}" onclick="toggleFav(${p.id})">${fav.includes(p.id)?"♥":"♡"}</button></div><div class="info"><div class="brandline">${p.categoria} · ${p.genero}</div><h3>${p.nombre}</h3><div class="meta">${p.ml} ml</div><div class="price">${money(p.precio)}</div><div class="stock">● Disponible</div><button class="btn" onclick="productDetail(${p.id})">VER PERFUME</button></div></article>`}
function renderCatalog(){let a=products.filter(p=>(filter==="Todos"||p.categoria===filter||p.genero===filter)&&(!search||p.nombre.toLowerCase().includes(search.toLowerCase())));if(sort==="low")a.sort((x,y)=>x.precio-y.precio);if(sort==="high")a.sort((x,y)=>y.precio-x.precio);if(sort==="name")a.sort((x,y)=>x.nombre.localeCompare(y.nombre));return `<section><div class="section-head"><div><div class="eyebrow">Colección</div><h2>Perfumes</h2></div><span class="muted">${a.length} productos</span></div><div class="chips">${["Todos","Hombre","Mujer","Árabe","Argentina","Nicho","Diseñador"].map(x=>`<button class="chip ${filter===x?"active":""}" onclick="catalog('${x}')">${x}</button>`).join("")}</div><div class="toolbar"><input class="search" placeholder="Buscar por perfume o marca..." value="${search}" oninput="search=this.value;render()"><select class="select" onchange="sort=this.value;render()"><option value="default">Ordenar</option><option value="low">Precio menor a mayor</option><option value="high">Precio mayor a menor</option><option value="name">Nombre A-Z</option></select></div><div class="grid">${a.length?a.map(card).join(""):`<div class="empty" style="grid-column:1/-1">No encontramos perfumes con esa búsqueda.</div>`}</div></section>`}
function home(){let featured=products.filter(p=>p.destacado).slice(0,8);return `<div class="hero"><div><div class="eyebrow">AromaLParfum</div><h1>Encontrá tu<br>próxima fragancia.</h1><p>Descubrí perfumes árabes, argentinos, de diseñador y de nicho seleccionados para distintos estilos y momentos.</p><button class="btn light" onclick="catalog('Todos')">VER PERFUMES</button></div></div><section><div class="section-head"><div><div class="eyebrow">Explorá</div><h2>Categorías</h2></div></div><div class="cats"><button class="cat" onclick="catalog('Hombre')"><strong>Hombre</strong><span>Fragancias masculinas</span></button><button class="cat" onclick="catalog('Mujer')"><strong>Mujer</strong><span>Fragancias femeninas</span></button><button class="cat" onclick="catalog('Árabe')"><strong>Árabes</strong><span>Intensas y envolventes</span></button><button class="cat" onclick="catalog('Nicho')"><strong>Nicho</strong><span>Composiciones especiales</span></button></div></section><section><div class="section-head"><div><div class="eyebrow">Selección</div><h2>Destacados</h2></div><button class="btn" onclick="catalog('Todos')">VER TODO</button></div><div class="grid">${featured.map(card).join("")}</div></section><div class="banner"><div class="banner-inner"><div class="eyebrow">Tu identidad, tu aroma</div><h2>Un perfume es más que una fragancia.</h2><p>Es una forma de expresión, un recuerdo y una parte de tu identidad.</p><button class="btn gold" onclick="showAbout()">CONOCÉ AROMALPARFUM</button></div></div>`}
function render(){document.getElementById("app").innerHTML=home()}function catalog(x="Todos"){filter=x;search="";closeMenu();document.getElementById("app").innerHTML=renderCatalog();window.scrollTo(0,0)}
function productDetail(id){let p=products.find(x=>x.id===id);document.getElementById("app").innerHTML=`<div class="detail"><button class="btn" onclick="catalog(filter)">← VOLVER</button><div class="detail-grid" style="margin-top:25px"><div><div class="gallery-main">${p.img?`<img src="${p.img}" alt="${p.nombre}">`:`<div class="placeholder">${p.nombre}<br>${p.ml} ml</div>`}</div><div class="thumbs"><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div></div></div><div><div class="eyebrow">${p.categoria} · ${p.genero}</div><h1>${p.nombre}</h1><div class="price" style="font-size:28px">${money(p.precio)}</div><p class="muted">${p.ml} ml · ● Disponible</p><p style="line-height:1.7">${p.descripcion}</p><button class="btn gold" onclick="addCart(${p.id})">AGREGAR AL CARRITO</button><button class="btn" style="margin-left:8px" onclick="toggleFav(${p.id});productDetail(${p.id})">${fav.includes(p.id)?"♥ EN FAVORITOS":"♡ FAVORITOS"}</button><div class="notes"><div class="note"><b>Salida</b>${p.salida}</div><div class="note"><b>Corazón</b>${p.corazon}</div><div class="note"><b>Fondo</b>${p.fondo}</div></div><div class="info-list"><div><b>Familia olfativa</b>${p.familia}</div><div><b>Tamaño</b>${p.ml} ml</div><div><b>Duración</b>Consultar</div><div><b>Proyección</b>Consultar</div><div><b>Uso</b>Diario / salidas / ocasiones especiales</div><div><b>¿Dónde usarlo?</b>Espacios cerrados, salidas y eventos</div></div></div></div></div>`;window.scrollTo(0,0)}
function toggleFav(id){fav.includes(id)?fav=fav.filter(x=>x!==id):fav.push(id);save();if(document.getElementById("app").innerHTML.includes("Destacados"))render();else catalog(filter)}
function showFavorites(){closeMenu();let a=products.filter(p=>fav.includes(p.id));document.getElementById("app").innerHTML=`<section><div class="eyebrow">Guardados</div><h2>Favoritos</h2>${a.length?`<div class="grid">${a.map(card).join("")}</div>`:`<div class="empty"><h3>Todavía no tienes perfumes favoritos.</h3><button class="btn" onclick="catalog('Todos')">DESCUBRIR PERFUMES</button></div>`}</section>`}
function addCart(id){let x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id,qty:1});save();openCart()}
function openCart(){document.getElementById("cart").classList.add("open");renderCart()}function closeCart(){document.getElementById("cart").classList.remove("open")}
function renderCart(){let box=document.getElementById("cartItems");if(!cart.length){box.innerHTML='<div class="empty">Tu carrito está vacío.</div>';document.getElementById("cartTotal").innerHTML="";return}let total=0;box.innerHTML=cart.map(x=>{let p=products.find(p=>p.id===x.id),sub=p.precio*x.qty;total+=sub;return `<div class="cart-item"><div class="cart-thumb">${p.nombre}</div><div><b>${p.nombre}</b><div class="muted">${money(p.precio)}</div><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button>${x.qty}<button onclick="changeQty(${p.id},1)">+</button><button onclick="removeCart(${p.id})" style="border:0;background:none">🗑</button></div></div><b>${money(sub)}</b></div>`}).join("");document.getElementById("cartTotal").innerHTML=`<div class="cart-total">Total: ${money(total)}</div>`}
function changeQty(id,n){let x=cart.find(x=>x.id===id);x.qty+=n;if(x.qty<=0)cart=cart.filter(y=>y.id!==id);save();renderCart()}function removeCart(id){cart=cart.filter(x=>x.id!==id);save();renderCart()}
function checkout(){if(!cart.length)return;let total=cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).precio*x.qty,0);document.getElementById("modalBody").innerHTML=`<h2>Finalizar pedido</h2><p class="muted">Completá tus datos y te prepararemos el pedido.</p><div class="form"><input id="cname" placeholder="Nombre y apellido"><input id="ctel" placeholder="Teléfono"><input id="cemail" placeholder="Email"><input id="caddress" placeholder="Dirección"><input id="ccity" placeholder="Ciudad"><input id="cprov" placeholder="Provincia"><input id="cp" placeholder="Código postal"><button class="btn gold" onclick="sendOrder()">ENVIAR PEDIDO POR WHATSAPP · ${money(total)}</button></div>`;document.getElementById("modal").classList.add("open")}
function sendOrder(){let name=document.getElementById("cname").value||"Cliente";let lines=cart.map(x=>{let p=products.find(p=>p.id===x.id);return `• ${p.nombre} (${p.ml} ml) x${x.qty} — ${money(p.precio*x.qty)}`}).join("%0A");let total=cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).precio*x.qty,0);let msg=`Hola, soy ${name}. Quiero hacer este pedido:%0A${lines}%0A%0ATotal: ${money(total)}`;window.open("https://wa.me/5491144293913?text="+msg,"_blank")}
function showContact(){closeMenu();document.getElementById("app").innerHTML=`<section><div class="eyebrow">Estamos para ayudarte</div><h2>Contacto</h2><div class="detail-grid"><div><h3>WhatsApp</h3><p class="muted">Reemplazá el número en el código por el WhatsApp de AromaLParfum.</p><h3>Instagram</h3><p class="muted">@AromaLParfum</p><h3>Horarios</h3><p class="muted">Configurá tus horarios de atención.</p></div><form class="form" onsubmit="event.preventDefault();alert('Mensaje preparado. Conectá este formulario a tu correo o backend para recibirlo.')"><input placeholder="Nombre"><input type="email" placeholder="Email"><textarea placeholder="Mensaje"></textarea><button class="btn gold">ENVIAR MENSAJE</button></form></div></section>`}
function showAbout(){closeMenu();document.getElementById("app").innerHTML=`<section><div class="eyebrow">Nuestra historia</div><h2>Acerca de AromaLParfum</h2><p style="max-width:800px;line-height:2">AromaLParfum nace de nuestra pasión por el mundo de las fragancias y de la idea de acercar perfumes únicos a cada persona.</p><p style="max-width:800px;line-height:2">Creamos este espacio para que puedas descubrir fragancias árabes, argentinas, de diseñador y de nicho, seleccionadas para diferentes estilos, momentos y personalidades.</p><p style="max-width:800px;line-height:2">Para nosotros, un perfume no es simplemente una fragancia: es una forma de expresión, un recuerdo y una parte de nuestra identidad.</p><p style="max-width:800px;line-height:2">En AromaLParfum queremos ayudarte a encontrar esa fragancia que se sienta realmente tuya.</p></section>`}
function showAdmin(){
    closeMenu();

    document.getElementById("app").innerHTML = `
    <section class="admin">
        <div class="eyebrow">Gestión de productos</div>
        <h2>Administración</h2>

        <p class="muted">
            Los cambios se guardarán directamente en Supabase.
        </p>

        <div style="overflow-x:auto">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>ML</th>
                        <th>Stock</th>
                        <th>Descripción</th>
                        <th>Salida</th>
                        <th>Corazón</th>
                        <th>Fondo</th>
                        <th>Familia</th>
                        <th>Guardar</th>
                    </tr>
                </thead>

                <tbody>
                    ${products.map(p => `
                        <tr>
                            <td>
                                <strong>${p.nombre}</strong><br>
                                <small>${p.categoria} · ${p.genero}</small>
                            </td>

                            <td>
                                <input
                                    id="pr${p.id}"
                                    type="number"
                                    value="${p.precio}"
                                >
                            </td>

                            <td>
                                <input
                                    id="ml${p.id}"
                                    type="number"
                                    value="${p.ml}"
                                >
                            </td>

                            <td>
                                <input
                                    id="st${p.id}"
                                    type="number"
                                    value="${p.stock}"
                                >
                            </td>

                            <td>
                                <textarea
                                    id="desc${p.id}"
                                    style="min-width:220px"
                                >${p.descripcion}</textarea>
                            </td>

                            <td>
                                <input
                                    id="sal${p.id}"
                                    value="${p.salida}"
                                >
                            </td>

                            <td>
                                <input
                                    id="cor${p.id}"
                                    value="${p.corazon}"
                                >
                            </td>

                            <td>
                                <input
                                    id="fon${p.id}"
                                    value="${p.fondo}"
                                >
                            </td>

                            <td>
                                <input
                                    id="fam${p.id}"
                                    value="${p.familia}"
                                >
                            </td>

                            <td>
                                <button
                                    class="btn"
                                    onclick="adminSave(${p.id})"
                                >
                                    GUARDAR
                                </button>
                            </td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        </div>
    </section>`;
}
async function adminSave(id){

    const precio = Number(document.getElementById("pr" + id).value);
    const ml = Number(document.getElementById("ml" + id).value);
    const stock = Number(document.getElementById("st" + id).value);

    const descripcion = document.getElementById("desc" + id).value;
    const salida = document.getElementById("sal" + id).value;
    const corazon = document.getElementById("cor" + id).value;
    const fondo = document.getElementById("fon" + id).value;
    const familia = document.getElementById("fam" + id).value;

    const { data, error } = await supabaseClient
        .from("products")
        .update({
            precio,
            ml,
            stock,
            descripcion,
            salida,
            corazon,
            fondo,
            familia
        })
        .eq("id", id)
        .select()
        .single();

    if(error){
        console.error("Error actualizando producto:", error);
        alert("❌ No se pudo guardar el producto.");
        return;
    }

    const index = products.findIndex(p => p.id === id);

    if(index !== -1){
        products[index] = {
            ...products[index],
            precio: Number(data.precio),
            ml: Number(data.ml),
            stock: Number(data.stock),
            descripcion: data.descripcion,
            salida: data.salida,
            corazon: data.corazon,
            fondo: data.fondo,
            familia: data.familia
        };
    }

    alert("✅ Producto guardado correctamente.");
}

updateCounts();
cargarProductos();
</script>
