<script>
"use strict";

/* =========================
   SUPABASE
========================= */
const SUPABASE_URL = "https://klppiznssciyveufmoff.supabase.co";
const SUPABASE_KEY = "sb_publishable_lMSak0Ze-NYWwq3SCpqEaA_7UrVFU3T";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* El email que puede entrar al panel de administración */
const ADMIN_EMAILS = ["defanissantiago@gmail.com"];

/* Nombre del bucket de Storage que ya estás usando */
const STORAGE_BUCKET = "perfumes";
const PRODUCT_IMAGES_TABLE = "product_images";
const WHATSAPP_NUMBER = "5491144293913";

/* =========================
   ESTADO
========================= */
let products = [];
let productImages = {};
let productColumns = new Set();
let currentGalleryImages = [];
let cart = JSON.parse(localStorage.getItem("alp_cart") || "[]");
let fav = JSON.parse(localStorage.getItem("alp_fav") || "[]");
let filter = "Todos";

/* =========================

========================= */
const money = n => new Intl.NumberFormat("es-AR", {
  style:"currency",
  currency:"ARS",
  maximumFractionDigits:0
}).format(Number(n) || 0);

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function save(){
  localStorage.setItem("alp_cart", JSON.stringify(cart));
  localStorage.setItem("alp_fav", JSON.stringify(fav));
  updateCounts();
}

function updateCounts(){
  const cartCount = document.getElementById("cartCount");
  const favCount = document.getElementById("favCount");
  if(cartCount) cartCount.textContent = cart.reduce((a,x)=>a + x.qty,0);
  if(favCount) favCount.textContent = fav.length;
}

function showMessage(text,type="ok"){
  const el = document.getElementById("adminMessage");
  if(!el) return;
  el.className = "admin-message " + type;
  el.textContent = text;
}


/* =========================
   COMPATIBILIDAD DE COLUMNAS / MULTIFOTOS
========================= */
function supportsColumn(name){
  return productColumns.has(name);
}

function filterProductPayload(payload){
  const clean={};
  for(const [key,value] of Object.entries(payload)){
    if(productColumns.has(key)) clean[key]=value;
  }
  return clean;
}

function extractStoragePath(value){
  if(!value) return "";
  if(!/^https?:\/\//i.test(value)) return value.replace(/^perfumes\//,"");
  try{
    const url=new URL(value);
    const signedMarker=`/storage/v1/object/sign/${STORAGE_BUCKET}/`;
    const publicMarker=`/storage/v1/object/public/${STORAGE_BUCKET}/`;
    if(url.pathname.includes(signedMarker)) return decodeURIComponent(url.pathname.split(signedMarker)[1]||"");
    if(url.pathname.includes(publicMarker)) return decodeURIComponent(url.pathname.split(publicMarker)[1]||"");
  }catch(e){}
  return "";
}

async function createLongSignedUrl(path){
  if(!path) return "";
  const {data,error}=await supabaseClient.storage
    .from(STORAGE_BUCKET)
    .createSignedUrl(path,60*60*24*365*5);
  if(error){
    console.warn("No se pudo crear URL firmada:",error);
    return "";
  }
  return data?.signedUrl||"";
}

async function cargarImagenes(){
  productImages={};
  const {data,error}=await supabaseClient
    .from(PRODUCT_IMAGES_TABLE)
    .select("*")
    .order("orden",{ascending:true})
    .order("id",{ascending:true});

  if(error){
    console.warn("No se pudo cargar product_images:",error.message);
    return;
  }

  for(const relation of data||[]){
    if(!productImages[relation.product_id]) productImages[relation.product_id]=[];
    const raw=relation.image_url||"";
    let url=raw;
    let path=extractStoragePath(raw);

    if(raw && !/^https?:\/\//i.test(raw)){
      const signed=await createLongSignedUrl(raw);
      if(signed) url=signed;
    }

    if(url){
      productImages[relation.product_id].push({
        id:relation.id,
        url,
        path:path||extractStoragePath(url),
        orden:Number(relation.orden||0)
      });
    }
  }
}

function getImages(product){
  const related=productImages[product.id]||[];
  if(related.length) return related.map(x=>x.url).filter(Boolean);
  return product.img?[product.img]:[];
}

function getImageObjects(product){
  return productImages[product.id]||[];
}

function getFirstImage(product){
  return getImages(product)[0]||product.img||"";
}

/* =========================
   CARGAR PRODUCTOS
========================= */
async function cargarProductos(shouldRender=true){
  const {data,error}=await supabaseClient
    .from("products")
    .select("*")
    .order("id",{ascending:true});

  if(error){
    console.error("Error cargando productos:",error);
    document.getElementById("app").innerHTML =
      '<section><div class="empty"><h2>No se pudieron cargar los perfumes</h2><p>Revisá la conexión con Supabase y las políticas RLS.</p></div></section>';
    return;
  }

  productColumns=new Set(Object.keys((data||[])[0]||{}));

  products=(data||[]).map(p=>({
    id:p.id,
    nombre:p.nombre||"",
    precio:Number(p.precio)||0,
    ml:Number(p.ml)||0,
    categoria:p.categoria||"Otros",
    genero:p.genero||"Unisex",
    stock:Number(p.stock)||0,
    img:p.imagen_url||"",
    imagen_url:p.imagen_url||"",
    descripcion:p.descripcion||"Fragancia seleccionada de AromaLParfum.",
    salida:p.salida||"Consultar",
    corazon:p.corazon||"Consultar",
    fondo:p.fondo||"Consultar",
    familia:p.familia||"Fragancia",
    destacado:Boolean(p.destacado),
    nuevo:Boolean(p.nuevo),
    vendido:Boolean(p.vendido)
  }));

  await cargarImagenes();

  products.forEach(p=>{
    const images=getImages(p);
    if(images.length) p.img=images[0];
  });

  console.log("Productos cargados:",products);
  if(shouldRender) render();
}

========================= */

      <button class="cat" onclick="catalog('Mujer')"><strong>Mujer</strong><span>Fragancias femeninas</span></button>

  <div class="banner">

      <div><h3>Contacto</h3><p>WhatsApp e Instagram.</p></div>
      <div><h3>Información</h3><p>Consultá disponibilidad y medios de entrega.</p></div>
    </div>
  </footer>`;

function catalog(x="Todos"){

  search = "";

function renderCatalog(){
  let a = products.filter(p =>
    (filter==="Todos" || p.categoria===filter || p.genero===filter) &&
    (!search || p.nombre.toLowerCase().includes(search.toLowerCase()))
  );

  if(sort==="low") a.sort((x,y)=>x.precio-y.precio);
  if(sort==="high") a.sort((x,y)=>y.precio-x.precio);
  if(sort==="name") a.sort((x,y)=>x.nombre.localeCompare(y.nombre));

  return `
  <section>
    <div class="section-head">
      <div><div class="eyebrow">Colección</div><h2>Perfumes</h2></div>
      <span class="muted">${a.length} productos</span>
    </div>

    <div class="chips">
      ${["Todos","Hombre","Mujer","Árabe","Argentina","Nicho","Diseñador"].map(x =>
        `<button class="chip ${filter===x?"active":""}" onclick="catalog('${x}')">${x}</button>`
      ).join("")}
    </div>

    <div class="toolbar">
      <input class="search" placeholder="Buscar por perfume o marca..." value="${esc(search)}"
        oninput="search=this.value;document.getElementById('app').innerHTML=renderCatalog()">
      <select class="select" onchange="sort=this.value;document.getElementById('app').innerHTML=renderCatalog()">
        <option value="default">Ordenar</option>
        <option value="low" ${sort==="low"?"selected":""}>Precio menor a mayor</option>

        <option value="name" ${sort==="name"?"selected":""}>Nombre A-Z</option>
      </select>

    <div class="grid">
      ${a.length ? a.map(card).join("") : `<div class="empty" style="grid-column:1/-1">No encontramos perfumes con esa búsqueda.</div>`}

  </section>`;
}

/* =========================
   CARRITO
========================= */
function addCart(id){
  const p=products.find(x=>x.id===id);
  if(!p || p.stock<=0) return alert("Este perfume no tiene stock disponible.");
  const x=cart.find(x=>x.id===id);
  if(x){
    if(x.qty >= p.stock) return alert("No hay más stock disponible.");
    x.qty++;
  }else{
    cart.push({id,qty:1});
  }
  save();
  openCart();
}

function openCart(){
  document.getElementById("cart").classList.add("open");
  renderCart();
}

function closeCart(){
  document.getElementById("cart").classList.remove("open");
}

function renderCart(){
  const box=document.getElementById("cartItems");
  if(!box) return;

  if(!cart.length){
    box.innerHTML='<div class="empty">Tu carrito está vacío.</div>';
    document.getElementById("cartTotal").innerHTML="";
    return;
  }

  let total=0;

  box.innerHTML=cart.map(x=>{
    const p=products.find(p=>p.id===x.id);
    if(!p) return "";
    const sub=p.precio*x.qty;
    total+=sub;

    return `
    <div class="cart-item">
      <div class="cart-thumb">
        ${p.img ? `<img src="${esc(p.img)}" alt="">` : esc(p.nombre)}
      </div>
      <div>
        <b>${esc(p.nombre)}</b>
        <div class="muted">${money(p.precio)}</div>
        <div class="qty">
          <button onclick="changeQty(${p.id},-1)">−</button>
          ${x.qty}
          <button onclick="changeQty(${p.id},1)">+</button>
          <button onclick="removeCart(${p.id})" style="border:0;background:none">🗑</button>
        </div>
      </div>
      <b>${money(sub)}</b>
    </div>`;
  }).join("");

  document.getElementById("cartTotal").innerHTML=`<div class="cart-total">Total: ${money(total)}</div>`;
}

function changeQty(id,n){
  const x=cart.find(x=>x.id===id);
  const p=products.find(p=>p.id===id);
  if(!x || !p) return;

  if(n>0 && x.qty>=p.stock) return alert("No hay más stock disponible.");

  x.qty+=n;
  if(x.qty<=0) cart=cart.filter(y=>y.id!==id);
  save();
  renderCart();
}

function removeCart(id){
  cart=cart.filter(x=>x.id!==id);
  save();
  renderCart();
}

      <div class="radio-row">
        <label class="radio-card"><input type="radio" name="paymentMethod" value="Transferencia"> Transferencia</label>
        <label class="radio-card"><input type="radio" name="paymentMethod" value="Mercado Pago"> Mercado Pago</label>
        <label class="radio-card"><input type="radio" name="paymentMethod" value="Efectivo"> Efectivo</label>
        <label class="radio-card"><input type="radio" name="paymentMethod" value="Otro"> Otro</label>
      </div>
    </div>

    <div class="checkout-box">
      <h3>Entrega</h3>
      <div class="radio-row">
        <label class="radio-card"><input type="radio" name="shippingMethod" value="Sí" onchange="toggleShippingFields(true)"> Con envío</label>
        <label class="radio-card"><input type="radio" name="shippingMethod" value="No" onchange="toggleShippingFields(false)" checked> Retiro / encuentro</label>
      </div>

      <div id="shippingFields" class="form hidden" style="margin-top:14px">
        <input id="caddress" placeholder="Dirección / zona de envío">
        <div class="checkout-grid">
          <input id="ccity" placeholder="Ciudad / localidad">
          <input id="cprov" placeholder="Provincia">
        </div>
        <input id="cp" placeholder="Código postal (opcional)">

function toggleShippingFields(show){
  const box=document.getElementById("shippingFields");
  if(box) box.classList.toggle("hidden",!show);
}

function selectedRadio(name){
  return document.querySelector(`input[name="${name}"]:checked`)?.value||"";
}

function sendOrder(){
  const name=document.getElementById("cname")?.value.trim()||"";
  const tel=document.getElementById("ctel")?.value.trim()||"";
  const email=document.getElementById("cemail")?.value.trim()||"";
  const payment=selectedRadio("paymentMethod");
  const shipping=selectedRadio("shippingMethod")||"No";

  if(!name) return alert("Completá tu nombre y apellido.");
  if(!tel) return alert("Completá tu número de teléfono.");
  if(!email) return alert("Completá tu correo electrónico.");
  if(!payment) return alert("Seleccioná un método de pago.");

  let address="",city="",prov="",postal="";
  if(shipping==="Sí"){
    address=document.getElementById("caddress")?.value.trim()||"";
    city=document.getElementById("ccity")?.value.trim()||"";
    prov=document.getElementById("cprov")?.value.trim()||"";
    postal=document.getElementById("cp")?.value.trim()||"";
    if(!address||!city||!prov) return alert("Completá dirección, ciudad/localidad y provincia para el envío.");
  }

  const lines=cart.map(x=>{
    const p=products.find(p=>p.id===x.id);
    return p ? `• ${p.nombre} (${p.ml} ml) x${x.qty} — ${money(p.precio*x.qty)}` : "";
  }).filter(Boolean).join("\n");

  const total=cart.reduce((s,x)=>{
    const p=products.find(p=>p.id===x.id);
    return s+(p?p.precio*x.qty:0);
  },0);

  let msg=`Hola AromaLParfum, quiero hacer este pedido:\n\n🛍️ PRODUCTOS\n${lines}\n\n💰 TOTAL: ${money(total)}\n\n👤 DATOS DEL CLIENTE\nNombre: ${name}\nTeléfono: ${tel}\nCorreo: ${email}\nMétodo de pago: ${payment}\n¿Con envío?: ${shipping}`;

  if(shipping==="Sí"){
    msg+=`\nDirección / zona: ${address}\nCiudad / localidad: ${city}\nProvincia: ${prov}`;
    if(postal) msg+=`\nCódigo postal: ${postal}`;
  }

  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank");
}

async function adminLogin(event){
  event.preventDefault();

  const email=document.getElementById("adminEmail").value.trim();
  const password=document.getElementById("adminPassword").value;

  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});

  if(error){
    console.error("Error de login:",error);
    const box=document.getElementById("loginMessage");
    box.className="admin-message error";
    box.textContent="❌ Email o contraseña incorrectos.";
    return;
  }

  if(!ADMIN_EMAILS.includes((data.user.email||"").toLowerCase())){
    await supabaseClient.auth.signOut();
    const box=document.getElementById("loginMessage");
    box.className="admin-message error";
    box.textContent="❌ Este usuario no tiene permisos de administrador.";
    return;
  }

  renderAdmin();
}

async function signOut(){
  await supabaseClient.auth.signOut();
  render();
}

async function recoverPassword(){
  const email=document.getElementById("adminEmail")?.value.trim();
  if(!email) return alert("Primero escribí tu email.");

  const redirect=window.location.origin + window.location.pathname;

  const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:redirect});

  if(error){
    console.error("Error recuperación:",error);
    alert("No se pudo enviar el correo. Si aparece 'rate limit exceeded', esperá un tiempo antes de volver a solicitarlo.");
    return;
  }

  alert("Si el email existe, Supabase enviará el correo de recuperación.");
}

function previewNewProductImages(files){
  const box=document.getElementById("newImagesPreview");
  if(!box) return;
  box.innerHTML="";
  Array.from(files||[]).forEach(file=>{
    if(!file.type.startsWith("image/")) return;
    const img=document.createElement("img");
    img.src=URL.createObjectURL(file);
    img.alt="Vista previa";
    box.appendChild(img);
  });
}

async function createProduct(event){
  event.preventDefault();
  const btn=event.submitter;
  if(btn){btn.disabled=true;btn.textContent="CREANDO...";}

  try{
    const name=document.getElementById("newName").value.trim();
    const price=Number(document.getElementById("newPrice").value);
    const ml=Number(document.getElementById("newMl").value);
    const stock=Number(document.getElementById("newStock").value||0);
    const category=document.getElementById("newCategory").value;
    const gender=document.getElementById("newGender").value;
    const files=Array.from(document.getElementById("newImages").files||[]);

    if(!name) throw new Error("Escribí el nombre del perfume.");
    if(!Number.isFinite(price)||price<0) throw new Error("El precio no es válido.");
    if(!Number.isFinite(ml)||ml<=0) throw new Error("Los ML no son válidos.");
    if(!Number.isFinite(stock)||stock<0) throw new Error("El stock no es válido.");

    const payload=filterProductPayload({
      nombre:name,
      precio:price,
      ml,
      categoria:category,
      genero:gender,
      stock,
      imagen_url:null,
      descripcion:document.getElementById("newDescription").value.trim()||"Fragancia seleccionada de AromaLParfum.",
      salida:document.getElementById("newSalida").value.trim()||"Consultar",
      corazon:document.getElementById("newCorazon").value.trim()||"Consultar",
      fondo:document.getElementById("newFondo").value.trim()||"Consultar",
      familia:document.getElementById("newFamilia").value.trim()||"Fragancia",
      destacado:document.getElementById("newFeatured").checked,
      nuevo:document.getElementById("newIsNew").checked,
      vendido:false
    });

    const {data,error}=await supabaseClient.from("products").insert(payload).select("*").single();
    if(error) throw error;
    if(!data?.id) throw new Error("Supabase no devolvió el ID del producto creado.");

    let firstSignedUrl="";
    for(let i=0;i<files.length;i++){
      const uploaded=await uploadImageFile(files[i]);
      const relation=await saveImageRelation(data.id,uploaded.path,i,uploaded.signedUrl);
      if(i===0) firstSignedUrl=relation.url||uploaded.signedUrl;
    }

    if(firstSignedUrl && productColumns.has("imagen_url")){
      const {error:imageUpdateError}=await supabaseClient.from("products").update({imagen_url:firstSignedUrl}).eq("id",data.id);
      if(imageUpdateError) console.warn("No se pudo guardar imagen principal:",imageUpdateError);
    }

    closeModal();
    await cargarProductos(false);
    renderAdmin();
    showMessage("✅ Perfume agregado correctamente.","ok");
  }catch(error){
    console.error("Error creando producto:",error);
    const box=document.getElementById("newProductMessage");
    if(box){box.className="admin-message error";box.textContent="❌ No se pudo crear el perfume: "+(error.message||error);}
    else alert("No se pudo crear el perfume: "+(error.message||error));
  }finally{
    if(btn){btn.disabled=false;btn.textContent="CREAR PERFUME";}
  }
}

async function adminSave(id){
  const p=products.find(x=>x.id===id);
  if(!p) return;

  try{
    const payload=filterProductPayload({
      nombre:document.getElementById("name-"+id).value.trim(),
      precio:Number(document.getElementById("price-"+id).value),
      ml:Number(document.getElementById("ml-"+id).value),
      stock:Number(document.getElementById("stock-"+id).value),
      categoria:document.getElementById("cat-"+id).value,
      genero:document.getElementById("gender-"+id).value,
      descripcion:document.getElementById("desc-"+id).value.trim(),
      salida:document.getElementById("out-"+id).value.trim(),
      corazon:document.getElementById("heart-"+id).value.trim(),
      fondo:document.getElementById("base-"+id).value.trim(),
      familia:document.getElementById("family-"+id).value.trim(),
      destacado:document.getElementById("featured-"+id)?.checked,
      nuevo:document.getElementById("new-"+id)?.checked
    });

    if(!payload.nombre) throw new Error("El nombre no puede estar vacío.");
    if(payload.precio<0||!Number.isFinite(payload.precio)) throw new Error("Precio inválido.");
    if(payload.ml<=0||!Number.isFinite(payload.ml)) throw new Error("ML inválidos.");
    if(payload.stock<0||!Number.isFinite(payload.stock)) throw new Error("Stock inválido.");

    const {data,error}=await supabaseClient.from("products").update(payload).eq("id",id).select("*");
    if(error) throw error;
    if(!data?.length) throw new Error("Supabase no actualizó ninguna fila. Revisá las políticas RLS de products.");

    Object.assign(p,payload);
    showMessage("✅ "+p.nombre+" guardado correctamente.","ok");
  }catch(error){
    console.error("Error actualizando producto:",error);
    showMessage("❌ Error al guardar: "+(error.message||error),"error");
  }
}

/* =========================
   STORAGE / FOTOS
========================= */
async function uploadImageFile(file){
  if(!file) throw new Error("No se seleccionó una imagen.");
  if(!file.type.startsWith("image/")) throw new Error("El archivo seleccionado no es una imagen.");
  if(file.size>8*1024*1024) throw new Error("La imagen es demasiado grande. Máximo 8 MB.");

  const extension=(file.name.split(".").pop()||"jpg").toLowerCase();
  const safeName=file.name.replace(/\.[^/.]+$/,"").toLowerCase().replace(/[^a-z0-9áéíóúñ_-]+/gi,"-").replace(/-+/g,"-").slice(0,50)||"imagen";
  const path=`productos/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safeName}.${extension}`;

  const {error}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type});
  if(error) throw new Error("No se pudo subir la imagen: "+error.message);

  const signedUrl=await createLongSignedUrl(path);
  if(!signedUrl) throw new Error("La imagen se subió, pero no se pudo crear su URL firmada.");
  return {path,signedUrl};
}

async function saveImageRelation(productId,path,order,signedUrl=""){
  const url=signedUrl||await createLongSignedUrl(path);
  if(!url) throw new Error("No se pudo crear la URL de la foto.");

  /* Se guarda la URL firmada para que la tienda pública pueda verla aunque el bucket sea privado. */
  const {data,error}=await supabaseClient.from(PRODUCT_IMAGES_TABLE).insert({
    product_id:productId,
    image_url:url,
    orden:order
  }).select("*").single();
  if(error) throw new Error("No se pudo relacionar la foto con el perfume: "+error.message);
  return {id:data.id,path,url,orden:order};
}

async function uploadProductImages(id,files){
  const selected=Array.from(files||[]);
  if(!selected.length) return;
  const status=document.getElementById("upload-status-"+id);

  try{
    if(status) status.textContent=`Subiendo ${selected.length} foto(s)...`;
    let order=(productImages[id]||[]).length;
    let firstNewUrl="";

    for(const file of selected){
      const uploaded=await uploadImageFile(file);
      const relation=await saveImageRelation(id,uploaded.path,order++,uploaded.signedUrl);
      if(!firstNewUrl) firstNewUrl=relation.url;
    }

    const p=products.find(x=>x.id===id);
    if(p && !p.imagen_url && firstNewUrl && productColumns.has("imagen_url")){
      const {error}=await supabaseClient.from("products").update({imagen_url:firstNewUrl}).eq("id",id);
      if(error) console.warn("No se pudo guardar la foto principal:",error);
    }

    await cargarProductos(false);
    renderAdmin();
    showMessage("✅ Fotos subidas correctamente.","ok");
  }catch(error){
    console.error("Error subiendo imágenes:",error);
    if(status) status.textContent="Error subiendo las fotos.";
    showMessage("❌ "+(error.message||"No se pudieron subir las fotos."),"error");
  }
}

async function deleteProductImage(relationId,productId,path){
  if(!confirm("¿Querés eliminar esta foto?")) return;

  try{
    const {error}=await supabaseClient.from(PRODUCT_IMAGES_TABLE).delete().eq("id",relationId);
    if(error) throw error;

    const storagePath=path||"";
    if(storagePath){
      const removeResult=await supabaseClient.storage.from(STORAGE_BUCKET).remove([storagePath]);
      if(removeResult.error) console.warn("La relación se eliminó, pero el archivo no pudo borrarse del Storage:",removeResult.error);
    }

    await cargarProductos(false);

    /* Si se eliminó la principal, actualizamos imagen_url con la nueva primera foto. */
    const p=products.find(x=>x.id===productId);
    const nextMain=p?getFirstImage(p):"";
    if(productColumns.has("imagen_url")){
      const {error:mainError}=await supabaseClient.from("products").update({imagen_url:nextMain||null}).eq("id",productId);
      if(mainError) console.warn("No se pudo actualizar imagen principal:",mainError);
      if(p){p.imagen_url=nextMain||"";p.img=nextMain||"";}
    }

    renderAdmin();
    showMessage("✅ Foto eliminada correctamente.","ok");
  }catch(error){
    console.error("Error eliminando foto:",error);
    showMessage("❌ No se pudo eliminar la foto: "+(error.message||error),"error");
  }
}

/* =========================
   ELIMINAR
========================= */
async function deleteProduct(id){
  const p=products.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`¿Seguro que querés eliminar "${p.nombre}"?`)) return;

  try{
    const images=getImageObjects(p);
    const paths=images.map(x=>x.path).filter(Boolean);

    if(images.length){
      const {error:imageRowsError}=await supabaseClient.from(PRODUCT_IMAGES_TABLE).delete().eq("product_id",id);
      if(imageRowsError) console.warn("No se pudieron eliminar todas las relaciones de fotos:",imageRowsError);
    }

    if(paths.length){
      const removeResult=await supabaseClient.storage.from(STORAGE_BUCKET).remove(paths);
      if(removeResult.error) console.warn("No se pudieron borrar todos los archivos del Storage:",removeResult.error);
    }

    const {data,error}=await supabaseClient.from("products").delete().eq("id",id).select("id");
    if(error) throw error;
    if(!data?.length) throw new Error("Supabase no eliminó ninguna fila. Revisá las políticas RLS.");

    products=products.filter(x=>x.id!==id);
    delete productImages[id];
    cart=cart.filter(x=>x.id!==id);
    fav=fav.filter(x=>x!==id);
    save();
    renderAdmin();
    showMessage("✅ Producto eliminado correctamente.","ok");
  }catch(error){
    console.error("Error eliminando:",error);
    showMessage("❌ No se pudo eliminar: "+(error.message||error),"error");
  }
}

<!--
======================================================================
AROMALPARFUM - NOTAS DE MANTENIMIENTO
======================================================================
Este archivo fue construido a partir del index completo de más de 1000 líneas
y conserva las funciones existentes, agregando las mejoras solicitadas.

ARQUITECTURA:
- products: tabla principal de perfumes.
- product_images: tabla de múltiples fotos.
- perfumes: bucket privado de Supabase Storage.
- Supabase Auth: protege el panel administrador.
- localStorage: conserva carrito y favoritos en el navegador del cliente.

CHECKOUT:
- El cliente NO necesita crear una cuenta.
- Se solicita nombre, teléfono, correo y método de pago.
- Se pregunta si el pedido es con envío.
- Solo si elige envío aparecen dirección, ciudad/localidad y provincia.
- WhatsApp recibe productos, cantidades, total y datos del cliente.

ADMINISTRACIÓN:
- Alta de perfumes desde el panel.
- Edición de nombre, precio, ML, stock, categoría, género, descripción y notas.
- Múltiples imágenes por producto.
- Eliminación de fotos individuales.
- Eliminación completa de productos.
- Las columnas opcionales destacado/nuevo solo se usan si existen en products.
- Esto evita que la creación falle por columnas que todavía no estén creadas.

STORAGE PRIVADO:
- Las nuevas fotos se suben al bucket perfumes.
- El administrador crea una URL firmada de larga duración al subir cada foto.
- product_images guarda esa URL para que la tienda pública pueda mostrarla.
- También se conserva internamente la ruta derivada para poder borrar archivos.

SEGURIDAD:
- Nunca colocar una service_role key dentro de este archivo.
- La publishable key es la apropiada para frontend.
- La seguridad real de insert/update/delete depende de RLS en Supabase.
- El panel también comprueba ADMIN_EMAILS después del login.
