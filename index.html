const SUPABASE_URL="https://klppiznssciyveufmoff.supabase.co",SUPABASE_KEY="sb_publishable_lMSak0Ze-NYWwq3SCpqEaA_7UrVFU3T",STORAGE_BUCKET="perfumes",ADMIN_EMAILS=["defanissantiago@gmail.com"];const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let products=[],productImages={},cart=JSON.parse(localStorage.getItem("alp_cart")||"[]"),fav=JSON.parse(localStorage.getItem("alp_fav")||"[]"),filter="Todos",sort="default",search="";

function save(){localStorage.setItem("alp_cart",JSON.stringify(cart));localStorage.setItem("alp_fav",JSON.stringify(fav));updateCounts()}function updateCounts(){let c=document.getElementById("cartCount"),f=document.getElementById("favCount");if(c)c.textContent=cart.reduce((a,x)=>a+x.qty,0);if(f)f.textContent=fav.length}function showMessage(t,type="ok"){let e=document.getElementById("adminMessage");if(e){e.style.display="block";e.className="admin-message "+type;e.textContent=t}}
async function cargarImagenes(){productImages={};const {data,error}=await supabaseClient.from("product_images").select("*").order("orden",{ascending:true}).order("id",{ascending:true});if(error){console.warn("product_images:",error.message);return}for(const r of data||[]){productImages[r.product_id]??=[];let url=r.image_url?.startsWith("http")?r.image_url:"";if(!url&&r.image_url){let s=await supabaseClient.storage.from(STORAGE_BUCKET).createSignedUrl(r.image_url,2592000);url=s.data?.signedUrl||""}if(url)productImages[r.product_id].push({id:r.id,url,path:r.image_url,orden:r.orden||0})}}
async function cargarProductos(){const {data,error}=await supabaseClient.from("products").select("*").order("id",{ascending:true});if(error){console.error(error);document.getElementById("app").innerHTML='<section><div class="empty"><h2>No se pudieron cargar los perfumes</h2></div></section>';return}products=(data||[]).map(p=>({id:p.id,nombre:p.nombre||"",precio:+p.precio||0,ml:+p.ml||0,categoria:p.categoria||"Otros",genero:p.genero||"Unisex",stock:+p.stock||0,img:p.imagen_url||"",descripcion:p.descripcion||"Fragancia seleccionada de AromaLParfum.",salida:p.salida||"Consultar",corazon:p.corazon||"Consultar",fondo:p.fondo||"Consultar",familia:p.familia||"Fragancia",destacado:!!p.destacado,nuevo:!!p.nuevo,vendido:!!p.vendido}));await cargarImagenes();products.forEach(p=>{let a=productImages[p.id]||[];if(a.length)p.img=a[0].url});console.log("Productos cargados:",products);render()}
function getImages(p){let a=productImages[p.id]||[];return a.length?a.map(x=>x.url):p.img?[p.img]:[]}
function render(){document.getElementById("app").innerHTML=home();updateCounts()}function home(){let a=products.filter(p=>p.destacado).slice(0,8);if(!a.length)a=products.slice(0,4);return `<div class="hero"><div><div class="eyebrow">AromaLParfum</div><h1>Encontrá tu<br>próxima fragancia.</h1><p>Descubrí perfumes árabes, argentinos, de diseñador y de nicho seleccionados para distintos estilos y momentos.</p><button class="btn light" onclick="catalog('Todos')">VER PERFUMES</button></div></div><section><div class="section-head"><div><div class="eyebrow">Explorá</div><h2>Categorías</h2></div></div><div class="cats"><button class="cat" onclick="catalog('Hombre')"><strong>Hombre</strong><span>Fragancias masculinas</span></button><button class="cat" onclick="catalog('Mujer')"><strong>Mujer</strong><span>Fragancias femeninas</span></button><button class="cat" onclick="catalog('Árabe')"><strong>Árabes</strong><span>Intensas y envolventes</span></button><button class="cat" onclick="catalog('Nicho')"><strong>Nicho</strong><span>Composiciones especiales</span></button></div></section><section><div class="section-head"><div><div class="eyebrow">Selección</div><h2>Destacados</h2></div><button class="btn" onclick="catalog('Todos')">VER TODO</button></div><div class="grid">${a.map(card).join("")}</div></section><div class="banner"><div class="banner-inner"><div class="eyebrow">Tu identidad, tu aroma</div><h2>Un perfume es más que una fragancia.</h2><p>Es una forma de expresión, un recuerdo y una parte de tu identidad.</p><button class="btn gold" onclick="showAbout()">CONOCÉ AROMALPARFUM</button></div></div>`}
function catalog(x="Todos"){filter=x;search="";closeMenu();document.getElementById("app").innerHTML=renderCatalog();scrollTo(0,0)}function renderCatalog(){let a=products.filter(p=>(filter==="Todos"||p.categoria===filter||p.genero===filter)&&(!search||p.nombre.toLowerCase().includes(search.toLowerCase())));if(sort==="low")a.sort((x,y)=>x.precio-y.precio);if(sort==="high")a.sort((x,y)=>y.precio-x.precio);if(sort==="name")a.sort((x,y)=>x.nombre.localeCompare(y.nombre));return `<section><div class="section-head"><div><div class="eyebrow">Colección</div><h2>Perfumes</h2></div><span class="muted">${a.length} productos</span></div><div class="chips">${["Todos","Hombre","Mujer","Árabe","Argentina","Nicho","Diseñador"].map(x=>`<button class="chip ${filter===x?"active":""}" onclick="catalog('${x}')">${x}</button>`).join("")}</div><div class="toolbar"><input class="search" placeholder="Buscar por perfume o marca..." value="${esc(search)}" oninput="search=this.value;document.getElementById('app').innerHTML=renderCatalog()"><select class="select" onchange="sort=this.value;document.getElementById('app').innerHTML=renderCatalog()"><option value="default">Ordenar</option><option value="low">Precio menor a mayor</option><option value="high">Precio mayor a menor</option><option value="name">Nombre A-Z</option></select></div><div class="grid">${a.length?a.map(card).join(""):'<div class="empty" style="grid-column:1/-1">No encontramos perfumes.</div>'}</div></section>`}
function card(p){let a=getImages(p),favv=fav.includes(p.id);return `<article class="product"><div class="pic">${a[0]?`<img src="${esc(a[0])}" alt="${esc(p.nombre)}" loading="lazy">`:`<div class="placeholder">${esc(p.nombre)}<br><small>${p.ml} ml</small></div>`}<button class="heart ${favv?"active":""}" onclick="toggleFav(${p.id})">${favv?"♥":"♡"}</button></div><div class="info"><div class="brandline">${esc(p.categoria)} · ${esc(p.genero)}</div><h3>${esc(p.nombre)}</h3><div class="meta">${p.ml} ml</div><div class="price">${money(p.precio)}</div><div class="stock">${p.stock>0?"● Disponible":"● Sin stock"}</div><button class="btn" onclick="productDetail(${p.id})">VER PERFUME</button></div></article>`}
function productDetail(id){let p=products.find(x=>x.id===id);if(!p)return;let a=getImages(p);document.getElementById("app").innerHTML=`<div class="detail"><button class="btn" onclick="catalog(filter)">← VOLVER</button><div class="detail-grid" style="margin-top:25px"><div><div class="gallery-main" id="mainGallery">${a[0]?`<img src="${esc(a[0])}" alt="${esc(p.nombre)}">`:`<div class="placeholder">${esc(p.nombre)}<br>${p.ml} ml</div>`}</div><div class="thumbs">${a.map((u,i)=>`<button class="thumb ${i===0?"active":""}" onclick="setMainImage(${JSON.stringify(u)},this)"><img src="${esc(u)}" alt=""></button>`).join("")}</div></div><div><div class="eyebrow">${esc(p.categoria)} · ${esc(p.genero)}</div><h1>${esc(p.nombre)}</h1><div class="price" style="font-size:28px">${money(p.precio)}</div><p class="muted">${p.ml} ml · ${p.stock>0?"● Disponible":"● Sin stock"}</p><p style="line-height:1.7">${esc(p.descripcion)}</p><button class="btn gold" onclick="addCart(${p.id})" ${p.stock<=0?"disabled":""}>AGREGAR AL CARRITO</button><button class="btn" style="margin-left:8px" onclick="toggleFav(${p.id});productDetail(${p.id})">${fav.includes(p.id)?"♥ EN FAVORITOS":"♡ FAVORITOS"}</button><div class="notes"><div class="note"><b>Salida</b>${esc(p.salida)}</div><div class="note"><b>Corazón</b>${esc(p.corazon)}</div><div class="note"><b>Fondo</b>${esc(p.fondo)}</div></div><div class="info-list"><div><b>Familia olfativa</b>${esc(p.familia)}</div><div><b>Tamaño</b>${p.ml} ml</div><div><b>Stock</b>${p.stock}</div><div><b>Duración</b>Consultar</div><div><b>Proyección</b>Consultar</div><div><b>Uso</b>Diario / salidas / ocasiones especiales</div></div></div></div></div>`;scrollTo(0,0)}function setMainImage(u,b){document.getElementById("mainGallery").innerHTML=`<img src="${esc(u)}" alt="">`;document.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
function toggleFav(id){fav.includes(id)?fav=fav.filter(x=>x!==id):fav.push(id);save();showFavorites()}function showFavorites(){closeMenu();let a=products.filter(p=>fav.includes(p.id));document.getElementById("app").innerHTML=`<section><div class="eyebrow">Guardados</div><h2>Favoritos</h2>${a.length?`<div class="grid">${a.map(card).join("")}</div>`:`<div class="empty"><h3>Todavía no tienes perfumes favoritos.</h3><button class="btn" onclick="catalog('Todos')">DESCUBRIR PERFUMES</button></div>`}</section>`}
function addCart(id){let p=products.find(x=>x.id===id);if(!p||p.stock<=0)return alert("Sin stock disponible.");let x=cart.find(x=>x.id===id);if(x){if(x.qty>=p.stock)return alert("No hay más stock disponible.");x.qty++}else cart.push({id,qty:1});save();openCart()}function openCart(){document.getElementById("cart").classList.add("open");renderCart()}function closeCart(){document.getElementById("cart").classList.remove("open")}function renderCart(){let b=document.getElementById("cartItems");if(!b)return;if(!cart.length){b.innerHTML='<div class="empty">Tu carrito está vacío.</div>';document.getElementById("cartTotal").innerHTML="";return}let total=0;b.innerHTML=cart.map(x=>{let p=products.find(p=>p.id===x.id);if(!p)return"";let s=p.precio*x.qty;total+=s;return `<div class="cart-item"><div class="cart-thumb">${p.img?`<img src="${esc(p.img)}">`:esc(p.nombre)}</div><div><b>${esc(p.nombre)}</b><div class="muted">${money(p.precio)}</div><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button>${x.qty}<button onclick="changeQty(${p.id},1)">+</button><button onclick="removeCart(${p.id})" style="border:0;background:none">🗑</button></div></div><b>${money(s)}</b></div>`}).join("");document.getElementById("cartTotal").innerHTML=`<div class="cart-total">Total: ${money(total)}</div>`}function changeQty(id,n){let x=cart.find(x=>x.id===id),p=products.find(p=>p.id===id);if(!x||!p)return;if(n>0&&x.qty>=p.stock)return alert("No hay más stock disponible.");x.qty+=n;if(x.qty<=0)cart=cart.filter(y=>y.id!==id);save();renderCart()}function removeCart(id){cart=cart.filter(x=>x.id!==id);save();renderCart()}
function checkout(){if(!cart.length)return alert("El carrito está vacío.");let total=cart.reduce((s,x)=>{let p=products.find(p=>p.id===x.id);return s+(p?p.precio*x.qty:0)},0);document.getElementById("modalBody").innerHTML=`<h2>Finalizar pedido</h2><div class="form"><input id="cname" placeholder="Nombre y apellido"><input id="ctel" placeholder="Teléfono"><button class="btn gold" onclick="sendOrder()">ENVIAR PEDIDO POR WHATSAPP · ${money(total)}</button></div>`;document.getElementById("modal").classList.add("open")}function sendOrder(){let name=document.getElementById("cname").value||"Cliente",lines=cart.map(x=>{let p=products.find(p=>p.id===x.id);return `• ${p.nombre} (${p.ml} ml) x${x.qty} — ${money(p.precio*x.qty)}`}).join("\n"),total=cart.reduce((s,x)=>{let p=products.find(p=>p.id===x.id);return s+(p?p.precio*x.qty:0)},0);window.open("https://wa.me/5491144293913?text="+encodeURIComponent(`Hola, soy ${name}. Quiero hacer este pedido:\n${lines}\n\nTotal: ${money(total)}`),"_blank")}
function showContact(){closeMenu();document.getElementById("app").innerHTML=`<section><div class="eyebrow">Estamos para ayudarte</div><h2>Contacto</h2><p class="muted">WhatsApp: 11 4429-3913</p><p class="muted">Instagram: @AromaLParfum</p></section>`}function showAbout(){closeMenu();document.getElementById("app").innerHTML=`<section><div class="eyebrow">Nuestra historia</div><h2>Acerca de AromaLParfum</h2><p style="max-width:800px;line-height:2">AromaLParfum nace de nuestra pasión por el mundo de las fragancias y de la idea de acercar perfumes únicos a cada persona.</p><p style="max-width:800px;line-height:2">Creamos este espacio para descubrir fragancias árabes, argentinas, de diseñador y de nicho.</p></section>`}
async function showAdmin(){closeMenu();let {data:{session}}=await supabaseClient.auth.getSession();if(!session){document.getElementById("app").innerHTML=`<section style="max-width:500px;margin:auto"><div class="eyebrow">Área privada</div><h2>Administración</h2><div class="form"><input id="adminEmail" type="email" placeholder="Email"><input id="adminPassword" type="password" placeholder="Contraseña"><button class="btn gold" onclick="adminLogin()">INGRESAR</button><button class="btn" onclick="recoverPassword()">RECUPERAR CONTRASEÑA</button></div><p id="loginMessage" class="muted"></p></section>`;return}if(!ADMIN_EMAILS.includes((session.user.email||"").toLowerCase())){await supabaseClient.auth.signOut();return render()}renderAdmin()}
async function adminLogin(){let email=document.getElementById("adminEmail").value.trim(),password=document.getElementById("adminPassword").value,message=document.getElementById("loginMessage");let {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){message.textContent="❌ Email o contraseña incorrectos.";return}if(!ADMIN_EMAILS.includes((data.user.email||"").toLowerCase())){await supabaseClient.auth.signOut();message.textContent="❌ Sin permisos de administrador.";return}renderAdmin()}async function signOut(){await supabaseClient.auth.signOut();render()}async function recoverPassword(){let email=document.getElementById("adminEmail")?.value.trim();if(!email)return alert("Primero escribí tu email.");let {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)return alert("No se pudo enviar el correo: "+error.message);alert("Revisá tu correo.")}
function renderAdmin(){document.getElementById("app").innerHTML=`<section class="admin"><div class="admin-top"><div><div class="eyebrow">Gestión de productos</div><h2>Administración</h2><p class="muted">Agregá perfumes y seleccioná varias fotos sin tocar el código.</p></div><div class="admin-actions"><button class="btn gold" onclick="openNewProduct()">+ AGREGAR PERFUME</button><button class="btn" onclick="cargarProductos().then(()=>renderAdmin())">ACTUALIZAR</button><button class="btn danger" onclick="signOut()">CERRAR SESIÓN</button></div></div><div id="adminMessage" class="admin-message" style="display:none"></div><div id="newProductBox"></div><div class="admin-wrap"><table><thead><tr><th>Fotos</th><th>Producto</th><th>Precio</th><th>ML</th><th>Stock</th><th>Categoría</th><th>Género</th><th>Descripción</th><th>Salida</th><th>Corazón</th><th>Fondo</th><th>Familia</th><th>Guardar</th><th>Eliminar</th></tr></thead><tbody>${products.map(adminRow).join("")}</tbody></table></div></section>`}
function adminRow(p){let a=getImages(p);return `<tr id="row-${p.id}"><td><div class="image-list">${a.map(u=>`<img class="image-mini" src="${esc(u)}">`).join("")||'<span class="muted">Sin fotos</span>'}</div><input class="admin-file" type="file" accept="image/*" multiple onchange="uploadProductImages(${p.id},this.files)"><small class="muted">Elegí varias fotos.</small></td><td><input id="name-${p.id}" value="${esc(p.nombre)}"></td><td><input id="price-${p.id}" type="number" value="${p.precio}"></td><td><input id="ml-${p.id}" type="number" value="${p.ml}"></td><td><input id="stock-${p.id}" type="number" value="${p.stock}"></td><td><select id="cat-${p.id}">${["Árabe","Argentina","Nicho","Diseñador","Otros"].map(x=>`<option ${p.categoria===x?"selected":""}>${x}</option>`).join("")}</select></td><td><select id="gender-${p.id}">${["Hombre","Mujer","Unisex"].map(x=>`<option ${p.genero===x?"selected":""}>${x}</option>`).join("")}</select></td><td><textarea id="desc-${p.id}">${esc(p.descripcion)}</textarea></td><td><input id="out-${p.id}" value="${esc(p.salida)}"></td><td><input id="heart-${p.id}" value="${esc(p.corazon)}"></td><td><input id="base-${p.id}" value="${esc(p.fondo)}"></td><td><input id="family-${p.id}" value="${esc(p.familia)}"></td><td><button class="btn" onclick="adminSave(${p.id})">GUARDAR</button></td><td><button class="btn danger" onclick="deleteProduct(${p.id})">ELIMINAR</button></td></tr>`}
function openNewProduct(){document.getElementById("newProductBox").innerHTML=`<div class="new-product"><h3>Agregar perfume</h3><div class="form"><input id="nuevoNombre" placeholder="Nombre"><input id="nuevoPrecio" type="number" placeholder="Precio"><input id="nuevoMl" type="number" placeholder="ML"><input id="nuevoStock" type="number" value="1" placeholder="Stock"><select id="nuevoCategoria"><option>Árabe</option><option>Argentina</option><option>Nicho</option><option>Diseñador</option><option>Otros</option></select><select id="nuevoGenero"><option>Hombre</option><option>Mujer</option><option>Unisex</option></select><input id="nuevoFamilia" placeholder="Familia olfativa"><textarea id="nuevoDescripcion" placeholder="Descripción"></textarea><input id="nuevoSalida" placeholder="Notas de salida"><input id="nuevoCorazon" placeholder="Notas de corazón"><input id="nuevoFondo" placeholder="Notas de fondo"><label><b>Fotos del perfume — podés seleccionar varias</b><input id="nuevoImagenes" type="file" accept="image/*" multiple onchange="previewNewImages(this.files)" style="display:block;margin-top:8px"></label><div id="newImagePreview" class="image-preview-grid"></div><div style="display:flex;gap:10px"><button class="btn gold" onclick="crearProducto()">GUARDAR PERFUME</button><button class="btn" onclick="document.getElementById('newProductBox').innerHTML=''">CANCELAR</button></div></div></div>`}
function previewNewImages(files){let b=document.getElementById("newImagePreview");b.innerHTML="";[...files].forEach(f=>{let i=document.createElement("img");i.className="image-preview";i.src=URL.createObjectURL(f);b.appendChild(i)})}
async function uploadImageFile(file){if(!file.type.startsWith("image/"))throw Error("El archivo no es una imagen.");if(file.size>8*1024*1024)throw Error("Máximo 8 MB por imagen.");let ext=(file.name.split(".").pop()||"jpg").toLowerCase(),safe=file.name.replace(/\.[^/.]+$/,'').toLowerCase().replace(/[^a-z0-9áéíóúñ_-]+/gi,'-').slice(0,50),path=`productos/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safe}.${ext}`;let {error}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return path}
async function saveImageRelation(id,path,orden){let {data,error}=await supabaseClient.from("product_images").insert({product_id:id,image_url:path,orden}).select().single();if(error)throw error;let s=await supabaseClient.storage.from(STORAGE_BUCKET).createSignedUrl(path,2592000);return {id:data.id,path,url:s.data?.signedUrl||""}}
async function uploadProductImages(id,files){if(!files?.length)return;try{showMessage(`Subiendo ${files.length} foto(s)...`);let start=(productImages[id]||[]).length;for(let i=0;i<files.length;i++){let path=await uploadImageFile(files[i]),r=await saveImageRelation(id,path,start+i);productImages[id]??=[];if(r.url)productImages[id].push(r)}await cargarProductos();renderAdmin();showMessage("✅ Fotos subidas correctamente.")}catch(e){console.error(e);showMessage("❌ Error subiendo fotos: "+e.message,"error")}}
async function crearProducto(){let nombre=document.getElementById("nuevoNombre").value.trim(),precio=+document.getElementById("nuevoPrecio").value,ml=+document.getElementById("nuevoMl").value,stock=+document.getElementById("nuevoStock").value,categoria=document.getElementById("nuevoCategoria").value,genero=document.getElementById("nuevoGenero").value,familia=document.getElementById("nuevoFamilia").value.trim(),descripcion=document.getElementById("nuevoDescripcion").value.trim(),salida=document.getElementById("nuevoSalida").value.trim(),corazon=document.getElementById("nuevoCorazon").value.trim(),fondo=document.getElementById("nuevoFondo").value.trim(),files=document.getElementById("nuevoImagenes").files;if(!nombre||!precio||!ml)return alert("Completá nombre, precio y ML.");let {data:p,error}=await supabaseClient.from("products").insert({nombre,precio,ml,categoria,genero,stock,descripcion:descripcion||"Fragancia seleccionada de AromaLParfum.",salida:salida||"Consultar",corazon:corazon||"Consultar",fondo:fondo||"Consultar",familia:familia||"Fragancia",destacado:false,nuevo:true,vendido:false,imagen_url:null}).select().single();if(error)return alert("❌ "+error.message);try{for(let i=0;i<files.length;i++){let path=await uploadImageFile(files[i]);await saveImageRelation(p.id,path,i)}}catch(e){alert("El perfume se creó, pero una foto no pudo subirse: "+e.message)}await cargarProductos();renderAdmin();showMessage("✅ Perfume creado correctamente.")}
async function adminSave(id){let payload={nombre:document.getElementById("name-"+id).value.trim(),precio:+document.getElementById("price-"+id).value,ml:+document.getElementById("ml-"+id).value,stock:+document.getElementById("stock-"+id).value,categoria:document.getElementById("cat-"+id).value,genero:document.getElementById("gender-"+id).value,descripcion:document.getElementById("desc-"+id).value.trim(),salida:document.getElementById("out-"+id).value.trim(),corazon:document.getElementById("heart-"+id).value.trim(),fondo:document.getElementById("base-"+id).value.trim(),familia:document.getElementById("family-"+id).value.trim()};let {error}=await supabaseClient.from("products").update(payload).eq("id",id);if(error)return showMessage("❌ "+error.message,"error");Object.assign(products.find(x=>x.id===id),payload);showMessage("✅ Producto guardado correctamente.")}
async function deleteProduct(id){let p=products.find(x=>x.id===id);if(!p||!confirm(`¿Eliminar ${p.nombre}?`))return;let {error}=await supabaseClient.from("products").delete().eq("id",id);if(error)return showMessage("❌ "+error.message,"error");products=products.filter(x=>x.id!==id);delete productImages[id];cart=cart.filter(x=>x.id!==id);fav=fav.filter(x=>x!==id);save();renderAdmin();showMessage("✅ Producto eliminado.")}
function openMenu(){document.getElementById("menu").classList.add("open")}function closeMenu(){document.getElementById("menu").classList.remove("open")}function toggleSub(){document.getElementById("submenu").classList.toggle("open")}function closeModal(){document.getElementById("modal").classList.remove("open")}function goHome(){closeMenu();render();scrollTo(0,0)}
updateCounts();cargarProductos();supabaseClient.auth.onAuthStateChange((event,session)=>console.log("Auth:",event,session?.user?.email||"sin sesión"));
</script></body></html>
